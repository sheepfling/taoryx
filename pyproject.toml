[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx"
version = "0.1.0a0"
description = "A Python successor to the TAOS 1995 simulation system"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "taoryx contributors"}]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["pydantic>=2.8", "PyYAML>=6.0"]

[project.scripts]
taoryx = "taoryx.runtime.cli:main"
taoryx-validate = "taoryx.language.cli:main"

[project.optional-dependencies]
sensors = [
  "imu-error-model==0.1.3",
  "numpy>=2.0",
]
dev = [
  "build>=1.2",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "Pillow>=10.4",
  "PyMuPDF>=1.24",
  "pypdf>=6.0",
  "pytest>=8.3",
  "pytest-xdist>=3.8",
  "PyYAML>=6.0",
  "rapidfuzz>=3.9",
  "reportlab>=4.2",
  "scipy>=1.13",
  "ruff>=0.9",
  "mypy>=1.14",
]
scipy = ["scipy>=1.13"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not slow and not artifact and not simple_aero"]
markers = [
  "grammar: parser, lexer, EBNF, corpus, and language-validation view",
  "equations: equation catalog, implementation, provenance, and verification view",
  "algorithms: algorithm catalog, runtime bindings, and algorithm-verification view",
  "table: table parser, table fixtures, table artifacts, and table-visualization view",
  "dof3: 3-DOF robustness-matrix view",
  "dof6: 6-DOF robustness-matrix view",
  "slow: long-running tests that are excluded from the fast development loop",
  "artifact: tests that intentionally write human-readable artifacts under artifacts/",
  "simple_aero: end-to-end or fixture tests for the SimpleAero problem/segment trajectory corpus",
  "daveml: DAVE-ML parser, evaluator, collection, and round-trip tests",
  "integration: cross-component or end-to-end integration tests",
  "external_oracle: tests that invoke an optional external model interpreter",
  "runtime: requires a historical or separately verified TAOS executable",
  "historical: exploratory or historically sourced runtime cases",
  "stress: intentionally large or long-running runtime cases",
  "segment: isolated segment contract and maneuver-gate validation",
  "plot: plotting and visualization-only view",
  "negative_runtime: malformed inputs for executable-level rejection checks",
  "metamorphic: compares multiple TAOS executions",
  "b747: Boeing 747 vehicle-family validation and evidence",
  "x8: Skywalker X8 vehicle-family validation and evidence",
  "hummingbird: AscTec Hummingbird vehicle-family validation and evidence",
  "x15: X-15 vehicle-family validation and evidence",
]

[tool.ruff]
target-version = "py312"
line-length = 160
extend-exclude = ["build", "dist", "qa"]

[tool.ruff.lint]
# The imported handoff contains historical long lines; correctness/import lint
# is enforced now, while a later cleanup can adopt Ruff's formatter and E501.
select = ["F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/taoryx"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["taoryx.language.*"]
# The inherited parser foundation has known narrowing/AST-union debt. Keep it
# isolated while new code is required to pass type checking.
ignore_errors = true
