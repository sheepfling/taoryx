editorial_notes:
- id: appendix_physical_order_toc_discrepancy
  section: Appendix
  source_pdf_pages:
  - 9
  - 282
  - 294
  source_manual_pages:
  - vi
  - A-1
  - Ref-1
  source_issue: The printed contents place References before the Appendix, while the bound source pages place the Appendix
    before References.
  reconstruction: The reconstruction follows the physical source order and places the Appendix immediately after Chapter 4,
    followed by References.
  rationale: Physical page order is authoritative for the reconstructed document sequence; the discrepancy remains documented
    here.
- id: appendix_ep_angle_units
  section: Appendix
  source_pdf_page: 283
  source_manual_page: A-2
  source_issue: The ep1 and ep2 rows omit default units even though both variables are thrust-vector angles.
  reconstruction: Default units are supplied as degrees, consistent with Section 2.3.3 and the angle conventions used throughout
    TAOS.
  rationale: The addition resolves an evident table omission without changing the variable definitions.
- id: appendix_iip_long_description
  section: Appendix
  source_pdf_page: 284
  source_manual_page: A-3
  source_issue: The iip_long row describes the quantity as geodetic latitude despite using the longitude symbol lambda_iip.
  reconstruction: The description is normalized to longitude of the initial impact point.
  rationale: The variable name, symbol, and Section 2.4.4 definition uniquely establish the intended quantity.
- id: appendix_rcmdt_unit_and_reference
  section: Appendix
  source_pdf_page: 286
  source_manual_page: A-5
  source_issue: The rcmdt row gives units of feet and cites nonexistent Section 4.5.5 for a rate-of-change quantity.
  reconstruction: Units are normalized to ft/sec and the cross-reference points to the geocentric-coordinate definition in
    Section 2.1.4.
  rationale: The symbol is a time derivative of distance and therefore has speed dimensions; Section 2.1.4 defines rcm.
- id: appendix_tangent_plane_derivatives
  section: Appendix
  source_pdf_pages:
  - 290
  - 291
  - 292
  source_manual_pages:
  - A-9
  - A-10
  - A-11
  source_issue: The appendix labels tangent-plane velocity and acceleration components as inertial and prints V_I and a_I,
    while Section 2.1.11 defines earth-relative components V_earth and a_earth.
  reconstruction: The appendix rows are normalized to earth-relative velocity and acceleration to match the defining section.
  rationale: The source appendix appears to have copied the inertial-platform wording into the tangent-plane rows; Section
    2.1.11 is internally consistent and unambiguous.
- id: appendix_ecfc_direction_descriptions
  section: Appendix
  source_pdf_pages:
  - 290
  - 291
  source_manual_pages:
  - A-9
  - A-10
  source_issue: The yecfcdt and zecfcdt descriptions both say x direction despite their names, symbols, and surrounding component
    rows.
  reconstruction: The descriptions are normalized to the ECFC y and z directions respectively.
  rationale: The variable names and dot-product symbols uniquely identify the intended axes.
- id: references_powell_page_range
  section: References
  source_pdf_page: 294
  source_manual_page: Ref-1
  source_issue: Reference 3 prints the page range as pp. 144-57.
  reconstruction: The range is normalized to pp. 144-157.
  rationale: The abbreviated source range is expanded to an unambiguous inclusive page span while preserving the cited work.
- id: references_kwajalein_title
  section: References
  source_pdf_page: 295
  source_manual_page: Ref-2
  source_issue: Reference 15 prints “Kwajelein Reference Atmosphere 1979, 1966,” combining a misspelling with an extraneous
    year.
  reconstruction: The title is normalized to “Kwajalein Reference Atmosphere 1979.”
  rationale: The report number and publication date establish the intended 1979 title; the normalization removes evident source
    typesetting errors.
- id: index_density_name_preserved
  section: Index
  source_pdf_page: 300
  source_manual_page: Index-5
  source_issue: The historical index lists “density” among output-variable names even though the canonical TAOS variable is
    rho.
  reconstruction: The index term “density” is preserved exactly as printed.
  rationale: The historical index is reconstructed as a source-faithful reference rather than silently rewritten from the
    Appendix variable registry.
