      - actuator.rotor.4.speed.actual
    robustness_requirement:
      disposition: not_applicable
      reason: >-
        The bounded horizontal source-local screen has no declared persistent wind, external-wrench, or mass-variation
        injection seam. Its changing position/yaw references are tracking objectives, not robustness cases.
    maturity_record_id: hummingbird
    claim_boundary: >-
      Bounded source-local forward, yaw, lateral, rearward, and return tracking through attitude LQI and four-rotor
      allocation only. It does not establish altitude/collective control, wind rejection, contact, landing, battery
      behavior, gain scheduling, a general route, or vehicle qualification.

  - id: x8-source-surface-roll-pitch-lqi
    family_id: skywalker_x8
    model_id: skywalker_x8
    mission_id: x8_local_physical_surface_lqi_screen_v1
