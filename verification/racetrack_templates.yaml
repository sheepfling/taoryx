schema_version: 1
template:
  id: powered_fixed_wing_racetrack_v1
  family: powered_fixed_wing
  mission_contract: >-
    A common powered fixed-wing course with a long outbound straight, isolated
    climb and high-altitude level gate, left semicircle, isolated inbound
    descent and low-altitude level gate, right semicircle, and oriented
    start/finish crossing.
  phase_order:
    - outbound-climb
    - outbound-level
    - left-turn
    - inbound-descent
    - inbound-level
    - right-turn
  realization_rule: >-
    Geometry and truth objectives are shared. Guidance, trim, control
    allocation, propulsion, resources, and fidelity claims are supplied by the
    vehicle binding and never inferred from another vehicle.
  required_route_attributes:
    - racetrack-length-m
    - racetrack-turn-radius-m
    - racetrack-speed-mps
    - racetrack-low-altitude-m
    - racetrack-high-altitude-m
    - racetrack-climb-rate-mps
    - racetrack-descent-rate-mps
  gate_semantics:
    high-altitude-level-gate: {phase: outbound-level, normal: [0.0, 1.0, 0.0]}
    left-turn-exit-gate: {phase: left-turn, normal: [0.0, -1.0, 0.0]}
    low-altitude-level-gate: {phase: inbound-level, normal: [0.0, -1.0, 0.0]}
    terminal-start-finish-gate: {phase: right-turn, normal: [0.0, 1.0, 0.0]}

# These bindings are mission-scale contracts, not claims that the vehicles can
# meet them.  A binding supplies the numbers that a preflight estimator and
# truth evaluator consume.  The B747 is intentionally much larger and slower
# to turn than the X8 while preserving the same semantic phase sequence.
bindings:
  x8-reference:
    vehicle_id: skywalker_x8
    fidelity: rigid_body_6dof_surface_allocated
    straight_length_m: 700.0
    turn_radius_m: 250.0
    speed_m_s: 17.9
    low_altitude_m: 178.0
    high_altitude_m: 188.0
    climb_rate_m_s: 0.5
    descent_rate_m_s: 0.3
    left_turn_bank_deg: -8.0
    right_turn_bank_deg: -8.0
    altitude_capture_gain_per_s: 0.1
    altitude_capture_max_mps: 2.0
    position_capture_gain: 0.01
    position_capture_max_correction_mps: 2.0
    simulation_margin_s: 4.0
    source_realization: bounded_elevon_allocation_bank_pitch_pd
