schema_version: 1
intake_id: small-aircraft-pseudo6dof-baselines-v0.1
received: 2026-07-24
purpose: source-bounded research intake for the Alpha 2 small-aircraft domain pilots
claim_boundary:
  - These are public simulation and controls-research baselines, not manufacturer or certification data.
  - The package is not an independent TAORYX implementation until its source files, tables, signs, units, and tests are ingested.
  - Derived and estimated values must remain separate from source-transcribed values in resolved cases and evidence packets.
attachments:
  - name: README.md
    sha256: e8c82830c6855e30cf1a9460bd77da4b0dcc93b12db03ebd8fef5bef3d8f2512
