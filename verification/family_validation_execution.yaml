      - examples/mission_families/slower_b747/SV01_open_loop_pitch_diagnostic_6dof.prb
      - examples/mission_families/slower_b747/SV01_open_loop_descent_diagnostic_6dof.prb
      - examples/mission_families/slower_b747/SV01_flight_path_hold_descent_6dof.prb
      - examples/mission_families/slower_b747/SV01_descent_recovery_120_6dof.prb
