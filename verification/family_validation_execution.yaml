      - vehicle-family-validation/x8-long-rectangle-route-6dof/phase-metrics.json
      - vehicle-family-validation/x8-long-rectangle-route-6dof/plots
      - vehicle-family-validation/x8-powered-validation-6dof/run-report.json
      - vehicle-family-validation/x8-powered-validation-6dof/plots
      - vehicle-family-validation/x8-powered-validation-6dof/convergence-report.json
      - vehicle-family-validation/x8-level-settling-corridor-6dof/run-report.json
      - vehicle-family-validation/x8-level-settling-corridor-6dof/plots
    blocking_reason: 120 s four-leg powered rectangle passes directional-leg, phase-bound, and declared 5 m/s fixed-crosswind checks. After schedule alignment to the measured X8 ground speed and a capped generic position-capture term, reconstructed corner misses are approximately 54 m, 87 m, and 124 m for the non-origin corners; it is not four-leg waypoint-capture evidence. The generated 120 s level-settling corridor passes bounded altitude/speed/alpha/beta and independent closure gates, and the basic native waypoint now captures within 25 m at approximately 16.9 s. Native multi-leg capture, climb controller authority, propulsion balance, and clean fixture aliasing remain before a long X8 route claim.
