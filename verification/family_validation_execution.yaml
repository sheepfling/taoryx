      - vehicle-family-validation/b747-rectangle-3dof/plots
      - vehicle-family-validation/b747-trim-hold-contract/run-report.json
      - vehicle-family-validation/b747-trim-hold-contract/phase-metrics.json
      - vehicle-family-validation/b747-trim-hold-contract/convergence-report.json
      - vehicle-family-validation/b747-approach-go-around-6dof/phase-metrics.json
      - vehicle-family-validation/b747-approach-go-around-6dof/convergence-report.json
      - vehicle-family-validation/b747-trim-120s-generated-6dof/run-report.json
      - vehicle-family-validation/b747-trim-120s-generated-6dof/plots
      - vehicle-family-validation/b747-descent-recovery-120s-generated-6dof/run-report.json
      - vehicle-family-validation/b747-descent-recovery-120s-generated-6dof/plots
      - vehicle-family-validation/b747-climb-cruise-3dof/phase-metrics.json
      - vehicle-family-validation/b747-open-loop-pitch-diagnostic/diagnostic-history.json
      - vehicle-family-validation/b747-flight-path-hold-descent/descent-history.json
      - vehicle-family-validation/b747-integrated-route-descent/run-report.json
      - vehicle-family-validation/b747-integrated-route-descent/plots
      - vehicle-family-validation/b747-reduced-fuel-mass-coupling/mass-history.json
    blocking_reason: 320 s rectangle, 60 s 6DOF trim, 60 s approach/go-around, 60 s climb/cruise, opposite-elevator sign diagnostic, 60 s controlled descent corridor, 120 s native descent/recovery, 20 s composed route/altitude capture, and table-driven notional mass coupling pass; source-backed JT9D fuel flow, heading/altitude tracking, and longer route closure remain
    blocking_evidence:
      - table: tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/b747_jt9d_thrust.tbl
        finding: installed thrust map explicitly declares that fuel flow is not modeled
      - table: tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/b747_notional_fuel_flow.tbl
        finding: notional first-cut throttle-to-mass-flow surrogate used only to exercise runtime coupling
      - problem: examples/mission_families/slower_b747/SV01_reduced_fuel_mass_coupling_6dof.prb
        finding: table-driven mdot is a notional first-cut contract, not source-backed JT9D fuel data
      - problem: examples/mission_families/slower_b747/SV01_integrated_route_descent_6dof.prb
        finding: 20 s route/altitude capture reaches the declared local corridor but remains a source-scoped research maneuver, not a full mission
      - problem: examples/mission_families/slower_b747/SV01_descent_corridor_6dof.prb
        finding: 20 s run reaches approximately 750 m altitude and 6.97 deg angle of attack from the 100 m start, outside the declared descent corridor
