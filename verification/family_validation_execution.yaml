schema_version: 1
id: taoryx_vehicle_family_validation_execution_v1
claim_boundary: engineering validation of the declared TAORYX model and envelope; not flight qualification
required_artifacts:
  - run-report.json
  - phase-metrics.json
  - convergence-report.json
  - plots/*.png
statuses:
  - planned
  - candidate
  - blocked
  - validated
scenarios:
  - id: glider-entry-pullout-glide-terminal
    family: unpowered_hypersonic_glider
    status: blocked
    verdict: blocked
    provenance:
      type: source_anchored_public_research_surrogate
      source: tests/fixtures/x15_coherent_6dof_public_research_v1/README.md
    candidate_problem: examples/showcases/x15_rocket_to_hawaii/long_unpowered_glide_6dof.prb
    supporting_problems:
      - examples/mission_families/hypersonic_glide_terminal_guidance/mission.prb
      - examples/showcases/x15_rocket_to_hawaii/long_unpowered_glide_6dof.prb
      - examples/showcases/x15_rocket_to_hawaii/long_unpowered_glide_bank_reversal_6dof.prb
      - examples/showcases/x15_rocket_to_hawaii/route_geometry_diagnostic_6dof.prb
    supporting_tables:
      - examples/mission_families/hypersonic_glide_terminal_guidance/aero.tbl
      - tests/fixtures/x15_coherent_6dof_public_research_v1/tables/x15_static_6axis.tbl
    supporting_artifacts:
      - vehicle-family-validation/glider-3dof-extension/run-report.json
      - vehicle-family-validation/glider-3dof-extension/phase-metrics.json
      - vehicle-family-validation/glider-unpowered-6dof/run-report.json
      - vehicle-family-validation/glider-unpowered-6dof/phase-metrics.json
      - vehicle-family-validation/glider-unpowered-6dof/convergence-report.json
      - vehicle-family-validation/glider-unpowered-6dof/plots
    duration_s: 120
    required_channels:
      - time_s
      - altitude_m
      - speed_m_s
      - mach
      - aero_alpha_deg
      - aero_sideslip_deg
      - mass_kg
      - range_to_target_m
      - route_cross_track_error_m
      - route_heading_error_deg
    phases:
      - release
      - ballistic_coast
      - atmospheric_interface
      - energy_management_glide
      - heading_capture
      - terminal_corridor
    convergence:
      problem: examples/showcases/x15_rocket_to_hawaii/long_unpowered_glide_6dof.prb
      factors: [1.0, 0.5, 0.25]
      channels: [altitude_m, speed_m_s, mach, aero_alpha_deg, aero_sideslip_deg]
    perturbations:
      - id: release-speed-plus-one
        input: initial_y_velocity
        expected: bounded_unpowered_envelope
      - id: release-height-plus-one
        input: initial_ecic_z
        expected: bounded_unpowered_envelope
    blocking_reason: 120 s source-anchored unpowered 6DOF release, apogee/energy-management, terminal-descent, convergence, perturbation, and Matplotlib evidence pass; native bank-reversal and source-anchored route geometry telemetry pass, while short-range ProNav departs the local alpha/beta deck and remains blocked
  - id: b747-trim-climb-cruise-maneuver-descent
    family: powered_fixed_wing
    status: candidate
    verdict: blocked
    provenance:
      type: source_anchored_generated_tables
      source: tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/sources.csv
    candidate_problem: examples/mission_families/slower_b747/SV01_rectangle_course_3dof.prb
    supporting_problems:
