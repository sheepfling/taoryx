schema: taoryx.effectivity-contract/v1alpha1
family: a320_openap_jsbsim_pseudo6dof
authority: taoryx-policy-overlay
qualification_class: surrogate_composite
claim_boundary: >-
  These are bounded semantic effectors used by the Taoryx pseudo-6DOF
  realization.  Their coefficient-to-moment paths are sourced from the
  normalized JSBSim A320 rotational structure, but their actuator limits,
  rates, and response are engineering policy.  This is not source-exact
  Airbus or JSBSim actuator qualification.
frames:
  body: FRD
  navigation: NED
controls:
  - id: throttle_ratio
    role: propulsion_command
    unit: "1"
    lower: 0.0
    upper: 1.0
    rate_per_s: 0.5
    time_constant_s: 1.0
    source: openap-2.6.0-performance-plus-taoryx-policy
    physical_effectivity: not_source_exact
  - id: aileron_rad
    role: roll_moment_surrogate
    unit: rad
    lower: -0.05
    upper: 0.05
    rate_per_s: 0.25
    time_constant_s: 0.2
    source: jsbsim-1.3.1-a320-coefficient-surrogate
    physical_effectivity: not_source_exact
  - id: elevator_rad
    role: pitch_moment_surrogate
    unit: rad
    lower: -0.05
    upper: 0.05
    rate_per_s: 0.25
    time_constant_s: 0.2
    source: jsbsim-1.3.1-a320-coefficient-surrogate
    physical_effectivity: not_source_exact
  - id: rudder_rad
    role: yaw_moment_surrogate
    unit: rad
    lower: -0.05
    upper: 0.05
    rate_per_s: 0.25
    time_constant_s: 0.2
    source: jsbsim-1.3.1-a320-coefficient-surrogate
    physical_effectivity: not_source_exact
semantic_commands:
  - id: flight_path_angle_rad
    role: kinematic_path_command
    unit: rad
    lower: -0.2
    upper: 0.2
    realization: pseudo_6dof_response_law
  - id: bank_angle_rad
    role: kinematic_attitude_command
    unit: rad
    lower: -0.5
    upper: 0.5
    realization: pseudo_6dof_response_law
allocation:
  status: response_law_overlay
  physical_allocator: false
  direct_wrench_injection: false
  surface_effectivity_matrix: source_coefficient_channels_only
  requested_versus_achieved_wrench: diagnostic_not_qualification
  saturation_reporting: enabled
####
