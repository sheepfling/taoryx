schema: taoryx.product-two-scenario-catalog/v1alpha1
schema_version: 1
scenarios:
  - id: two-stage-ballistic
    aliases: [ballistic-rocket, staged-rocket-smoke]
    title: Two-stage ballistic rocket smoke test
    description: Small source-first staged rocket covering parsing, changing mass, phase changes, and finite output.
    entrypoint: source
    family: synthetic_staged_rocket
    fidelity: point_mass_3dof
    realization: source_runtime
    operation: batch
    expected_disposition: passed
    profile: taos96
    inputs:
      - {path: examples/mission_families/two_stage_ballistic_rocket/mission.prb, role: problem, kind: problem}
    setup_commands:
      - [taoryx-validate, --profile, taos96, examples/mission_families/two_stage_ballistic_rocket/mission.prb]
    run_command: [taoryx, run, examples/mission_families/two_stage_ballistic_rocket/mission.prb, --profile, taos96, --integrator, rk4, --max-steps, "20000", --output-dir, "{output_dir}/run", --report, "{output_dir}/run/run-report.json", --artifact, "{output_dir}/run/run-artifact.json"]
    artifact_paths: [run/run-artifact.json, run/run-manifest.json, run/run-report.json]
    integrator: rk4
    claim_boundary: Synthetic point-mass source fixture; this proves runtime and artifact plumbing, not rigid-body attitude, engineering performance, or historical numerical equivalence.
    tags: [staged-rocket, source, smoke]

  - id: two-stage-demo
    aliases: [staged-rocket-demo, changing-mass-demo]
    title: Changing-mass staged rocket demo
    description: Source scenario with reusable aerodynamic and propulsion tables, separation, changing mass, and child-state inheritance.
    entrypoint: source
    family: synthetic_staged_rocket
    fidelity: point_mass_3dof
    realization: source_runtime
    operation: batch
    expected_disposition: passed
    profile: taoryx
    inputs:
      - {path: examples/vehicle_families/staged_rocket/two_stage_demo/mission.prb, role: problem, kind: problem}
      - {path: examples/vehicle_families/staged_rocket/two_stage_demo/aero.tbl, role: aerodynamics, kind: table}
      - {path: examples/vehicle_families/staged_rocket/two_stage_demo/propulsion.tbl, role: propulsion, kind: table}
    setup_commands:
      - [taoryx-validate, --profile, taoryx, examples/vehicle_families/staged_rocket/two_stage_demo/mission.prb, examples/vehicle_families/staged_rocket/two_stage_demo/aero.tbl, examples/vehicle_families/staged_rocket/two_stage_demo/propulsion.tbl]
      - [taoryx, table, inspect, examples/vehicle_families/staged_rocket/two_stage_demo/aero.tbl, --json]
      - [taoryx, table, inspect, examples/vehicle_families/staged_rocket/two_stage_demo/propulsion.tbl, --json]
    run_command: [taoryx, run, examples/vehicle_families/staged_rocket/two_stage_demo/mission.prb, examples/vehicle_families/staged_rocket/two_stage_demo/aero.tbl, examples/vehicle_families/staged_rocket/two_stage_demo/propulsion.tbl, --profile, taoryx, --integrator, rk4, --max-steps, "20000", --output-dir, "{output_dir}/run", --report, "{output_dir}/run/run-report.json", --artifact, "{output_dir}/run/run-artifact.json"]
    artifact_paths: [run/run-artifact.json, run/run-manifest.json, run/run-report.json]
    integrator: rk4
    claim_boundary: Synthetic source-table family example; this proves table binding, staged mass change, and artifact plumbing, not historical TAOS equivalence or vehicle qualification.
    tags: [staged-rocket, tables, source]

  - id: nesc-pseudo6dof
    aliases: [nesc, staged-rocket-pseudo6dof]
    title: NESC staged two-stage pseudo-6DOF replay
    description: Source-history replay with ordered staged events, mass/resource telemetry, and a named attitude-response law.
    entrypoint: composition
    family: reference_nesc_two_stage_rocket
    fidelity: pseudo_6dof
    realization: source_history_replay
    operation: composition_batch
    expected_disposition: development
    inputs:
      - {path: examples/vehicle_composition/nesc_staged_source_replay_pseudo6dof_compose.yaml, role: composition_request, kind: composition}
      - {path: families/reference_nesc_two_stage_rocket/family.yaml, role: model_family, kind: model}
    setup_commands:
      - [taoryx, vehicle, endpoints, reference_nesc_two_stage_rocket]
      - [taoryx, vehicle, compose, examples/vehicle_composition/nesc_staged_source_replay_pseudo6dof_compose.yaml, --output, "{output_dir}/composition.json"]
      - [taoryx, vehicle, preflight, "{output_dir}/composition.json"]
      - [taoryx, vehicle, lower, "{output_dir}/composition.json"]
    run_command: [taoryx, vehicle, run, "{output_dir}/composition.json", --output-dir, "{output_dir}/run"]
    artifact_paths: [composition.json, run/run-manifest.json, run/execution.json, run/truth_telemetry.csv, run/status_trace.json, run/reproduction.txt]
    claim_boundary: Retained NESC two-stage event and mass history plus a named attitude-response projection; no participating rocket plant, active guidance, gimbal, or physical separation dynamics claim.
    tags: [nesc, staged-rocket, pseudo-6dof, source-history]

  - id: x15-staged-pseudo6dof
    aliases: [x15-pseudo6dof, staged-booster-reachability]
    title: X-15-scaled staged booster pseudo-6DOF witness
    description: Boost, coast/release, glide handoff, passive impact, and local-frame reachability witness.
    entrypoint: composition
    family: x15
    fidelity: pseudo_6dof
    realization: source_derived_reduced_model
    operation: composition_batch
    expected_disposition: development
    inputs:
      - {path: examples/vehicle_composition/x15_staged_booster_reachability_pseudo6dof_compose.yaml, role: composition_request, kind: composition}
      - {path: verification/x15_maneuver_catalog.yaml, role: model_catalog, kind: model}
    setup_commands:
      - [taoryx, vehicle, endpoints, x15]
      - [taoryx, vehicle, compose, examples/vehicle_composition/x15_staged_booster_reachability_pseudo6dof_compose.yaml, --output, "{output_dir}/composition.json"]
      - [taoryx, vehicle, preflight, "{output_dir}/composition.json"]
      - [taoryx, vehicle, lower, "{output_dir}/composition.json"]
    run_command: [taoryx, vehicle, run, "{output_dir}/composition.json", --output-dir, "{output_dir}/run"]
    artifact_paths: [composition.json, run/run-manifest.json, run/execution.json, run/truth_telemetry.csv, run/status_trace.json, run/reproduction.txt]
    claim_boundary: X-15-scaled local-frame reduction with source-pinned staging and glide handoff; not a native X-15 controlled mission, synthetic CA–HI vehicle, or physical-effector claim.
    tags: [x15, staged-booster, pseudo-6dof, reachability]

  - id: hl20-source-release-pseudo6dof
    aliases: [hl20-pseudo6dof, hl20-staged-booster]
    title: HL-20 source-booster release pseudo-6DOF witness
    description: Source-bound HL-20 aerodynamic, release, bank, and contact sequence with an explicitly synthetic booster assumption.
    entrypoint: composition
    family: hl20_mod_k
    fidelity: pseudo_6dof
    realization: source_derived_reduced_model
    operation: composition_batch
    expected_disposition: development
    inputs:
      - {path: examples/vehicle_composition/hl20_source_booster_release_replay_pseudo6dof_compose.yaml, role: composition_request, kind: composition}
      - {path: families/reference_hl20_mod_k/family.yaml, role: model_family, kind: model}
    setup_commands:
      - [taoryx, vehicle, endpoints, hl20_mod_k]
      - [taoryx, vehicle, compose, examples/vehicle_composition/hl20_source_booster_release_replay_pseudo6dof_compose.yaml, --output, "{output_dir}/composition.json"]
      - [taoryx, vehicle, preflight, "{output_dir}/composition.json"]
      - [taoryx, vehicle, lower, "{output_dir}/composition.json"]
    run_command: [taoryx, vehicle, run, "{output_dir}/composition.json", --output-dir, "{output_dir}/run"]
    artifact_paths: [composition.json, run/run-manifest.json, run/execution.json, run/truth_telemetry.csv, run/status_trace.json, run/reproduction.txt]
    claim_boundary: Source-bound HL-20 release, bank, and contact sequence with a synthetic booster assumption; not a source-exact NASA trajectory, controller, landing, or California–Hawaii arrival claim.
    tags: [hl20, staged-booster, pseudo-6dof, source-bound]

  - id: hl20-four-fidelity
    aliases: [hl20-california-hawaii, hl20-fidelity-ladder]
    title: HL-20 California–Hawaii four-fidelity release ladder
    description: Comparable boost, release, glide, terminal, and passive-child telemetry across four declared fidelity tiers.
    entrypoint: showcase
    family: hl20_mod_k
    fidelity: four_fidelity_ladder
    realization: source_derived_and_overlay
    operation: batch
    expected_disposition: development
    inputs:
      - {path: examples/showcases/hl20_california_to_hawaii/run_low_fidelity.py, role: showcase_runner, kind: script}
      - {path: examples/showcases/hl20_california_to_hawaii/showcase.yaml, role: showcase_contract, kind: showcase}
      - {path: examples/showcases/hl20_california_to_hawaii/quality_gates.yaml, role: quality_gates, kind: showcase}
    setup_commands:
      - [python, examples/showcases/hl20_california_to_hawaii/run_low_fidelity.py, --help]
    run_command: [python, examples/showcases/hl20_california_to_hawaii/run_low_fidelity.py, --output-dir, "{output_dir}/run"]
    artifact_paths: [run/bundle-manifest.json, run/composites/showcase-summary.json, run/showcase-manifest.json]
    claim_boundary: Synthetic California–Hawaii route and booster assumptions compared across four fidelity labels; no target-hit, guidance, thermal, landing, or source-exact route claim.
    tags: [hl20, california-hawaii, fidelity-ladder, showcase]

  - id: synthetic-california-hawaii
    aliases: [california-hawaii, native-california-hawaii]
    title: Synthetic California–Hawaii native 6DOF route
    description: Synthetic staged boost, coast, glide, terminal route, and normalized artifact pipeline.
    entrypoint: showcase
    family: synthetic_california_hawaii
    fidelity: rigid_body_6dof
    realization: synthetic_native_rigid_body
    operation: batch
    expected_disposition: development
    inputs:
      - {path: examples/showcases/california_to_hawaii/run_showcase.py, role: showcase_runner, kind: script}
      - {path: examples/showcases/california_to_hawaii/mission.prb, role: problem, kind: problem}
      - {path: examples/showcases/california_to_hawaii/aero.tbl, role: aerodynamics, kind: table}
      - {path: examples/showcases/california_to_hawaii/showcase.yaml, role: showcase_contract, kind: showcase}
      - {path: examples/showcases/california_to_hawaii/expected.yaml, role: expected_outputs, kind: showcase}
    setup_commands:
      - [taoryx-validate, --profile, taoryx, examples/showcases/california_to_hawaii/mission.prb, examples/showcases/california_to_hawaii/aero.tbl]
      - [python, examples/showcases/california_to_hawaii/run_showcase.py, --help]
    run_command: [python, examples/showcases/california_to_hawaii/run_showcase.py, --output-dir, "{output_dir}/run"]
    artifact_paths: [run/manifest.json, run/realized_fidelity.json, run/summary.txt, run/run.json]
    claim_boundary: Synthetic native rigid-body route using invented vehicle and assumptions; not HL-20, X-15, historical TAOS, or a validated flight-design result.
    tags: [california-hawaii, native-6dof, synthetic, showcase]

  - id: interactive-california-hawaii
    aliases: [california-hawaii-interactive, stepping-california-hawaii]
    title: Interactive California–Hawaii stepping
    description: Two bounded external steps over the synthetic route with accepted intervals, commands, and a replayable artifact.
    entrypoint: interactive
    family: synthetic_california_hawaii
    fidelity: rigid_body_6dof
    realization: synthetic_native_rigid_body
    operation: interactive
    expected_disposition: passed
    inputs:
      - {path: examples/showcases/california_to_hawaii/mission.prb, role: problem, kind: problem}
      - {path: examples/showcases/california_to_hawaii/aero.tbl, role: aerodynamics, kind: table}
      - {path: examples/showcases/california_to_hawaii/run_interactive.py, role: stepping_runner, kind: script}
    setup_commands:
      - [python, examples/showcases/california_to_hawaii/run_interactive.py, --help]
    run_command: [python, examples/showcases/california_to_hawaii/run_interactive.py, --output-dir, "{output_dir}/run"]
    artifact_paths: [run/interactive-artifact.json, run/run-artifact.json]
    requested_duration_s: 20.0
    claim_boundary: Two accepted external steps and their normalized telemetry over the synthetic route; no target-hit, guidance, physical-effector, or validated flight-design claim.
    tags: [california-hawaii, interactive, stepping]
