      repeatability:
        enabled: true
        channels: [mass_kg, speed_m_s]
        absolute_tolerance: 0.0
        relative_tolerance: 0.0
      refinement: {enabled: false}
      invariants: []
    tags: [x15, staged-booster, pseudo-6dof, reachability]

