schema_version: 1
id: taoryx_generated_problem_catalog_v1
description: >-
  Metadata-driven native problem files. Generated outputs are reproducible
  products; source claims and scenario values remain in this catalog.
templates:
  rigid_body_6dof: tools/problem_templates/rigid_body_6dof.prb.in
  point_mass_3dof: tools/problem_templates/point_mass_3dof.prb.in
vehicle_registry: verification/vehicle_models.yaml
family_registry: verification/vehicle_families.yaml
profiles:
  b747_source_scoped:
    vehicle: b747
    initial_state: >-
      x=6379137.0 y=0.0 z=0.0 xdt=-8.0096 ydt=152.7997 zdt=0.0
      qw=0.4985808899268381 qx=-0.4985808899268381
      qy=-0.5014150937095554 qz=0.5014150937095554
      time=0.0 mass=288756.9 propellant_mass=0.0
    dtprnt: "0.1"
    dt: "0.01"
    thrust: "179539.8975191153"
    mdot: "0"
    propulsion_line: '    *prop thrust={{thrust}} mdot={{mdot}}'
    aero_line: '    *aero cx=(cx) cy=(cy) cz=(cz) cmx=(cmx) cmy=(cmy) cmz=(cmz)'
    file_line: ""
    fly_line: ""
  x8_canonical:
    vehicle: skywalker_x8
    definition_line: |
      # X8 control tables contain absolute total coefficients at throttle=0.44;
      # the static table is zero-throttle, so zero-control values differ.
      # Subtract the common static term before adding each control contribution;
      # do not simplify or remove terms.
      # Composition: static + (collective - static) + (differential - static).
      *define x8-cx
        x8-cx=(cx-static)+(cx-collective)-(cx-static)+(cx-differential)-(cx-static);
      *define x8-cy
        x8-cy=(cy-static)+(cy-collective)-(cy-static)+(cy-differential)-(cy-static);
      *define x8-cz
        x8-cz=(cz-static)+(cz-collective)-(cz-static)+(cz-differential)-(cz-static);
      *define x8-cmx
        x8-cmx=(cmx-static)+(cmx-collective)-(cmx-static)+(cmx-differential)-(cmx-static);
      *define x8-cmy
        x8-cmy=(cmy-static)+(cmy-collective)-(cmy-static)+(cmy-differential)-(cmy-static);
      *define x8-cmz
        x8-cmz=(cmz-static)+(cmz-collective)-(cmz-static)+(cmz-differential)-(cmz-static);
    aero_line: '    *aero cx=x8-cx cy=x8-cy cz=x8-cz cmx=x8-cmx cmy=x8-cmy cmz=x8-cmz'
  x8_source_trim_reduction:
    vehicle: skywalker_x8
    initial_geodetic: 'alt=178.0 long=0.0 lat=0.0 vel=17.9 gama=0.0 psi=90.0 time=0.0 mass=3.364'
    control_lines: |
      *runtime control throttle vehicle=1 default=0.5773431905510489 lower=0 upper=1
      *runtime control collective-elevon-deg vehicle=1 default=-2.147887654393667 lower=-20 upper=20
      *runtime control differential-elevon-deg vehicle=1 default=-3.9378035933567617 lower=-20 upper=20
    definition_line: |
      # X8 control tables contain absolute total coefficients at throttle=0.44;
      # the static table is zero-throttle, so zero-control values differ.
      # Subtract the common static term before adding each control contribution;
      # do not simplify or remove terms.
      # Composition: static + (collective - static) + (differential - static).
      *define x8-cx
        x8-cx=(cx-static)+(cx-collective)-(cx-static)+(cx-differential)-(cx-static);
      *define x8-cy
        x8-cy=(cy-static)+(cy-collective)-(cy-static)+(cy-differential)-(cy-static);
      *define x8-cz
        x8-cz=(cz-static)+(cz-collective)-(cz-static)+(cz-differential)-(cz-static);
    aero_line: '    *aero cx=x8-cx cy=x8-cy cz=x8-cz sref=0.75'
    propulsion_line: '    *prop thrust=(thrust) mdot=0'
    fly_line: '    *fly alpha=7.8095001441'
