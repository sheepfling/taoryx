        x8-cmz=(cmz-static)+(cmz-collective)-(cmz-static)+(cmz-differential)-(cmz-static);
  hummingbird_parity_point:
    vehicle: hummingbird
    initial_geodetic: 'alt=2.0 long=0.0 lat=0.0 vel=0.0 gama=0.0 psi=0.0 time=0.0 mass=0.5'
