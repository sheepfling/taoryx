schema: taoryx.vehicle-execution-bindings/v1alpha1
version: 1
description: >-
  Explicit source-owned execution bindings for compiled vehicle compositions.
  An entry is a public capability declaration, not a generic family fallback.
  Omitted vehicle/fidelity/mission combinations are unavailable until their
  own native binding exists.
bindings:
  - family_id: skywalker_x8
    mission: powered_fixed_wing_racetrack_v1
    fidelity: point_mass_3dof
    operation: batch
    status: runnable
    factory_id: language_backed_powered_fixed_wing.v1
    description: Materialize the exact source-table route and execute it through the language runtime.
    claim_boundary: Point-mass source-table trajectory evidence; no attitude or physical-effector claim.
  - family_id: skywalker_x8
    mission: powered_fixed_wing_racetrack_v1
    fidelity: pseudo_6dof
    operation: batch
    status: runnable
    factory_id: language_backed_powered_fixed_wing.v1
    description: Materialize the named route-lag pseudo-6DOF source-table route and execute it through the language runtime.
    claim_boundary: Named attitude-response bridge; no rigid-body moment or elevon-allocation claim.
  - family_id: skywalker_x8
    mission: powered_fixed_wing_racetrack_v1
    fidelity: point_mass_3dof
    operation: episode
    status: runnable
    factory_id: language_backed_interactive.v1
    description: Project the language-backed source runtime into an accepted-truth interactive episode.
    claim_boundary: External controls remain the declared runtime controls and do not promote the point-mass evidence tier.
  - family_id: skywalker_x8
    mission: powered_fixed_wing_racetrack_v1
    fidelity: pseudo_6dof
    operation: episode
    status: runnable
    factory_id: language_backed_interactive.v1
    description: Project the named pseudo-6DOF language runtime into an accepted-truth interactive episode.
    claim_boundary: External controls do not establish physical elevon allocation or moment balance.

  - family_id: b747
    mission: powered_fixed_wing_racetrack_v1
    fidelity: point_mass_3dof
    operation: batch
    status: runnable
    factory_id: language_backed_powered_fixed_wing.v1
    description: Materialize and execute the transport-scaled source-table point-mass racetrack.
    claim_boundary: Transport trajectory evidence only; no physical control-surface claim.
  - family_id: b747
    mission: powered_fixed_wing_racetrack_v1
    fidelity: pseudo_6dof
    operation: batch
    status: runnable
    factory_id: language_backed_powered_fixed_wing.v1
    description: Materialize and execute the transport-scaled named route-lag racetrack.
    claim_boundary: Named route-lag pseudo response; no B747 surface-allocation or moment claim.
  - family_id: b747
    mission: powered_fixed_wing_racetrack_v1
    fidelity: point_mass_3dof
    operation: episode
    status: runnable
    factory_id: language_backed_interactive.v1
    description: Project the source-table transport runtime into an accepted-truth interactive episode.
    claim_boundary: Interactive control does not promote trajectory evidence to physical transport control evidence.
  - family_id: b747
    mission: powered_fixed_wing_racetrack_v1
    fidelity: pseudo_6dof
    operation: episode
    status: runnable
    factory_id: language_backed_interactive.v1
    description: Project the named transport route-lag runtime into an accepted-truth interactive episode.
    claim_boundary: The episode remains a named response-law bridge and does not establish physical effector behavior.

  - family_id: a320_openap_3dof
    mission: powered_fixed_wing_racetrack_v1
    fidelity: point_mass_3dof
    operation: batch
    status: runnable
    factory_id: reduced_fixed_wing_openap.v1
    description: Execute the capability-derived racetrack through the declared OpenAP reduced model.
    claim_boundary: Reduced OpenAP trajectory evidence; no physical control-surface or moment claim.
  - family_id: a320_openap_3dof
    mission: powered_fixed_wing_racetrack_v1
    fidelity: pseudo_6dof
    operation: batch
    status: runnable
    factory_id: reduced_fixed_wing_openap.v1
    description: Execute the named A320 response-law racetrack through the declared OpenAP reduced model.
    claim_boundary: Named pseudo response only; policy diagnostics are not physical surface allocation.

  - family_id: f16_s119
    mission: powered_fixed_wing_racetrack_v1
    fidelity: point_mass_3dof
    operation: batch
    status: runnable
    factory_id: reduced_fixed_wing_f16_source.v1
    description: Execute the capability-derived racetrack through the declared source-reduced F-16 path.
    claim_boundary: Source-reduced trajectory evidence; no direct-wrench or physical-surface promotion.
  - family_id: f16_s119
    mission: powered_fixed_wing_racetrack_v1
    fidelity: pseudo_6dof
    operation: batch
    status: runnable
    factory_id: reduced_fixed_wing_f16_source.v1
    description: Execute the named source-local F-16 attitude/rate bridge.
    claim_boundary: Named response-law evidence only; no physical F-16 actuator allocation claim.

  - family_id: reference_nesc_two_stage_rocket
    mission: staged_rocket_launch_target_state_v1
    fidelity: point_mass_3dof
    operation: batch
    status: runnable
    factory_id: nesc_source_replay.v1
    description: Replay the exact source-qualified NESC translation history after source-compatible semantic preflight.
    claim_boundary: Source-history point-mass replay only; no participating rocket plant, guidance, or gimbal-allocation claim.
  - family_id: reference_nesc_two_stage_rocket
    mission: staged_rocket_launch_target_state_v1
    fidelity: pseudo_6dof
    operation: batch
    status: runnable
    factory_id: nesc_source_replay.v1
    description: Replay the NESC source translation with the declared phase-scheduled attitude-response surrogate.
    claim_boundary: Source translation plus named response-law evidence; no source-exact attitude, gimbal, or control-allocation claim.

  - family_id: x15
    mission: x15_local_direct_wrench_screen_v1
    fidelity: rigid_body_6dof_direct_wrench
    operation: batch
    status: runnable
    factory_id: local_direct_wrench_screen.v1
    description: Execute the source-local X-15 direct-wrench LQR recovery screen through the public composition path.
    claim_boundary: Local direct-wrench recovery screen only; it is neither an X-15 flight mission nor physical effector allocation.
  - family_id: x15
    mission: x15_local_direct_wrench_screen_v1
    fidelity: rigid_body_6dof_direct_wrench
    operation: episode
    status: runnable
    factory_id: x15_local_direct_wrench_episode.v1
    description: Step the source-local X-15 direct-wrench bridge through its declared bounded total-wrench command.
    claim_boundary: Local direct-wrench bridge episode only; it exposes requested-versus-achieved injected wrench, not physical effector allocation or an X-15 flight mission.
  - family_id: x15
    mission: rocket_aircraft_high_energy_v1
    fidelity: rigid_body_6dof_direct_wrench
    operation: batch
    status: planned
    description: Execute release, burn/coast, and atmospheric handoff through the bounded X-15 source direct-wrench bridge.
    claim_boundary: The current local direct-wrench bridge is not yet an end-to-end X-15 mission executor.
    blockers:
      - release_to_powered_coast_phase_translator
      - source_bounded_high_energy_terminal_objectives
      - phase_scheduled_direct_wrench_controller
  - family_id: x15
    mission: x15_staged_booster_reachability_v1
    fidelity: point_mass_3dof
    operation: batch
    status: runnable
    factory_id: x15_staged_reachability.v1
    description: Execute the source-pinned X-15-scaled booster, coast, release, glide, open-loop handoff, and passive-impact witness through the reduced reachability model.
    claim_boundary: Local-frame X-15-scaled reduced witness only; it preserves declared staging anchors but is not the synthetic California-to-Hawaii vehicle, a native X-15 rigid-body mission, or a controlled terminal handoff.
  - family_id: x15
    mission: x15_staged_booster_reachability_v1
    fidelity: pseudo_6dof
    operation: batch
    status: runnable
    factory_id: x15_staged_reachability.v1
    description: Execute the source-pinned X-15-scaled staged witness with the declared named attitude-response bridge.
    claim_boundary: Local-frame X-15-scaled response-law witness only; it does not establish source-derived moments, physical effectors, or a controlled terminal handoff.
  - family_id: hl20_mod_k
    mission: lifting_body_glide_energy_management_v1
    fidelity: rigid_body_6dof_direct_wrench
    operation: batch
    status: planned
    description: Execute a release-to-energy-handoff mission through the local HL-20 source direct-wrench bridge.
    claim_boundary: The current local source load bridge does not provide a complete release, gravity, navigation, or glide mission plant.
    blockers:
      - declared_direct_wrench_authority_deficit_at_mach2_source_point
      - release_trim_and_gravity_state_binding
      - energy_glide_segment_translator
      - source_bounded_handoff_evaluator
  - family_id: hl20_mod_k
    mission: lifting_body_glide_energy_management_v1
    fidelity: rigid_body_6dof_surface_allocated
    operation: batch
    status: planned
    description: Execute the HL-20 release-to-energy-handoff mission through source-surface allocation.
    claim_boundary: Current source-surface evidence is local allocation/effectivity only, not full lifting-body mission control.
    blockers:
      - release_trim_and_gravity_state_binding
      - nonlinear_surface_control_mission_loop
      - source_bounded_handoff_evaluator
  - family_id: tumbling_body
    mission: tumbling_body_release_damping_impact_v1
    fidelity: point_mass_3dof
    operation: batch
    status: runnable
    factory_id: passive_tumbling_direct_release.v1
    description: Execute the declared direct passive-cylinder release with orientation-averaged projected area.
    claim_boundary: The passive 3DOF reduction cannot establish moment-driven rotational behavior or expose a control path.
  - family_id: tumbling_body
    mission: tumbling_body_release_damping_impact_v1
    fidelity: pseudo_6dof
    operation: batch
    status: runnable
    factory_id: passive_tumbling_direct_release.v1
    description: Execute the declared direct passive-cylinder release using native rigid-body passive-tumble reuse.
    claim_boundary: Passive pseudo-6DOF has no control or allocation path; it reuses real rigid-body evidence explicitly.

  - family_id: hummingbird
    mission: multirotor_pad_box_yaw_recovery_land_v1
    fidelity: pseudo_6dof
    operation: episode
    status: runnable
    factory_id: hummingbird_aggregate_thrust_episode.v1
    description: Project the bounded aggregate-thrust Hummingbird response model into an accepted-truth episode.
    claim_boundary: Aggregate thrust-vector response only; no individual motor allocation, rotor inflow, or moment-balance claim.
  - family_id: hummingbird
    mission: multirotor_pad_box_yaw_recovery_land_v1
    fidelity: pseudo_6dof
    operation: batch
    status: runnable
    factory_id: hummingbird_aggregate_thrust_pseudo_batch.v1
    description: Translate the declared hover/yaw/translation/contact composition into a source-owned pseudo-6DOF nominal run.
    claim_boundary: Aggregate thrust-vector response only; no individual motor allocation, rotor inflow, or moment-balance claim.
