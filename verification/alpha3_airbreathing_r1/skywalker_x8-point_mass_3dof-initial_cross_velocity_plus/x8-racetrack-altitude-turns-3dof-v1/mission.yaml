id: x8-racetrack-altitude-turns-3dof-v1
family: skywalker_x8
display_name: Skywalker X8 racetrack point-mass 3DOF
evidence_level: nominal_case_pass_overall_qualification_pending
claim: The source-table X8 point-mass reduction completes the shared powered fixed-wing
  racetrack geometry with independent truth-based altitude, speed, route, and terminal
  gates.
nonclaims:
- attitude or body-rate dynamics
- physical elevon, moment, or actuator authority
- flight-test or manufacturer fidelity
- wind robustness, takeoff, or landing
realization:
  force_source: source_table
  moment_source: not_applicable_point_mass_3dof
  actuator_realization: kinematic_route_command_no_surface_claim
  propulsion_model: source_table_thrust
  resource_model: fixed_mass_zero_propellant
  note: The point-mass adapter integrates translational motion and resolves speed,
    heading, and flight-path commands from the shared racetrack. No attitude, moment,
    or individual surface signal is used to pass the mission.
