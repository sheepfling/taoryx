schema_version: 1
id: taoryx_family_qualification_missions_v1
claim_boundary: independent truth-evaluated family qualification; integration baselines
  remain nonqualified
missions:
- id: hummingbird-hover-to-touchdown-strict-v1
  family: hummingbird
  fidelity_tier: rigid_body_6dof_direct_wrench
  display_name: Hummingbird strict hover-to-touchdown baseline
  evidence_level: integration_baseline_probe
  claim: The source-bounded Hummingbird surrogate can hold its declared airborne start
    and execute the available motor-shutdown landing segment under an independent
    truth evaluator.
  nonclaims:
  - takeoff from ground
  - elevated box waypoint capture
  - gust recovery
  - hardware or flight validity
  problem: examples/mission_families/slower_hummingbird/SV05_return_home_land_6dof.prb
  tables:
  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/hummingbird_cx.tbl
  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/hummingbird_cy.tbl
