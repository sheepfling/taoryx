    - 0.0
    crossing_direction: 1
    window_start_s: 110.0
    window_end_s: 150.0
  - id: pitch-negative-response
    objective_type: event
    event_id: pitch-negative-response
- id: x8-racetrack-altitude-turns-v1
  family: skywalker_x8
  fidelity_tier: rigid_body_6dof_surface_allocated
  display_name: Skywalker X8 racetrack climb, level, return-turn, descent, and start/finish
    gate
  evidence_level: nominal_case_pass_overall_qualification_pending
  claim: The source-bounded X8 rigid-body surrogate follows a reusable, source-domain
    racetrack reference with isolated outbound climb, high-altitude level flight,
    a left lobe, inbound descent, low-altitude recovery, a return lobe, and an oriented
    start/finish crossing through bounded physical elevon allocation.
  nonclaims:
  - source-validated controller or actuator fidelity
  - flight-test or manufacturer fidelity
  - wind robustness
  - takeoff, landing, or runway operations
  realization:
    force_source: source_table
    moment_source: local_surface_inversion
    actuator_realization: bounded_elevon_allocation_bank_pitch_pd
    propulsion_model: source_table_thrust
    resource_model: fixed_mass_zero_propellant
    note: This is a local surface-allocation realization using a declared bank/pitch
      response law and finite-difference source-table derivatives. It commands only
      the roll/pitch subspace available to the two X8 elevon channels; yaw residual
      is reported rather than injected. It is bounded by the declared elevon limits
      and aerodynamic table domain; it is not a manufacturer flight-control law or
      a claim of source-validated actuator dynamics. The current full-route witness
      is intentionally fail-closed when the uncontrolled yaw/sideslip state reaches
      the declared source beta boundary; the short source-domain allocation witness
      remains the active physical-effector evidence until an independently supported
      yaw-control realization is available.
  problem: examples/mission_families/slower_x8/SV03_racetrack_altitude_turns_6dof.prb
  racetrack_binding: x8-reference
  timing_estimate:
    straight_length_m: 700.0
    turn_radius_m: 250.0
    speed_m_s: 17.9
    altitude_delta_m: 10.0
    climb_rate_m_s: 0.5
    descent_rate_m_s: 0.3
  tables:
  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_static_6axis.tbl
  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_collective_elevon_6axis.tbl
  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_differential_elevon_6axis.tbl
  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_thrust.tbl
  max_steps: 14000
  envelope:
  - channel: speed_m_s
    minimum: 2.0
    maximum: 27.0
  - channel: aero_alpha_deg
    minimum: 0.0
    maximum: 12.0
  - channel: aero_sideslip_deg
    minimum: -5.0
    maximum: 5.0
  truth_events:
  - id: left-turn-bank
    channel: route_bank_achieved_deg
    predicate: at_most
    threshold: -5.0
    window_start_s: 39.0
    window_end_s: 85.0
  - id: return-turn-bank
    channel: route_bank_achieved_deg
    predicate: at_most
    threshold: -5.0
    window_start_s: 122.0
    window_end_s: 171.0
  terminal:
    required: true
    objective_type: fly_by_gate
    racetrack_gate_id: terminal-start-finish-gate
    dwell_s: 0.0
    window_start_s: 165.0
    window_end_s: 180.0
    tolerance:
      corridor_m: 120.0
      altitude_m: 15.0
      speed_m_s: 4.0
    crossing_direction: 1
  objectives:
  - id: high-altitude-level-gate
    objective_type: fly_by_gate
    racetrack_gate_id: high-altitude-level-gate
    tolerance:
      corridor_m: 220.0
      altitude_m: 15.0
      speed_m_s: 4.0
    crossing_direction: 1
    window_start_s: 25.0
    window_end_s: 50.0
  - id: left-turn-bank
    objective_type: event
    event_id: left-turn-bank
  - id: left-turn-exit-gate
    objective_type: fly_by_gate
    racetrack_gate_id: left-turn-exit-gate
    tolerance:
      corridor_m: 220.0
      altitude_m: 15.0
      speed_m_s: 4.0
    crossing_direction: 1
    window_start_s: 70.0
    window_end_s: 100.0
  - id: low-altitude-level-gate
