- id: x8-figure-eight-altitude-bank-pitch-v2
  family: skywalker_x8
  fidelity_tier: rigid_body_6dof_direct_wrench
  display_name: "Skywalker X8 figure-eight altitude, bank, and pitch reversal \u2014\
    \ nominal airborne pass; terminal pending"
  evidence_level: nominal_case_pass_overall_qualification_pending
  claim: The source-bounded X8 rigid-body surrogate executes a figure-eight reference
    with explicit high/low altitude gates and truth-observable bank and pitch reversals
    inside the local aerodynamic envelope. An explicit return-to-terminal recovery
    is exercised, but stable terminal closure remains qualification-pending.
  nonclaims:
  - physical actuator authority or source-validated bank and pitch response
  - flight-test or manufacturer fidelity
  - wind robustness
  - full landing or recovery dynamics
  - stable return-to-terminal closure
  realization:
    force_source: source_table
    moment_source: direct_moment
    actuator_realization: direct_moment_injection
    propulsion_model: source_table_thrust
    resource_model: fixed_mass_zero_propellant
    note: The nominal airborne witness uses the declared attitude LQR to produce a
      bounded canonical body moment. Elevon channels are diagnostic only; they do
      not close the attitude loop.
  problem: examples/mission_families/slower_x8/SV03_figure_eight_altitude_reversal_6dof.prb
  tables:
  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_static_6axis.tbl
  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_collective_elevon_6axis.tbl
  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_differential_elevon_6axis.tbl
  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_thrust.tbl
  max_steps: 21000
  envelope:
  - channel: speed_m_s
    minimum: 2.0
    maximum: 27.0
  - channel: aero_alpha_deg
    minimum: 0.0
    maximum: 12.0
  - channel: aero_sideslip_deg
    minimum: -5.0
    maximum: 5.0
  truth_events:
  - id: bank-positive-response
    channel: local_roll_deg
    predicate: at_least
    threshold: 1.0
    window_start_s: 0.0
    window_end_s: 90.0
  - id: bank-negative-response
    channel: local_roll_deg
    predicate: at_most
    threshold: -1.0
    window_start_s: 90.0
    window_end_s: 180.0
  - id: pitch-positive-response
    channel: local_pitch_deg
    predicate: at_least
    threshold: 9.0
    window_start_s: 20.0
    window_end_s: 90.0
  - id: pitch-negative-response
    channel: local_pitch_deg
    predicate: at_most
    threshold: -0.5
    window_start_s: 90.0
    window_end_s: 180.0
  terminal:
    required: true
    dwell_s: 2.0
    window_start_s: 350.0
    window_end_s: 360.0
    target:
      north_m: 0.0
      east_m: 0.0
      altitude_m: 178.0
      speed_m_s: 20.0
    tolerance:
      north_m: 100.0
      east_m: 100.0
      altitude_m: 8.0
      speed_m_s: 4.0
  objectives:
  - id: bank-positive-response
    objective_type: event
    event_id: bank-positive-response
  - id: altitude-high-gate
    objective_type: fly_by_gate
    target:
      north_m: 116.295
      east_m: 559.924
      altitude_m: 220.0
      speed_m_s: 20.0
    tolerance:
      corridor_m: 120.0
      altitude_m: 15.0
      speed_m_s: 3.0
    gate_normal:
    - -0.3431
    - 0.9393
    - 0.0
    crossing_direction: 1
    window_start_s: 20.0
    window_end_s: 60.0
  - id: bank-negative-response
    objective_type: event
    event_id: bank-negative-response
  - id: pitch-positive-response
    objective_type: event
    event_id: pitch-positive-response
  - id: altitude-low-gate
    objective_type: fly_by_gate
    target:
      north_m: 111.138
      east_m: -582.126
      altitude_m: 170.0
      speed_m_s: 20.0
    tolerance:
      corridor_m: 120.0
      altitude_m: 20.0
      speed_m_s: 4.0
    gate_normal:
    - -0.5358
