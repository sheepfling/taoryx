  - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/hummingbird_cmz.tbl
  max_steps: 25000
  terminal:
    required: true
    dwell_s: 1.0
    target:
      north_m: 0.0
      east_m: 0.0
      altitude_m: 0.0
      speed_m_s: 0.0
    tolerance:
      north_m: 0.05
      east_m: 0.05
      altitude_m: 0.05
      speed_m_s: 0.05
  objectives:
  - id: initial-hover-dwell
    objective_type: dwell
    target:
      north_m: 0.0
      east_m: 0.0
      altitude_m: 2.0
      speed_m_s: 0.0
    tolerance:
      north_m: 0.05
      east_m: 0.05
      altitude_m: 0.05
      speed_m_s: 0.05
    dwell_s: 2.0
  - id: motor-shutdown
    objective_type: event
    event_id: motor-shutdown
  - id: touchdown-state
    objective_type: touchdown
    target:
      north_m: 0.0
      east_m: 0.0
      altitude_m: 0.0
      speed_m_s: 0.0
    tolerance:
      north_m: 0.05
      east_m: 0.05
      altitude_m: 0.05
      speed_m_s: 0.05
    dwell_s: 1.0
