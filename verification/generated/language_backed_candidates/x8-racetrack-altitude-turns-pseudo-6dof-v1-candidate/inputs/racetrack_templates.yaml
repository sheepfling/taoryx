schema_version: 1
template:
  id: powered_fixed_wing_racetrack_v1
  family: powered_fixed_wing
  mission_contract: A common powered fixed-wing course with a long outbound straight,
    isolated climb and high-altitude level gate, left semicircle, isolated inbound
    descent and low-altitude level gate, right semicircle, and oriented start/finish
    crossing.
  phase_order:
  - outbound-climb
  - outbound-level
  - left-turn
  - inbound-descent
  - inbound-level
  - right-turn
  realization_rule: Geometry and truth objectives are shared. Guidance, trim, control
    allocation, propulsion, resources, and fidelity claims are supplied by the vehicle
    binding and never inferred from another vehicle.
  required_route_attributes:
  - racetrack-length-m
  - racetrack-turn-radius-m
  - racetrack-speed-mps
  - racetrack-low-altitude-m
  - racetrack-high-altitude-m
  - racetrack-climb-rate-mps
  - racetrack-descent-rate-mps
  gate_semantics:
    high-altitude-level-gate:
      phase: outbound-level
      normal:
      - 0.0
      - 1.0
      - 0.0
    left-turn-exit-gate:
      phase: left-turn
      normal:
      - 0.0
      - -1.0
      - 0.0
    low-altitude-level-gate:
      phase: inbound-level
      normal:
      - 0.0
      - -1.0
      - 0.0
    terminal-start-finish-gate:
      phase: right-turn
      normal:
      - 0.0
      - 1.0
      - 0.0
