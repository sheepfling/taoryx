transition_contract:
  required_fields:
    - entry_guards
    - active_models
    - continuous_schedules
    - exit_guards
    - abort_or_reversion
    - hysteresis_policy
    - resource_continuity
    - state_continuity
    - controller_handoff
  required_evidence:
    - nacelle or rotor-tilt command versus achieved state and rate
    - rotor_lift_fraction and wing_lift_fraction
    - control-mixer weights and per-effector saturation
    - force, attitude, resource, and mode continuity at boundaries
    - forward and reverse conversion
    - abort/reversion case
    - batch versus stepwise equivalence
exit_criteria:
  - R44 source hover fixture reproduces the selected identified model with exact units and normalization recorded.
  - R44 3DOF pad-to-pad mission reaches touchdown with all cyclic, collective, and pedal directions exercised.
  - XV-15 3DOF and pseudo-6DOF conversion pass declared corridor and lift-sharing gates.
  - V-22-class scaled runs retain surrogate labels and pass coherence/sensitivity checks.
  - All three variants enter through the catalog, convention firewall, trim/evaluation harness, and common session path.
  - No mode transition has an undeclared state, force, resource, or controller discontinuity.
  - UH-1H and UH-60A source-point schedules reproduce their supplied matrices and trim conditions with source units and normalization retained.
  - UH-1H nonlinear component transcription and UH-60A GenHel/Airloads validation remain separate future gates.
