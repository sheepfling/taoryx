schema_version: 1
id: taoryx-controller-inventory-v1
claim_boundary: >-
  Runtime-path inventory and migration status. Baseline entries are retained
  for regression and are not controller-qualified evidence.
entries:
  # These are the currently active problem-file paths.  Their gains are
  # explicit runtime-status parameters, so they remain baseline evidence until
  # the common LQR seam replaces them.
  - id: b747-route-guidance-baseline
    family: b747
    vehicle_id: b747
    classification: guidance
    implementation: rule_based
    source: examples/mission_families/slower_b747/SV01_bounded_route_controller_6dof.prb:10
    path: [mission, guidance, plant]
    active_runtime: true
    legacy_baseline: true
    scenario_gain_overrides: true
    qualification_eligible: false
    gain_owner: problem-file-runtime-status
    declared_gains: [propnav-gain, attitude-gain, rate-damping, alpha-hold-gain-deg-per-deg]
    notes: Retain as showcase-v0 comparison; not eligible for controller_qualified.
  - id: b747-local-lqr-design
    family: b747
    vehicle_id: b747
    classification: primary_regulator
    implementation: lqr
    source: verification/controller_designs.yaml:b747-local-lqr
    path: [guidance, reference_shaping, lqr, allocator, actuator, plant]
    design_id: b747-local-lqr
    active_runtime: false
    legacy_baseline: false
    scenario_gain_overrides: false
    qualification_eligible: false
    gain_owner: controller_design_catalog
    notes: Direct-wrench screen only; physical B747 surface authority is separately recorded below.
  - id: b747-condition3-physical-surface-lqr
    family: b747
    vehicle_id: b747
    classification: primary_regulator
    implementation: physical_wrench_lqr
    source: verification/generated/b747_condition3_physical_surface_lqr.json
    path: [trim, nonlinear_linearization, generic_profile_tuning, constrained_surface_allocator, ideal_declared_actuator, source_table_plant]
    design_id: b747-condition3-surface-wrench-lqr
    active_runtime: false
    legacy_baseline: false
    scenario_gain_overrides: false
    qualification_eligible: true
    gain_owner: generated-local-evidence-artifact
    declared_gains: [b747-condition3-profile-sweep-q-v1, b747-condition3-profile-sweep-r-v1]
    notes: >-
      T5 local condition-3 surface validation through actual source-table
      elevator, aileron, rudder, and throttle controls. It remains inactive
      in mission runtime and does not claim source servo dynamics, scheduling,
      low-speed/high-lift configuration, fuel-flow, or engine-out behavior.

  - id: skywalker-x8-route-guidance-baseline
    family: skywalker_x8
    vehicle_id: skywalker_x8
    classification: guidance
    implementation: rule_based
    source: examples/mission_families/slower_x8/SV03_bounded_route_controller_6dof.prb:9
    path: [mission, guidance, plant]
    active_runtime: true
    legacy_baseline: true
    scenario_gain_overrides: true
    qualification_eligible: false
    gain_owner: problem-file-runtime-status
    declared_gains: [propnav-gain, attitude-gain, rate-damping, max-sideslip-deg]
    notes: Preserve for sign/frame diagnosis and comparison only.
  - id: skywalker-x8-local-lqr-design
    family: skywalker_x8
    vehicle_id: skywalker_x8
    classification: primary_regulator
    implementation: lqr
    source: verification/controller_designs.yaml:x8-local-lqr
    path: [guidance, reference_shaping, lqr, allocator, actuator, plant]
    design_id: x8-local-lqr
    active_runtime: false
    legacy_baseline: false
    scenario_gain_overrides: false
    qualification_eligible: true
    gain_owner: controller_design_catalog
    notes: Must resolve bank/pitch sign and frame conventions before route migration.
  - id: skywalker-x8-source-table-coordinate-physical-lqr
    family: skywalker_x8
    vehicle_id: skywalker_x8
    classification: primary_regulator
    implementation: lqr
    source: verification/controller_designs.yaml:x8-source-table-coordinate-wrench-lqr
    path: [trim, nonlinear_linearization, lqr, bounded_table_coordinate_allocation, actuator, nonlinear_plant]
    design_id: x8-source-table-coordinate-wrench-lqr
    active_runtime: false
    legacy_baseline: false
    scenario_gain_overrides: false
    qualification_eligible: false
    gain_owner: controller_design_catalog
    notes: >-
      Local source-trim table-coordinate recovery proof with bounded
      collective/differential actuators, source rate/lag limits, and
      requested-versus-achieved wrench telemetry. It remains ineligible for
      physical-elevon qualification until the public left/right differential
      sign mapping is reconciled.
  - id: skywalker-x8-figure-eight-attitude-lqr-witness
    family: skywalker_x8
    vehicle_id: skywalker_x8
    classification: primary_regulator
    implementation: lqr
    source: examples/mission_families/slower_x8/SV03_figure_eight_altitude_reversal_6dof.prb:11
    path: [guidance, reference_shaping, attitude_lqr, allocator, actuator, plant]
    active_runtime: true
    legacy_baseline: false
    scenario_gain_overrides: true
    qualification_eligible: false
    gain_owner: problem-file-runtime-lqr
    declared_gains: [q-angle, q-rate, r-moment]
    notes: Wiring witness only; route-specific surface and sideslip gains remain outside the LQR contract.
  - id: skywalker-x8-racetrack-elevon-bank-pitch
    family: skywalker_x8
    vehicle_id: skywalker_x8
    classification: allocator_mixer
    implementation: bounded_surface_allocation
    source: examples/mission_families/slower_x8/SV03_racetrack_altitude_turns_6dof.prb:9
    path: [mission, guidance, bank_pitch_response, surface_allocator, elevon_tables, plant]
    active_runtime: true
    legacy_baseline: false
    scenario_gain_overrides: true
    qualification_eligible: false
    gain_owner: problem-file-runtime-status
    declared_gains: [surface-bank-gain-nm-per-rad, surface-bank-rate-damping-nm-s-per-rad, surface-pitch-gain-nm-per-rad, surface-pitch-rate-damping-nm-s-per-rad, surface-inversion-regularization]
    notes: Nominal racetrack truth and source-envelope gates pass for the fixed configuration; two-elevon bank/pitch allocation only, yaw residual reported and not injected. Family robustness and source/flight-test controller fidelity remain unclaimed.

  - id: hummingbird-position-attitude-baseline
    family: hummingbird
    vehicle_id: hummingbird
    classification: legacy_or_special_case
    implementation: rule_based
    source: examples/mission_families/slower_hummingbird/SV05_return_home_land_6dof.prb:9
    path: [mission, guidance, attitude, allocator, actuator, plant]
    active_runtime: true
    legacy_baseline: true
    scenario_gain_overrides: true
    qualification_eligible: false
    gain_owner: problem-file-runtime-status
    declared_gains: [rotorcraft-waypoint-gain-mps2-per-m, rotorcraft-velocity-damping-per-s, rotorcraft-attitude-gain-nm-per-rad, rotorcraft-rate-damping-nm-s-per-rad]
    notes: Position/attitude path retained as a baseline while rate LQR is migrated first.
  - id: hummingbird-rate-lqr-design
    family: hummingbird
    vehicle_id: hummingbird
    classification: primary_regulator
    implementation: lqr
    source: verification/controller_designs.yaml:hummingbird-rate-lqr
    path: [guidance, attitude, rate, lqr, allocator, actuator, plant]
    design_id: hummingbird-rate-lqr
    active_runtime: true
    legacy_baseline: false
    scenario_gain_overrides: false
    qualification_eligible: false
    gain_owner: controller_design_catalog
    notes: >-
      Direct-wrench rate-loop screen at examples/mission_families/slower_hummingbird/SV05_rate_lqr_hover_6dof.prb.
      The legacy runtime bridge does not advance the documented motor lag or
      record requested-versus-achieved nonlinear wrench evidence, so it is not
      independently eligible for physical-controller qualification.
  - id: hummingbird-individual-rotor-hover-physical-lqr
    family: hummingbird
    vehicle_id: hummingbird
    classification: primary_regulator
    implementation: physical_wrench_lqr
    source: verification/generated/hummingbird_individual_rotor_physical_lqr.json
    path: [trim, nonlinear_linearization, lqr, constrained_allocator, motor_lag, individual_rotor_source_plant]
    design_id: hummingbird-individual-rotor-hover-wrench-lqr
    active_runtime: false
    legacy_baseline: false
    scenario_gain_overrides: false
    qualification_eligible: true
    gain_owner: generated-local-evidence-artifact
    declared_gains: [hummingbird-source-hover-attitude-rate-q-v1, hummingbird-source-hover-attitude-rate-r-v1]
    notes: >-
      T5 local hover validation through four physical motor-speed commands.
      It is deliberately inactive in the mission runtime until the same
      actuator state and evidence stream are wired into a full waypoint and
      landing controller.

  - id: x15-phase-guidance-baseline
    family: x15
    vehicle_id: x15
    classification: legacy_or_special_case
    implementation: rule_based
    source: examples/showcases/x15_rocket_to_hawaii/source_trim_then_propnav_6dof.prb:9
    path: [mission, phase_manager, guidance, actuator, plant]
    active_runtime: true
    legacy_baseline: true
    scenario_gain_overrides: true
    qualification_eligible: false
    gain_owner: problem-file-runtime-status
    declared_gains: [propnav-gain, surface-pitch-gain-deg-per-rad, surface-roll-gain-deg-per-rad, surface-yaw-gain-deg-per-rad]
    notes: Source-trim/ProNav baseline; California-to-Hawaii remains a staged boost-glide surrogate.
  - id: x15-bank-lqr-design
    family: x15
    vehicle_id: x15
    classification: primary_regulator
    implementation: lqr
    source: verification/controller_designs.yaml:x15-bank-lqr
    path: [phase_manager, guidance, reference_shaping, lqr, allocator, actuator, plant]
    design_id: x15-bank-lqr
    active_runtime: false
    legacy_baseline: false
    scenario_gain_overrides: false
    qualification_eligible: false
    gain_owner: controller_design_catalog
    notes: >-
      Direct-wrench screen only. Physical promotion is blocked before T1 trim:
      both source-bounded release-glide and frozen full-thrust trim attempts
      fail, the XLR99 deck is not a throttle map, and source RCS geometry/
      impulse and stabilator left/right gearing are unavailable.
  - id: x15-physical-lqr-readiness
    family: x15
    vehicle_id: x15
    classification: primary_regulator
    implementation: physical_lqr_readiness_gate
    source: verification/generated/x15_physical_lqr_readiness.json
    path: [source_control_contract, trim_gate, linearization_gate, allocation_gate, nonlinear_validation_gate]
    active_runtime: false
    legacy_baseline: false
    scenario_gain_overrides: false
    qualification_eligible: false
    gain_owner: generated-readiness-artifact
    notes: >-
      Explicit blocked-before-T1 record. It intentionally has no LQR gain,
      allocator solution, or direct-wrench fallback; it prevents source
      control coordinates from being presented as physical-controller proof.
