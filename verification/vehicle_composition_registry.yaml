schema: taoryx.vehicle-composition-registry/v1alpha1
version: 1
description: >-
  User-facing vehicle-to-trajectory registry. This is a composition overlay:
  it declares available initialization contracts, segment schemas, and mission
  templates without duplicating vehicle physics or promoting a fidelity tier.
vehicles:
  - family_id: skywalker_x8
    initialization_contracts:
      - id: airborne_trim
        status: runnable
        description: Source-domain airborne trim or a declared airborne state.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: north_m, canonical_unit: m, required: false, description: North reference position.}
          - {id: east_m, canonical_unit: m, required: false, description: East reference position.}
          - {id: altitude_m, canonical_unit: m, required: true, description: Initial geometric altitude.}
          - {id: speed_m_s, canonical_unit: m/s, required: true, description: Initial airspeed or speed target.}
          - {id: heading_deg, canonical_unit: deg, required: true, description: Initial course or body heading.}
    segment_contracts:
      - id: trim_hold
        status: runnable
        description: Establish and dwell in source-domain trimmed flight.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: duration_s, canonical_unit: s, required: true, description: Required trimmed dwell duration.}]
        required_control_intents: [speed, altitude, heading]
      - id: climb_level_gate
        status: runnable
        description: Fly a straight climb then cross an oriented level-flight gate.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Required high altitude.}
          - {id: climb_rate_m_s, canonical_unit: m/s, required: true, description: Requested climb rate.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: North-east-down gate center.}
          - {id: corridor_m, canonical_unit: m, required: true, description: Lateral gate tolerance.}
        required_control_intents: [speed, altitude, flight_path]
      - id: fly_by_turn
        status: runnable
        description: Cross an oriented turn gate using the declared turn direction and bank limit.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: turn_direction, canonical_unit: null, required: true, description: left or right route turn.}
          - {id: turn_radius_m, canonical_unit: m, required: true, description: Planned turn radius.}
          - {id: bank_limit_deg, canonical_unit: deg, required: true, description: Maximum commanded bank magnitude.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: Oriented turn-exit gate center.}
        required_control_intents: [bank, heading]
      - id: descent_level_gate
        status: runnable
        description: Fly a straight descent then cross an oriented low-level gate.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Required low altitude.}
          - {id: descent_rate_m_s, canonical_unit: m/s, required: true, description: Requested descent rate.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: North-east-down gate center.}
        required_control_intents: [speed, altitude, flight_path]
      - id: terminal_state_gate
        status: development
        description: Cross a start/finish gate with position, altitude, speed, and heading tolerances.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: target_ned_m, canonical_unit: m, required: true, description: Terminal gate position.}
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Terminal altitude.}
          - {id: target_speed_m_s, canonical_unit: m/s, required: true, description: Terminal speed.}
          - {id: target_heading_deg, canonical_unit: deg, required: true, description: Terminal heading.}
        required_control_intents: [speed, altitude, heading]
    mission_templates:
      - id: powered_fixed_wing_racetrack_v1
        status: runnable
        description: Isolated climb, level, left turn, descent, level, right turn, and start/finish crossing.
        initialization_contracts: [airborne_trim]
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        segment_sequence: [trim_hold, climb_level_gate, fly_by_turn, descent_level_gate, fly_by_turn, terminal_state_gate]
        backing_templates: [powered_fixed_wing_racetrack_v1]
        qualification_missions: [x8-racetrack-altitude-turns-3dof-v1, x8-racetrack-altitude-turns-pseudo-6dof-v1, x8-racetrack-altitude-turns-direct-wrench-v1, x8-racetrack-altitude-turns-v1]

  - family_id: b747
    initialization_contracts:
      - id: airborne_trim
        status: runnable
        description: Source-domain airborne transport trim; this does not imply runway takeoff or landing.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: altitude_m, canonical_unit: m, required: true, description: Initial geometric altitude.}
          - {id: speed_m_s, canonical_unit: m/s, required: true, description: Initial speed.}
          - {id: heading_deg, canonical_unit: deg, required: true, description: Initial heading.}
          - {id: mass_kg, canonical_unit: kg, required: false, description: Initial modeled mass.}
    segment_contracts:
      - id: trim_hold
        status: runnable
        description: Stabilize at the selected transport trim condition.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: duration_s, canonical_unit: s, required: true, description: Required dwell duration.}]
        required_control_intents: [speed, altitude, heading]
      - id: climb_level_gate
        status: runnable
        description: Managed climb to a high-level oriented route gate.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Required high altitude.}
          - {id: climb_rate_m_s, canonical_unit: m/s, required: true, description: Requested climb rate.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: North-east-down high-level gate center.}
          - {id: corridor_m, canonical_unit: m, required: true, description: Lateral high-level gate tolerance.}
        required_control_intents: [speed, altitude, flight_path]
      - id: fly_by_turn
        status: runnable
        description: Large-radius directional transport turn through an oriented gate.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: turn_direction, canonical_unit: null, required: true, description: left or right route turn.}
          - {id: turn_radius_m, canonical_unit: m, required: true, description: Planned turn radius.}
          - {id: bank_limit_deg, canonical_unit: deg, required: true, description: Bank limit.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: North-east-down turn-exit gate center.}
        required_control_intents: [bank, heading]
      - id: descent_level_gate
        status: runnable
        description: Managed descent to a low-level oriented route gate.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Required low altitude.}
          - {id: descent_rate_m_s, canonical_unit: m/s, required: true, description: Requested descent rate.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: North-east-down low-level gate center.}
        required_control_intents: [speed, altitude, flight_path]
      - id: terminal_state_gate
        status: development
        description: Stabilized airborne arrival gate; not a contact or landing segment.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: target_ned_m, canonical_unit: m, required: true, description: Terminal gate position.}
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Terminal altitude.}
          - {id: target_speed_m_s, canonical_unit: m/s, required: true, description: Terminal speed.}
          - {id: target_heading_deg, canonical_unit: deg, required: true, description: Terminal heading.}
        required_control_intents: [speed, altitude, heading]
    mission_templates:
      - id: powered_fixed_wing_racetrack_v1
        status: runnable
        description: Transport-scaled reusable racetrack with isolated vertical and turning demands.
        initialization_contracts: [airborne_trim]
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        segment_sequence: [trim_hold, climb_level_gate, fly_by_turn, descent_level_gate, fly_by_turn, terminal_state_gate]
        backing_templates: [powered_fixed_wing_racetrack_v1]
        qualification_missions: [b747-racetrack-altitude-turns-3dof-v1, b747-racetrack-altitude-turns-pseudo-6dof-v1, b747-racetrack-altitude-turns-6dof-v1]

  - family_id: a320_openap_3dof
    initialization_contracts:
      - id: airborne_trim
        status: runnable
        description: OpenAP airborne operating state with declared mass, speed, altitude, and course.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: altitude_m, canonical_unit: m, required: true, description: Initial altitude.}, {id: speed_m_s, canonical_unit: m/s, required: true, description: Initial speed.}, {id: heading_deg, canonical_unit: deg, required: true, description: Initial course.}, {id: mass_kg, canonical_unit: kg, required: false, description: Initial mass.}]
    segment_contracts:
      - id: trim_hold
        status: runnable
        description: Capture the selected OpenAP operating point.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: duration_s, canonical_unit: s, required: true, description: Dwell duration.}]
        required_control_intents: [speed, altitude, heading]
      - id: climb_level_gate
        status: runnable
        description: Controlled climb and high-level gate crossing.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters:
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Target altitude.}
          - {id: climb_rate_m_s, canonical_unit: m/s, required: true, description: Requested climb rate.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: North-east-down high-level gate center.}
          - {id: corridor_m, canonical_unit: m, required: true, description: Lateral gate tolerance.}
        required_control_intents: [speed, altitude, flight_path]
      - id: fly_by_turn
        status: runnable
        description: Bank-limited turn through an oriented route gate.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters:
          - {id: turn_direction, canonical_unit: null, required: true, description: left or right turn.}
          - {id: turn_radius_m, canonical_unit: m, required: true, description: Turn radius.}
          - {id: bank_limit_deg, canonical_unit: deg, required: true, description: Bank limit.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: North-east-down turn-exit gate center.}
        required_control_intents: [bank, heading]
      - id: descent_level_gate
        status: runnable
        description: Controlled descent and low-level gate crossing.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters:
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Target altitude.}
          - {id: descent_rate_m_s, canonical_unit: m/s, required: true, description: Requested descent rate.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: North-east-down low-level gate center.}
        required_control_intents: [speed, altitude, flight_path]
      - id: terminal_state_gate
        status: development
        description: Stabilized airborne start/finish gate; not a runway arrival or contact segment.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters:
          - {id: target_ned_m, canonical_unit: m, required: true, description: Terminal gate position.}
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Terminal altitude.}
          - {id: target_speed_m_s, canonical_unit: m/s, required: true, description: Terminal speed.}
          - {id: target_heading_deg, canonical_unit: deg, required: true, description: Terminal heading.}
        required_control_intents: [speed, altitude, heading]
    mission_templates:
      - id: powered_fixed_wing_racetrack_v1
        status: runnable
        description: Transport-scale reusable racetrack at the supported performance and pseudo-response levels.
        initialization_contracts: [airborne_trim]
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        segment_sequence: [trim_hold, climb_level_gate, fly_by_turn, descent_level_gate, fly_by_turn, terminal_state_gate]
        backing_templates: [powered_fixed_wing_racetrack_v1]

  - family_id: f16_s119
    initialization_contracts:
      - id: airborne_trim
        status: development
        description: Source-grounded DAVE-ML airborne trim with a declared subsonic operating condition.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: altitude_m, canonical_unit: m, required: true, description: Initial altitude.}
          - {id: speed_m_s, canonical_unit: m/s, required: true, description: Initial speed used by common powered-fixed-wing missions.}
          - {id: mach, canonical_unit: dimensionless, required: true, description: Initial Mach number for source-domain energy missions.}
          - {id: heading_deg, canonical_unit: deg, required: true, description: Initial heading.}
          - {id: mass_kg, canonical_unit: kg, required: false, description: Initial mass.}
    segment_contracts:
      - id: trim_hold
        status: development
        description: Stabilize at a declared source-domain operating point.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: duration_s, canonical_unit: s, required: true, description: Dwell duration.}]
        required_control_intents: [speed, altitude, heading]
      - id: energy_climb
        status: development
        description: Bounded acceleration and climb inside the declared energy envelope.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_mach, canonical_unit: dimensionless, required: true, description: Speed target.}, {id: target_altitude_m, canonical_unit: m, required: true, description: Altitude target.}, {id: load_factor_limit, canonical_unit: g, required: true, description: Maximum permitted load factor.}]
        required_control_intents: [speed, altitude, load_factor]
      - id: fly_by_turn
        status: development
        description: Directed turn with explicit roll reversal evidence.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: turn_direction, canonical_unit: null, required: true, description: left or right turn.}, {id: turn_radius_m, canonical_unit: m, required: true, description: Planned turn radius.}, {id: bank_limit_deg, canonical_unit: deg, required: true, description: Bank limit.}, {id: gate_center_ned_m, canonical_unit: m, required: true, description: Gate location.}]
        required_control_intents: [bank, heading]
      - id: climb_level_gate
        status: development
        description: Source-domain bounded climb and high-level route gate for the reusable airbreather racetrack.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: target_altitude_m, canonical_unit: m, required: true, description: High altitude.}
          - {id: climb_rate_m_s, canonical_unit: m/s, required: true, description: Bounded climb rate.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: North-east-down high-level gate center.}
          - {id: corridor_m, canonical_unit: m, required: true, description: Lateral gate tolerance.}
        required_control_intents: [speed, altitude, flight_path]
      - id: descent_level_gate
        status: development
        description: Source-domain bounded descent and low-level route gate for the reusable airbreather racetrack.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Low altitude.}
          - {id: descent_rate_m_s, canonical_unit: m/s, required: true, description: Bounded descent rate.}
          - {id: gate_center_ned_m, canonical_unit: m, required: true, description: North-east-down low-level gate center.}
        required_control_intents: [speed, altitude, flight_path]
      - id: terminal_state_gate
        status: development
        description: Stabilized airborne start/finish gate for the reusable airbreather racetrack.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters:
          - {id: target_ned_m, canonical_unit: m, required: true, description: Terminal gate position.}
          - {id: target_altitude_m, canonical_unit: m, required: true, description: Terminal altitude.}
          - {id: target_speed_m_s, canonical_unit: m/s, required: true, description: Terminal speed.}
          - {id: target_heading_deg, canonical_unit: deg, required: true, description: Terminal heading.}
        required_control_intents: [speed, altitude, heading]
      - id: energy_recovery_gate
        status: planned
        description: Recover to a bounded speed, altitude, heading, and load-factor terminal set.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_mach, canonical_unit: dimensionless, required: true, description: Terminal Mach.}, {id: target_altitude_m, canonical_unit: m, required: true, description: Terminal altitude.}]
        required_control_intents: [speed, altitude, heading]
    mission_templates:
      - id: powered_fixed_wing_racetrack_v1
        status: development
        description: Reusable subsonic climb, left turn, descent, right turn, and start/finish route.
        initialization_contracts: [airborne_trim]
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        segment_sequence: [trim_hold, climb_level_gate, fly_by_turn, descent_level_gate, fly_by_turn, terminal_state_gate]
        backing_templates: [powered_fixed_wing_racetrack_v1]
      - id: fighter_subsonic_energy_maneuver_v1
        status: development
        description: Subsonic trim, acceleration/climb, right and left energy turns, recovery, and airborne arrival.
        initialization_contracts: [airborne_trim]
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        segment_sequence: [trim_hold, energy_climb, fly_by_turn, fly_by_turn, energy_recovery_gate]

  - family_id: x15
    initialization_contracts:
      - id: air_launch_release
        status: development
        description: Carrier release state with explicit separation, mass, energy, and flight-condition inputs.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: altitude_m, canonical_unit: m, required: true, description: Release altitude.}, {id: speed_m_s, canonical_unit: m/s, required: true, description: Release speed.}, {id: heading_deg, canonical_unit: deg, required: true, description: Release heading.}, {id: mass_kg, canonical_unit: kg, required: false, description: Release mass.}]
      - id: source_release_glide_local_point
        status: runnable
        description: Pinned X-15 source-load local release/glide operating point used only by the direct-wrench recovery screen.
        compatible_fidelities: [rigid_body_6dof_direct_wrench]
      - id: staged_booster_launch
        status: runnable
        description: Local-frame, X-15-scaled booster stack state pinned to the retained rocket-to-Hawaii source staging values; it is not the synthetic California-to-Hawaii vehicle.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters:
          - {id: initial_mass_kg, canonical_unit: kg, required: true, description: Source-pinned stacked launch mass.}
          - {id: initial_speed_m_s, canonical_unit: m/s, required: true, description: Magnitude of the retained source ECIC launch velocity.}
          - {id: initial_altitude_m, canonical_unit: m, required: true, description: Local reduced-model launch altitude.}
          - {id: launch_azimuth_deg, canonical_unit: deg, required: true, description: Declared local-frame reduced-model launch azimuth.}
          - {id: launch_elevation_deg, canonical_unit: deg, required: true, description: Declared local-frame reduced-model launch elevation.}
          - {id: glide_bank_deg, canonical_unit: deg, required: true, description: Declared open-loop glide-bank witness command.}
    segment_contracts:
      - id: separation
        status: development
        description: Carrier separation and clearance event.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: clearance_time_s, canonical_unit: s, required: true, description: Required separation clearance duration.}]
        required_control_intents: [attitude_rate]
        permitted_transition_events: [release]
      - id: local_wrench_recovery_screen
        status: runnable
        description: Bounded local six-axis direct-wrench LQR recovery at the pinned source-load operating point; it is not a navigation segment.
        compatible_fidelities: [rigid_body_6dof_direct_wrench]
        required_control_intents: [wrench]
      - id: powered_climb
        status: development
        description: Bounded rocket-powered acceleration and climb.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_altitude_m, canonical_unit: m, required: true, description: Climb target altitude.}, {id: cutoff_condition, canonical_unit: null, required: true, description: Explicit engine cutoff or burnout condition.}]
        required_control_intents: [throttle, flight_path, bank]
      - id: coast_apogee
        status: development
        description: Ballistic coast through apogee with a declared energy corridor.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_energy, canonical_unit: J/kg, required: true, description: Energy corridor target.}]
        required_control_intents: [bank]
      - id: atmospheric_handoff
        status: development
        description: Re-entry/descent energy management to a named airborne handoff corridor.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_altitude_m, canonical_unit: m, required: true, description: Handoff altitude.}, {id: target_speed_m_s, canonical_unit: m/s, required: true, description: Handoff speed.}, {id: target_heading_deg, canonical_unit: deg, required: true, description: Handoff heading.}]
        required_control_intents: [bank, flight_path]
      - id: booster_powered
        status: runnable
        description: Source-pinned open-loop attached-booster burn ending at the retained cutoff time.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: cutoff_time_s, canonical_unit: s, required: true, description: Booster cutoff time from the retained source mission.}]
        permitted_transition_events: [booster_cutoff]
      - id: booster_coast_release
        status: runnable
        description: Source-pinned coast interval followed by passive spent-booster deployment at the retained release time.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: release_time_s, canonical_unit: s, required: true, description: Booster release time from the retained source mission.}]
        permitted_transition_events: [booster_release]
      - id: unpowered_glide_handoff
        status: runnable
        description: Open-loop reduced glide with independent high-energy and atmospheric-handoff corridor evidence.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: horizon_s, canonical_unit: s, required: true, description: Fixed simulation horizon long enough to include the retained impact witness.}]
        permitted_transition_events: [atmospheric_handoff]
      - id: impact_witness
        status: runnable
        description: Passive terminal impact witness after the open-loop atmospheric handoff; it is not a guided target intercept.
