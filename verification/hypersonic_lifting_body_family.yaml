schema_version: 1
schema: taoryx.hypersonic-lifting-body-family/v1alpha1
family_group_id: hypersonic_lifting_body_research
display_name: Hypersonic lifting-body and entry research family
purpose: >-
  Provide a common comparison vocabulary for X-15 and HL-20 evidence without
  merging their dynamics, propulsion, sources, or qualification claims.
claim_boundary:
  shared_family: research_comparison_only
  shared_dynamics: false
  shared_source_authority: false
  shared_performance_claim: false
members:
  - id: x15_coherent_6dof_public_research_v1
    vehicle_id: x15
    role: powered_hypersonic_research_aircraft
    glide_mode: unpowered_after_release_or_cutoff
    qualification: vehicle_specific_public_research_surrogate
    source_fixture: tests/fixtures/x15_coherent_6dof_public_research_v1
  - id: reference_hl20_mod_k
    vehicle_id: reference_hl20_mod_k
    role: unpowered_lifting_body_entry_glider
    glide_mode: unpowered_baseline
    qualification: source_grounded_reference_anchor
    source_family_manifest: families/reference_hl20_mod_k/family.yaml
comparison_contract:
  scenario_id: hypersonic-lifting-body-ca-hi-comparison-v1
  route: synthetic_california_to_hawaii
  status: contract_only
  source_evidence: false
  controller_claims: false
  required_phases:
    - release_or_initial_condition
    - energy_entry
    - hypersonic_glide
    - terminal_arrival_or_termination
  normalized_channels:
    - time_s
    - altitude_m
    - mach
    - dynamic_pressure_pa
    - latitude_deg
    - longitude_deg
    - range_to_target_m
    - flight_path_angle_deg
    - bank_angle_deg
    - angle_of_attack_deg
    - mass_kg
  comparison_outputs:
    - phase_timestamps
    - altitude_mach_envelope
    - specific_energy_history
    - range_and_crossrange
    - control_surface_or_throttle_activity
    - termination_disposition
  interpretation: >-
    Compare phase structure, normalized telemetry, and bounded entry/glide
    behavior. Do not compare route success, thermal protection, landing, or
    controllability unless a separately qualified model and mission contract
    supplies those claims.
rocket_composition:
  status: qualified_through_hl20_g6
  quality_gate_contract: examples/showcases/hl20_california_to_hawaii/quality_gates.yaml
  quality_gate_report: verification/hl20_ca_hi_qualification.json
  parent_role: generic_or_source_grounded_booster
  child_role: vehicle_specific_release_and_glide_model
  lineage_requirements:
    - parent_id
    - child_id
    - release_event_id
    - accepted_release_time_s
    - parent_pre_release_state
    - child_initial_state
    - source_and_assumption_provenance
  fidelity_ladder:
    - id: boost_release_3dof
      runtime_fidelity: point_mass_3dof
      qualification: verified_witness
      evidence: release_state_and_energy_budget
    - id: boost_release_pseudo6dof
      runtime_fidelity: pseudo_6dof
      qualification: verified_witness
      evidence: attitude_response_and_release_alignment
    - id: boost_release_rigid6dof
      runtime_fidelity: rigid_body_6dof
      qualification: verified_witness
      evidence: force_moment_scaling_and_event_continuity
    - id: boost_release_rigid6dof_surface_allocated
      runtime_fidelity: rigid_body_6dof_surface_allocated
      qualification: verified_witness
      evidence: logical_surface_allocation_and_residual_telemetry
  members:
    x15:
      rocket_parent: synthetic_or_existing_booster_contract
      release_child: x15_coherent_6dof_public_research_v1
      first_case: examples/showcases/x15_rocket_to_hawaii/mission.prb
    hl20:
      rocket_parent: generic_staged_booster_v1
      release_child: reference_hl20_mod_k
      first_case: examples/showcases/hl20_california_to_hawaii/showcase.yaml
      low_fidelity_runner: src/taoryx/hl20_reachability.py
      low_fidelity_status: verified_witness
      fidelity_ladder_status: all_four_executable
