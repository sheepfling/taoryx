schema: taoryx.flight-dynamics-surrogate-parameters/v1
status: intake
claim_boundary: >-
  Public-data flight-dynamics engineering proxies for trajectory, control,
  reachability, and corpus experiments; not exact vehicle reconstructions,
  classified models, or manufacturer-grade performance claims.
evidence_grades:
  P: direct public or government source
  D: derived from public geometry or performance using standard physics
  E: engineering estimate constrained by vehicle class and comparable systems
  S: scenario placeholder requiring sensitivity analysis
equation_families:
  multirotor_or_helicopter:
    fidelity_profiles: [point_mass_3dof, attitude_response_p6dof]
    controls: [acceleration_vector, yaw_rate]
  conventional_fixed_wing:
    fidelity_profiles: [point_mass_3dof, attitude_response_p6dof]
    controls: [thrust, bank, load_factor]
  vectored_thrust_hybrid:
    fidelity_profiles: [point_mass_3dof, transition_response_p6dof]
    modes: [vertical, transition, wingborne, recovery]
  tiltrotor:
    fidelity_profiles: [point_mass_3dof, transition_response_p6dof]
    state_extensions: [nacelle_angle]
parameter_rules:
  - id: hover_power_margin
    rule: nominal_hover_power <= 0.65 * installed_peak_power
  - id: payload_monotonicity
    rule: increasing_payload_must_not_improve_acceleration_climb_range_or_endurance
  - id: stall_consistency
    rule: "derived_sea_level_stall_speed_matches_manifest_within_fraction: 0.03"
  - id: speed_equilibrium
    rule: maximum_speed_is_thrust_drag_intersection_at_declared_altitude
  - id: transition_continuity
    rule: hybrid_force_and_attitude_transition_has_no_discontinuity
  - id: uncertainty_sweep
    rule: "E_grade_plus_or_minus_25_percent_and_S_grade_full_band"
parameter_contract:
  promoted_parameter_fields_require: [value, unit, evidence_grade, source_ref, uncertainty_policy]
  evidence_grades: [P, D, E, S]
  missing_value_policy: explicit_unknown_or_blocked
  compact_vehicle_fields_are: compatibility_views
  authoritative_review_surface: parameter_ledger
  supported_loading_states: [light, nominal, heavy, dash]
  required_result_identity: [vehicle_id, loading_state, energy_backend, fidelity_profile, mission_id, environment_id]
state_contract:
  common_pseudo_6dof_state:
    - {name: position_n_m, type: vector3, unit: m, purpose: inertial_position}
    - {name: velocity_b_m_s, type: vector3, unit: m/s, purpose: body_axis_velocity}
    - {name: quaternion_bn, type: quaternion, unit: dimensionless, purpose: body_to_navigation_attitude}
    - {name: body_rates_b_rad_s, type: vector3, unit: rad/s, purpose: body_angular_rates}
    - {name: fuel_remaining_kg, type: scalar, unit: kg, purpose: fuel_resource_or_zero}
    - {name: battery_energy_j, type: scalar, unit: J, purpose: battery_resource_or_zero}
    - {name: actuator_states, type: mapping, unit: declared_per_channel, purpose: lagged_commands}
    - {name: hover_to_wingborne_blend, type: scalar, unit: dimensionless, purpose: continuous_transition}
    - {name: nacelle_angle_rad, type: scalar, unit: rad, purpose: tiltrotor_conversion_or_zero}
  reductions:
    point_mass_3dof: [position_n_m, velocity_b_m_s, fuel_remaining_kg, battery_energy_j]
    pseudo_6dof: [position_n_m, velocity_b_m_s, quaternion_bn, body_rates_b_rad_s, fuel_remaining_kg, battery_energy_j, actuator_states, hover_to_wingborne_blend, nacelle_angle_rad]
energy_backends:
  battery_electric:
    resource_state: battery_energy_j
    mass_policy: constant_battery_mass
    equations:
      power_w: "sum(shaft_power_w) / (motor_efficiency * esc_efficiency) + avionics_power_w + payload_power_w"
      energy_rate_w: "-power_w"
      soc: "battery_energy_j / usable_battery_energy_j"
      available_power_w: "peak_power_w when soc >= derate_soc else peak_power_w * (0.65 + 0.35 * soc / derate_soc)"
    required_observables: [battery_energy_j, soc, battery_power_w, available_power_w, reserve_violation]
  fuel_burning:
    resource_state: fuel_remaining_kg
    mass_policy: continuous_fuel_mass_loss
    equations:
      jet_fuel_flow_kg_s: "-tsfc_kg_per_n_h * thrust_n / 3600"
      shaft_fuel_flow_kg_s: "-bsfc_kg_per_kwh * shaft_power_kw / 3600"
      mass_kg: "empty_mass_kg + payload_mass_kg + fuel_remaining_kg"
      cg_m: "linear_interpolation(full_fuel_cg_m, empty_fuel_cg_m, fuel_fraction)"
    required_observables: [fuel_remaining_kg, fuel_flow_kg_s, mass_kg, cg_m, inertia_kg_m2, reserve_violation]
  series_hybrid:
    resource_state: [battery_energy_j, fuel_remaining_kg]
    mass_policy: fuel_mass_loss_battery_mass_retained
    equations:
      bus_power_w: "generator_power_w + battery_power_w"
      battery_energy_rate_w: "-battery_power_w"
      generator_fuel_flow_kg_s: "-generator_bsfc_kg_per_kwh * generator_power_kw / 3600"
      generator_load_policy: "efficient_load_band_with_battery_buffering"
    required_observables: [generator_power_w, battery_power_w, bus_power_w, fuel_flow_kg_s, soc, reserve_violation]
  selectable:
    selection_policy: preserve_backend_in_configuration_identity
    allowed_backends: [battery_electric, fuel_burning]
flight_mode_contract:
  required_fields: [mode_id, entry_conditions, blend_state, exit_conditions, abort_conditions, resource_policy]
  generic_modes: [prep, launch, deployment, vertical, transition, wingborne, climb, transit, task, return, recovery, terminal, abort]
  continuous_transition_modes: [roadrunner, omen, thunder]
  event_markers: [mode_entry, mode_exit, mode_abort, reserve_violation, control_authority_loss, resource_depletion]
propulsion_models:
  rotor:
    thrust_fraction: "normalized_rotor_speed^2"
    power_fraction: "normalized_rotor_speed^3"
    induced_power: "proportional_to_thrust_to_three_halves"
  propeller:
    maximum_thrust: "min(static_thrust, propeller_efficiency(speed) * maximum_power / max(speed, speed_epsilon))"
  air_breathing_jet:
    thrust_lapse: "sea_level_thrust * throttle_fraction * density_ratio^0.7 * mach_lapse"
    spool: "clip((commanded_spool - spool) / spool_time_constant, -deceleration_limit, acceleration_limit)"
  tiltrotor:
    bus_power: "generator_power + battery_power"
    conversion_state: nacelle_angle_rad
aerodynamic_proxy_contract:
  longitudinal: [cl0, cl_alpha, cl_q, cl_control, cd0, induced_drag_factor, cd_alpha_squared, cm0, cm_alpha, cm_q, cm_control]
  lateral_directional: [cy_beta, cl_beta, cn_beta, cl_p, cn_r, cl_aileron, cm_elevator, cn_rudder]
  transonic_drag_required_for: [roadrunner, barracuda_100, barracuda_250, barracuda_500, fury_fq44]
  post_stall_blend_required_for: [roadrunner, omen]
validation_ladder:
  - id: data_firewall
    checks: [units, evidence_grade, source_reference, uncertainty_band, explicit_unknowns]
  - id: resource_balance
    checks: [nonnegative_resource, reserve_guard, power_or_fuel_balance, payload_monotonicity]
  - id: plant_equilibrium
    checks: [hover_or_cruise_trim, stall_consistency, thrust_drag_intersection, load_factor_limit]
  - id: transition_continuity
    checks: [force_continuity, moment_continuity, attitude_continuity, mode_event_contract]
  - id: actuator_and_control
    checks: [allocation_rank, lag, rate_limit, saturation, requested_achieved_separation]
  - id: paired_fidelity
    checks: [same_parent_configuration, 3dof_vs_pseudo_6dof_comparison, declared_omissions]
  - id: uncertainty_and_reachability
    checks: [e_grade_plus_or_minus_25_percent, s_grade_full_band, multi_start, boundary_resolution]
