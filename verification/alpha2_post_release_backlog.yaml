  - id: A2-POST-P3-2A
    priority: P3
    name: parametric-spacecraft-family-qualification
    status: planned
    depends_on: [A2-POST-P2-2, A2-POST-P3-2]
    rationale: Spacecraft breadth should come from coherent, evidence-labeled families with qualified wheel and thruster behavior, not from independently sampled subsystem fields or implied replicas of public vehicles.
    scope:
      - spacecraft.6u_observer_rw.standard.v1 with detumble, pointing, wheel saturation, and magnetic unloading
      - spacecraft.6u_observer_rw.resilient.v1 with skewed-wheel and one-wheel-out analysis
      - spacecraft.agile_imager_rw.v1 with torque-versus-momentum slew studies
      - spacecraft.spheres_like_rcs.v1 with six-axis pulsed-thruster allocation and proximity-control fixtures
      - spacecraft.marco_like_hybrid.v1 with finite burns, wheel compensation, and RCS unloading
      - CPOD-like proximity and one-thruster-out variants as follow-on fixtures
      - coherent sizing from inertia, slew, acceleration, impulse-bit, propellant, and failure requirements
      - reaction-wheel and thruster maturity gates, source registers, uncertainty ranges, and evidence labels
      - allocation matrices, attainable-wrench envelopes, resource models, failure modes, and analytical checks
    exit_criteria:
      - every family resolves from a versioned manifest without implementation edits
      - public facts, component ranges, derived values, geometry estimates, engineering nominals, and sampled values remain distinct
      - wheel torque, momentum, speed, power, saturation, and unloading behavior are independently reported
      - thruster force/moment, pulse quantization, latency, propellant use, and failed-actuator reallocation are independently reported
      - nonnegative allocation and attainable-wrench tests pass for every advertised configuration
      - flagship missions produce replayable telemetry, terminal status, resource accounting, and qualification evidence
      - synthetic source anchors are not presented as exact replicas or flight-vehicle specifications

  - id: A2-POST-P3-3
    priority: P3
    target_release: alpha3
    lane: alpha3-breadth
    name: sensor-weather-and-measurement-layer
    status: planned
    depends_on: [A2-POST-P0-1, A2-POST-P0-2, A2-POST-P3-1]
    design_doc: docs/plan/sensor-measurement-orchestration.md
    rationale: Sensors and weather are shared environment/observation layers, not fields to bolt onto one vehicle. Taoryx owns the causal orchestration boundary between committed physical truth and sensed-data consumers; external sensor libraries own their measurement-error physics.
    scope:
      - atomic immutable TruthPoint and TruthSegment commits with shared timestamps, frames, transforms, environment fields, and integration status
      - causal multi-rate event scheduling with explicit sample time, availability time, latency, validity, and actuator latching
      - ideal sensor projection followed by sensor errors/electronics/timing; never mutate or relabel generic EOM state increments as corrupted truth
      - stateful IMU adapter for delta angle and delta velocity, including mounting transform, lever arm, gravity/specific-force convention, chronological call count, and persistent stochastic state
      - focal-plane, seeker, radar, air-data, and target-observation pipelines with projection, exposure/dwell, blur/jitter, detector effects, quantization, saturation, and post-processing stages
      - event-aligned propagation or committed dense trajectory output; never expose Runge-Kutta intermediate stages as physical truth
      - sensor-specific seeded random streams, reproducible replay, packet drops, latency, out-of-order protection, and unavailable/invalid measurements
      - estimator, tracker, guidance, control, and decision ports that consume sensed or estimated data rather than truth
      - wind/weather provider boundary and air-relative force semantics
      - perfect-navigation, sensor-closed-loop, and hardware/SWIL producer bindings behind the same estimator/guidance contracts
      - truth-isolation enforcement and provenance for every truth, measurement, estimate, command, and EOM interval
    validation_ladder:
      - contract tests for atomic truth commits, frame conventions, interval semantics, packet timing, and validity
      - deterministic zero-error sensor tests against ideal projections
      - IMU analytical tests for constant pose, constant velocity, constant acceleration, rotation, gravity, mounting, and lever-arm cases
      - multi-rate causality tests proving Measurement[k] depends on TruthSegment[k-1,k] and Command[k] first affects TruthSegment[k,k+1]
      - seeded replay and independent-stream tests for bias, random walk, noise, quantization, saturation, and packet loss
      - truth-leakage tests showing guidance and control fail or remain unchanged when truth ports are unavailable
      - focal-plane/seeker tests for boresight, projection, exposure, blur, detector noise, centroiding, latency, and target occlusion
      - closed-loop comparisons across perfect-navigation, synthetic-measurement, and hardware/SWIL modes
      - sensor realism regression fixtures attached to promoted vehicle and segment validation cases
    exit_criteria:
      - the orchestration contract is implemented independently of the EOM and any single sensor-error library
      - truth and observation channels cannot silently cross the declared boundary
      - every measurement packet carries sampled time, available time, interval provenance, validity, and sensor identity
      - IMU sampling is exactly once per scheduled event, chronological, convention-checked, and stateful across calls
      - multi-rate sensors receive committed event-aligned truth or committed dense trajectory values rather than endpoint-only fakes
      - seeded measurement replay is deterministic
      - weather inputs retain source/provenance and interpolation diagnostics
      - sensor-closed-loop results identify sensor configuration, timing, estimator mode, random seed, and truth-isolation status
      - promoted segments report both plant-truth and sensed-data quality where the segment claims closed-loop validity

  - id: A2-POST-P4-1
    priority: P4
    name: historical-taos-compatibility
    status: blocked_external
    depends_on: []
    rationale: Historical behavior requires an executable, source tree, complete table library, or trusted output corpus that is not currently available.
    scope:
      - historical executable/source acquisition
      - intermediate-state and output-format comparison
      - separate source-faithful and successor/adjudicated modes
    exit_criteria:
      - an external historical oracle is pinned and independently reproducible
      - compatibility claims are released separately from successor-side claims
      - no inferred behavior is promoted silently
non_goals_for_this_backlog:
  - adding bespoke family runners or problem dialects for each new vehicle
  - certifying real vehicles from synthetic or public-surrogate data
  - treating pseudo_6dof as rigid-body evidence
  - building a remote marketplace or untrusted hot-loader
  - widening tolerances to force a controller mission to pass
stop_ship:
  - new family has no integration record or source/evidence classification
  - mission score hides a failed required plant or event gate
  - interactive action bypasses control authority, limits, or actuator dynamics
  - source-grounded and synthetic claims share one unqualified badge
  - a modern optimizer result is labeled historical compatibility
