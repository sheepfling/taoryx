      - {id: mission.initial_heading_offset, kind: number, canonical_unit: deg, default: 0.0, minimum: -180.0, maximum: 180.0}
      - {id: mission.target_altitude, kind: number, canonical_unit: m, default: 1000.0, minimum: 0.0}
      - {id: mission.target_speed, kind: number, canonical_unit: m/s, default: 60.0, minimum: 0.0}
      - {id: mission.target_heading, kind: number, canonical_unit: deg, default: 90.0, minimum: -360.0, maximum: 360.0}
