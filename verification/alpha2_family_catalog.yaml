      - {id: vehicle.aero.drag_coefficient, kind: number, canonical_unit: dimensionless, default: 0.02, minimum: 0.0}
      - {id: vehicle.aero.lift_to_drag, kind: number, canonical_unit: dimensionless, default: 4.0, minimum: 0.0}
