      - {id: vehicle.aero.moment_coefficient.y, kind: number, canonical_unit: dimensionless, default: 0.0004}
      - {id: vehicle.aero.moment_coefficient.z, kind: number, canonical_unit: dimensionless, default: 0.0006}
