      - {id: vehicle.geometry.reference_length, kind: number, canonical_unit: m, default: 1.0, minimum: 0.0001}
      - {id: vehicle.inertia.x, kind: number, canonical_unit: kg*m^2, default: 100.0, minimum: 0.0001}
