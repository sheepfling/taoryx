      - {id: mission.initial_speed, kind: number, canonical_unit: m/s, default: 60.0, minimum: 0.0}
      - {id: mission.burnout_speed, kind: number, canonical_unit: m/s, default: 120.0, minimum: 0.0001}
      - {id: mission.apogee_altitude, kind: number, canonical_unit: m, default: 1200.0, minimum: 0.0001}
      - {id: mission.pitch_over_angle, kind: number, canonical_unit: deg, default: 0.0, minimum: -89.0, maximum: 89.0}
      - {id: mission.target_range, kind: number, canonical_unit: m, default: 1000.0, minimum: 0.0}
