      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/b747_jt9d_thrust.tbl
    initial_state_si: {altitude_m: 100.0, true_airspeed_m_s: 153.0096, mass_kg: 288756.9, alpha_deg: 3.1, beta_deg: 0.0}
    environment: {atmosphere: standard, wind_m_s: [0.0, 0.0, 0.0], earth_model: wgs-84, earth_omega_rad_s: 0.0}
    propulsion: {model: constant-thrust, thrust_n: 179539.8975191153, mass_flow_kg_s: 0.0}
    command_schedule: [{start_s: 0.0, end_s: 0.1, controls: {elevator_deg: 0.3861602391}}]
    event_schedule: []
