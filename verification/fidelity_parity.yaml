schema_version: 1
id: taoryx_shared_fidelity_parity_v1
description: >-
  Shared reduction-parity contracts. A complete entry has one physical plant,
  one initial state, one environment, one command/event schedule, and one
  termination policy shared by all three dynamics tiers. Blocked entries are
  retained so the catalog cannot silently omit a vehicle family.
required_fields:
  - initial_state_si
  - environment
  - source_tables
  - propulsion
  - command_schedule
  - event_schedule
  - duration_s
  - termination_policy
  - state_mapping
  - reduction_kind
  - parity_tolerances
  - continuity_tolerances
families:
  - id: b747
    scenario_id: b747-source-anchor-reduction-v1
    status: candidate
    reduction_kind: point-mass-3dof
    parity_tolerances: {altitude_m: 0.1, speed_m_s: 0.1, mass_kg: 1.0e-6}
    continuity_tolerances: {altitude_m: 1.0, speed_m_s: 1.0, mass_kg: 1.0}
    point_output_units: native-fps
    rigid_output_units: si
    state_mapping:
      altitude_m: {point: alt, rigid: altitude_m, point_scale: 0.3048, rigid_scale: 1.0}
      speed_m_s: {point: vel, rigid: speed_m_s, point_scale: 0.3048, rigid_scale: 1.0}
      mass_kg: {point: mass, rigid: mass_kg, point_scale: 0.45359237, rigid_scale: 1.0}
    point_mass_problem: examples/mission_families/slower_b747/SV01_powered_trim_reduction_3dof.prb
    bridge_source_problem: examples/mission_families/slower_b747/SV01_powered_trim_reduction_3dof.prb
    constrained_rigid_problem: examples/mission_families/slower_b747/SV01_powered_trim_parity_6dof.prb
    source_tables:
