schema_version: 1
id: taoryx_controller_missions_v1
claim_boundary: >-
  Source-bounded native TAORYX controller-mission evidence. These cases are
  controller and route-transition demonstrations, not flight qualification,
  historical TAOS compatibility, or target-intercept claims.
missions:
  - id: b747-integrated-route-transition
    family: b747
    display_name: B747 integrated route and altitude transition
    problem: examples/mission_families/slower_b747/SV01_integrated_route_descent_6dof.prb
    tables:
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/b747_nominal_elevator_6axis.tbl
    max_steps: 2000
    convergence:
      window_s: 5.0
      factors: [1.0, 0.5, 0.25]
      channels: [altitude_m, speed_m_s]
      tolerances: {altitude_m: 0.5, speed_m_s: 0.05}
    showcase:
      route_frame: local_ned
      waypoints:
        - {id: start, north_m: 0.0, east_m: 0.0, altitude_m: 100.0, capture_radius_m: 50.0, objective: trim-start, completion_event: start-contract}
        - {id: arrival, north_m: 0.0, east_m: 3339.6, altitude_m: 100.0, capture_radius_m: 500.0, objective: route-capture, completion_event: b747-arrival-captured}
      required_objectives: [trim-start, route-capture, stabilized-arrival]
      objective_events: [start-contract, b747-arrival-captured, stabilized-arrival]
    objectives:
      - {id: duration, kind: controller_mission, channel: duration_s, target: 20.0, tolerance: 0.01, quality_limit: 0.10, unit: s, source: summary}
      - {id: route-capture, kind: route_transition, channel: range_to_target_m, target: 500.0, tolerance: 1.0, quality_limit: 100.0, unit: m, comparison: maximum, source: final}
      - {id: alpha-envelope, kind: envelope, channel: aero_alpha_deg, target: 4.0, tolerance: 0.01, quality_limit: 3.2, unit: deg, comparison: maximum, source: max_abs}
      - {id: beta-envelope, kind: envelope, channel: aero_sideslip_deg, target: 5.0, tolerance: 0.01, quality_limit: 4.0, unit: deg, comparison: maximum, source: max_abs}
      - {id: controller-unsaturated, kind: actuator, channel: attitude_controller_saturated, target: 0.0, tolerance: 0.01, quality_limit: 0.01, unit: "1", comparison: maximum, source: max_abs}
      - {id: table-margin-reserve, kind: envelope, channel: table_margin_min_normalized, target: 0.10, tolerance: 0.10, quality_limit: 0.10, unit: "1", comparison: minimum, source: summary, severity: advisory}
      - {id: control-saturation-fraction, kind: actuator, channel: control_saturation_fraction, target: 0.0, tolerance: 0.01, quality_limit: 0.10, unit: "1", comparison: maximum, source: summary, severity: advisory}
      - {id: control-rate-average, kind: actuator, channel: control_derivative_abs_average, target: 5.0, tolerance: 5.0, quality_limit: 5.0, unit: deg/s, comparison: maximum, source: summary, severity: advisory}
      - {id: control-rate-maximum, kind: actuator, channel: control_derivative_abs_max, target: 30.0, tolerance: 30.0, quality_limit: 30.0, unit: deg/s, comparison: maximum, source: summary, severity: advisory}

  - id: skywalker-x8-powered-rectangle
    family: skywalker_x8
    display_name: Skywalker X8 powered rectangular route
    problem: examples/mission_families/slower_x8/SV03_long_rectangle_route_6dof.prb
    tables:
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_static_6axis.tbl
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_collective_elevon_6axis.tbl
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_differential_elevon_6axis.tbl
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/skywalker_x8_thrust.tbl
    max_steps: 10000
    convergence:
      window_s: 10.0
      factors: [1.0, 0.5, 0.25]
      channels: [altitude_m, speed_m_s]
      tolerances: {altitude_m: 1.0, speed_m_s: 0.1}
    showcase:
      route_frame: local_ned
      waypoints:
        - {id: start, north_m: 0.0, east_m: 0.0, altitude_m: 178.0, capture_radius_m: 25.0, objective: trim-start, completion_event: start-contract}
        - {id: corner-1, north_m: 615.0, east_m: 0.0, altitude_m: 178.0, capture_radius_m: 75.0, objective: east-leg, completion_event: x8-corner-1-captured}
        - {id: corner-2, north_m: 615.0, east_m: 615.0, altitude_m: 210.0, capture_radius_m: 75.0, objective: elevated-corner, completion_event: x8-corner-2-captured}
        - {id: corner-3, north_m: 0.0, east_m: 615.0, altitude_m: 178.0, capture_radius_m: 75.0, objective: north-leg, completion_event: x8-corner-3-captured}
        - {id: return, north_m: 0.0, east_m: 0.0, altitude_m: 178.0, capture_radius_m: 300.0, objective: return-capture, completion_event: x8-return-captured}
      required_objectives: [trim-start, east-leg, elevated-corner, north-leg, return-capture, stabilized-arrival]
      objective_events: [start-contract, x8-corner-1-captured, x8-corner-2-captured, x8-corner-3-captured, x8-return-captured, stabilized-arrival]
    objectives:
      - {id: duration, kind: controller_mission, channel: duration_s, target: 120.0, tolerance: 0.01, quality_limit: 0.10, unit: s, source: summary}
      - {id: final-corner-capture, kind: waypoint, channel: range_to_target_m, target: 300.0, tolerance: 1.0, quality_limit: 50.0, unit: m, comparison: maximum, source: final}
      - {id: alpha-envelope, kind: envelope, channel: aero_alpha_deg, target: 12.0, tolerance: 0.01, quality_limit: 9.6, unit: deg, comparison: maximum, source: max_abs}
      - {id: beta-envelope, kind: envelope, channel: aero_sideslip_deg, target: 5.0, tolerance: 0.01, quality_limit: 4.0, unit: deg, comparison: maximum, source: max_abs}
      - {id: controller-unsaturated, kind: actuator, channel: attitude_controller_saturated, target: 0.0, tolerance: 0.01, quality_limit: 0.01, unit: "1", comparison: maximum, source: max_abs}
      - {id: table-margin-reserve, kind: envelope, channel: table_margin_min_normalized, target: 0.10, tolerance: 0.10, quality_limit: 0.10, unit: "1", comparison: minimum, source: summary, severity: advisory}
      - {id: control-saturation-fraction, kind: actuator, channel: control_saturation_fraction, target: 0.0, tolerance: 0.01, quality_limit: 0.10, unit: "1", comparison: maximum, source: summary, severity: advisory}
      - {id: control-rate-average, kind: actuator, channel: control_derivative_abs_average, target: 20.0, tolerance: 20.0, quality_limit: 20.0, unit: deg/s, comparison: maximum, source: summary, severity: advisory}
      - {id: control-rate-maximum, kind: actuator, channel: control_derivative_abs_max, target: 100.0, tolerance: 100.0, quality_limit: 100.0, unit: deg/s, comparison: maximum, source: summary, severity: advisory}

  - id: hummingbird-elevated-rectangle
    family: hummingbird
    display_name: Hummingbird hover, elevated corner, and return
    problem: examples/mission_families/slower_hummingbird/SV05_rectangle_course_6dof.prb
    tables:
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/hummingbird_cx.tbl
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/hummingbird_cy.tbl
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/hummingbird_cz.tbl
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/hummingbird_cmx.tbl
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/hummingbird_cmy.tbl
      - tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/hummingbird_cmz.tbl
    max_steps: 50000
    convergence:
      window_s: 5.0
      factors: [1.0, 0.5, 0.25]
      channels: [altitude_m, speed_m_s]
      tolerances: {altitude_m: 0.2, speed_m_s: 0.05}
    showcase:
      route_frame: local_ned
      waypoints:
        - {id: pad, north_m: 0.0, east_m: 0.0, altitude_m: 2.0, capture_radius_m: 0.05, objective: hover-start, completion_event: start-contract}
        - {id: north, north_m: 0.5, east_m: 0.0, altitude_m: 2.0, capture_radius_m: 0.10, objective: north-leg, completion_event: hummingbird-north-captured}
        - {id: elevated, north_m: 0.5, east_m: 0.5, altitude_m: 3.0, capture_radius_m: 0.10, objective: elevated-corner, completion_event: hummingbird-elevated-captured}
        - {id: return, north_m: 0.0, east_m: 0.0, altitude_m: 2.0, capture_radius_m: 0.20, objective: return-capture, completion_event: hummingbird-return-captured}
      required_objectives: [hover-start, north-leg, elevated-corner, return-capture, landed]
      objective_events: [start-contract, hummingbird-north-captured, hummingbird-elevated-captured, hummingbird-return-captured, landed]
    objectives:
      - {id: duration, kind: controller_mission, channel: duration_s, target: 40.0, tolerance: 0.01, quality_limit: 0.10, unit: s, source: summary}
      - {id: return-capture, kind: waypoint, channel: range_to_target_m, target: 0.20, tolerance: 0.01, quality_limit: 0.10, unit: m, comparison: maximum, source: final}
      - {id: speed-envelope, kind: envelope, channel: speed_m_s, target: 10.0, tolerance: 0.01, quality_limit: 8.0, unit: m/s, comparison: maximum, source: max}
      - {id: altitude-envelope, kind: envelope, channel: altitude_m, target: 3.5, tolerance: 0.01, quality_limit: 3.0, unit: m, comparison: maximum, source: max}
      - {id: table-margin-reserve, kind: envelope, channel: table_margin_min_normalized, target: 0.10, tolerance: 0.10, quality_limit: 0.10, unit: "1", comparison: minimum, source: summary, severity: advisory}
      - {id: control-saturation-fraction, kind: actuator, channel: control_saturation_fraction, target: 0.0, tolerance: 0.01, quality_limit: 0.10, unit: "1", comparison: maximum, source: summary, severity: advisory}
      - {id: control-rate-average, kind: actuator, channel: control_derivative_abs_average, target: 500.0, tolerance: 500.0, quality_limit: 500.0, unit: rad/s2, comparison: maximum, source: summary, severity: advisory}
      - {id: control-rate-maximum, kind: actuator, channel: control_derivative_abs_max, target: 5000.0, tolerance: 5000.0, quality_limit: 5000.0, unit: rad/s2, comparison: maximum, source: summary, severity: advisory}

  - id: x15-source-trim-propnav-transition
    family: x15
    display_name: X-15 source trim to native ProNav transition
    problem: examples/showcases/x15_rocket_to_hawaii/source_trim_then_propnav_6dof.prb
    tables:
      - tests/fixtures/x15_coherent_6dof_public_research_v1/tables/x15_static_6axis.tbl
      - tests/fixtures/x15_coherent_6dof_public_research_v1/tables/x15_symmetric_stabilator_6axis.tbl
      - tests/fixtures/x15_coherent_6dof_public_research_v1/tables/x15_differential_stabilator_6axis.tbl
      - tests/fixtures/x15_coherent_6dof_public_research_v1/tables/x15_rudder_6axis.tbl
    max_steps: 3000
    convergence:
      window_s: 10.0
      factors: [1.0, 0.5, 0.25]
      channels: [altitude_m, speed_m_s]
      tolerances: {altitude_m: 10.0, speed_m_s: 1.0}
    showcase:
      route_frame: local_ned
      waypoints:
        - {id: release, north_m: 0.0, east_m: 0.0, altitude_m: 21500.0, capture_radius_m: 1000.0, objective: release-contract, completion_event: start-contract}
        - {id: energy-corridor, north_m: 20500.0, east_m: 46900.0, altitude_m: 23000.0, capture_radius_m: 5000.0, objective: energy-corridor, completion_event: x15-energy-corridor-captured}
        - {id: terminal, north_m: 20500.0, east_m: 46900.0, altitude_m: 21500.0, capture_radius_m: 5000.0, objective: route-transition, completion_event: x15-terminal-handoff}
      required_objectives: [release-contract, powered-transition, energy-corridor, propnav-transition, terminal-handoff]
      objective_events: [start-contract, powered-transition, x15-energy-corridor-captured, propnav-transition, x15-terminal-handoff]
    objectives:
      - {id: duration, kind: controller_transition, channel: duration_s, target: 35.0, tolerance: 0.01, quality_limit: 0.10, unit: s, source: summary}
      - {id: propnav-transition, kind: guidance, channel: pro_nav_active, target: 1.0, tolerance: 0.01, quality_limit: 1.0, unit: "1", comparison: minimum, source: max_abs}
      - {id: route-transition, kind: route_transition, channel: range_to_target_m, target: 5000.0, tolerance: 1.0, quality_limit: 1000.0, unit: m, comparison: maximum, source: final}
      - {id: alpha-envelope, kind: envelope, channel: aero_alpha_deg, target: 10.0, tolerance: 0.01, quality_limit: 8.0, unit: deg, comparison: maximum, source: max_abs}
      - {id: beta-envelope, kind: envelope, channel: aero_sideslip_deg, target: 10.0, tolerance: 0.01, quality_limit: 8.0, unit: deg, comparison: maximum, source: max_abs}
      - {id: table-margin-reserve, kind: envelope, channel: table_margin_min_normalized, target: 0.10, tolerance: 0.10, quality_limit: 0.10, unit: "1", comparison: minimum, source: summary, severity: advisory}
      - {id: control-saturation-fraction, kind: actuator, channel: control_saturation_fraction, target: 0.0, tolerance: 0.01, quality_limit: 0.10, unit: "1", comparison: maximum, source: summary, severity: advisory}
      - {id: control-rate-average, kind: actuator, channel: control_derivative_abs_average, target: 20.0, tolerance: 20.0, quality_limit: 20.0, unit: deg/s, comparison: maximum, source: summary, severity: advisory}
      - {id: control-rate-maximum, kind: actuator, channel: control_derivative_abs_max, target: 100.0, tolerance: 100.0, quality_limit: 100.0, unit: deg/s, comparison: maximum, source: summary, severity: advisory}
