id: b747-racetrack-altitude-turns-3dof-v1
family: b747
display_name: B747 transport-scaled racetrack climb, level, turn, descent, and start/finish
  gate
evidence_level: nominal_case_pass_overall_qualification_pending
claim: The B747 public-research point-mass reduction resolves the same powered fixed-wing
  racetrack mission contract as the X8 at transport scale, with longer legs, larger
  turns, slower vertical changes, and independent truth-based altitude, speed, route,
  and terminal gates.
nonclaims:
- rigid-body attitude or bank dynamics
- physical elevator, aileron, or rudder allocation
- source-validated transport flight-control law
- fuel depletion or certified JT9D performance
- takeoff, landing, wind robustness, or manufacturer fidelity
realization:
  force_source: source_table
  moment_source: not_applicable_point_mass_3dof
  actuator_realization: kinematic_route_command_no_surface_claim
  propulsion_model: source_table_thrust
  resource_model: fixed_mass_zero_propellant
  note: This is the first scaled realization of the shared powered-fixed-wing template.
    The point-mass adapter commands speed, heading, and flight-path angle from the
    racetrack tangent and bounded position/ altitude corrections; it does not create
    attitude or surface telemetry.
problem: examples/mission_families/slower_b747/SV01_racetrack_altitude_turns_3dof.prb
racetrack_binding: b747-transport-scaled
tables:
- tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/b747_nominal_static_6axis.tbl
- tests/fixtures/slower_airbreathing_and_multirotor_6dof_bundle_v1/tables/b747_jt9d_thrust.tbl
max_steps: 12000
envelope:
- channel: speed_m_s
  minimum: 100.0
  maximum: 220.0
- channel: altitude_m
  minimum: 50.0
  maximum: 350.0
terminal:
