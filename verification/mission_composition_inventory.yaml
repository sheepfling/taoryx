schema: taoryx.mission-composition-inventory/v1
version: 1
description: >-
  Authoritative disposition of vehicle, realization, component, generated-child,
  and contract-fixture assets that can otherwise look like Mission Composition
  models. Catalog membership is not execution availability; every published
  operation remains fail-closed against the common executor registry.
