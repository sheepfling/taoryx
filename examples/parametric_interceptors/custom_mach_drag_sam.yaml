# Copy-ready Mach-dependent aerodynamic surrogate.
# The coefficients below are developer assumptions, not a real interceptor deck.
interceptor_id: custom-mach-drag-sam
parameter_set_version: 0.1.0
surrogate_archetype_id: generic_slender_sam_v1

launch_mass_kg: 350.0
length_m: 5.0
body_diameter_m: 0.35
propellant_fraction: 0.45
propulsion_architecture: single_stage_solid
burn_time_class: medium
thrust_profile_class: boost_sustain
maneuverability_class: moderate
control_bandwidth_class: nominal
guidance_family: command
guidance_archetype: waypoint_pursuit

# A detailed schedule replaces both aero_archetype and drag_class. Points must
# be strictly increasing in Mach. Runtime interpolation is linear and values
# outside the table domain hold the nearest endpoint.
drag_coefficient_schedule:
  schedule_id: custom-mach-drag-sam-v1
  origin: simulation_assumption
  confidence: low
  method: Developer-authored generic transonic/supersonic drag shape.
  points:
    - {mach: 0.0, coefficient: 0.30}
    - {mach: 0.8, coefficient: 0.33}
    - {mach: 1.0, coefficient: 0.49}
    - {mach: 1.2, coefficient: 0.43}
    - {mach: 2.0, coefficient: 0.36}
    - {mach: 4.0, coefficient: 0.32}
    - {mach: 6.0, coefficient: 0.30}

model_notes: >-
  Developer example for the structured Mach-drag authoring route. Replace the
  schedule and its provenance before using it as a source-backed model.
