# Edit the targets and scenario basis before using this as evidence.
campaign_id: generic-medium-sam-fit-v1
assumption_case: nominal
optimizer_backend: builtin-rqp
max_iterations: 60
tolerance: 1.0e-6
derivative_step: 1.0e-3
acceptance_normalized_error: 1.0

variables:
  - parameter_id: thrust_scale
    lower_bound: 0.5
    upper_bound: 1.5
    initial_value: 1.0
  - parameter_id: drag_scale
    lower_bound: 0.5
    upper_bound: 1.5
    initial_value: 1.0

scenarios:
  - scenario_id: generic-medium-sam-speed-fit
    fidelity: point_mass_3dof
    scenario_basis: >-
      Prototype fixed-waypoint speed screen. Replace this statement with the
      source definition and launch-condition normalization used by the target.
    mission:
      launch_altitude_m: 0.0
      launch_speed_mps: 20.0
      launch_flight_path_deg: 45.0
      waypoint_north_m: 20000.0
      waypoint_altitude_m: 5000.0
      duration_s: 20.0
      time_step_s: 0.05
    targets:
      - metric_id: peak_speed_mps
        target: 1200.0
        tolerance: 240.0
        unit: m/s
        severity: advisory
        source_parameter_id: reported_max_speed_mps
        source_origin: simulation_assumption
        source_basis: >-
          Developer example value; replace with a scenario-qualified source.

  - scenario_id: generic-medium-sam-altitude-fit
    fidelity: point_mass_3dof
    scenario_basis: >-
      Prototype lofted altitude screen. Replace this statement with the source
      ceiling definition and launch-condition normalization used by the target.
    mission:
      launch_altitude_m: 0.0
      launch_speed_mps: 20.0
      launch_flight_path_deg: 65.0
      waypoint_north_m: 30000.0
      waypoint_altitude_m: 24000.0
      duration_s: 30.0
      time_step_s: 0.05
    targets:
      - metric_id: maximum_altitude_m
        target: 24000.0
        tolerance: 4800.0
        unit: m
        severity: advisory
        source_parameter_id: reported_max_altitude_m
        source_origin: simulation_assumption
        source_basis: >-
          Developer example value; replace with a scenario-qualified source.

claim_boundary: >-
  This example fits only simulation scale factors to developer-declared
  targets. It is not a source-backed calibration or weapon-performance claim.
