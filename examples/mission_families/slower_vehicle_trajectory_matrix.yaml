id: slower_vehicle_trajectory_matrix_v1
title: Paired slower-vehicle 3-DOF and native 6-DOF trajectory examples
claim_boundary:
  historical_taos_96_compatibility: false
  flight_qualification: false
  source_data: public_research_surrogates
cases:
  - id: SV01
    vehicle: b747
    directory: slower_b747
    problem_3dof: SV01_3dof.prb
    problem_6dof: SV01_6dof.prb
    tables_6dof: [b747_nominal_static_6axis.tbl, b747_jt9d_thrust.tbl]
    max_steps: 200
    integrator: euler
    invariant: coefficient_aero_active
    tolerances: {time_s: 1.0e-12, quaternion_norm: 1.0e-9}
  - id: SV03
    vehicle: skywalker_x8
    directory: slower_x8
    problem_3dof: SV03_3dof.prb
    problem_6dof: SV03_6dof.prb
    tables_6dof: [skywalker_x8_static_6axis.tbl, skywalker_x8_thrust.tbl]
    max_steps: 200
    integrator: euler
    invariant: coefficient_aero_active
    tolerances: {time_s: 1.0e-12, quaternion_norm: 1.0e-9}
  - id: SV05
    vehicle: hummingbird
    directory: slower_hummingbird
    problem_3dof: SV05_3dof.prb
    problem_6dof: SV05_6dof.prb
    tables_6dof: [hummingbird_cx.tbl, hummingbird_cy.tbl, hummingbird_cz.tbl, hummingbird_cmx.tbl, hummingbird_cmy.tbl, hummingbird_cmz.tbl, hummingbird_rotor_static.tbl]
    max_steps: 200
    integrator: euler
    invariant: direct_wrench_aero_active
    tolerances: {time_s: 1.0e-12, quaternion_norm: 1.0e-9}
