schema: taoryx.vehicle-compose-request/v1alpha1
id: hl20-glide-energy-capability-3dof-v1
vehicle: hl20_mod_k
fidelity: point_mass_3dof
initialization:
  id: high_altitude_release
  inputs:
    altitude_m: {value: 80000.0, unit: m}
    mach: {value: 5.0, unit: dimensionless}
    heading_deg: {value: 90.0, unit: deg}
    mass_kg: {value: 8664.1, unit: kg}
mission:
  id: lifting_body_glide_energy_management_v1
segments:
  - id: trim_capture
    inputs:
      duration_s: {value: 30.0, unit: s}
  - id: glide_bank_reversal
    instance_id: right-bank-crossrange
    inputs:
      bank_command_deg: {value: 30.0, unit: deg}
      target_crossrange_m: {value: 100000.0, unit: m}
  - id: glide_bank_reversal
    instance_id: left-bank-crossrange
    inputs:
      bank_command_deg: {value: -30.0, unit: deg}
      target_crossrange_m: {value: -100000.0, unit: m}
  - id: energy_handoff
    inputs:
      target_altitude_m: {value: 25000.0, unit: m}
      target_energy: {value: 1300000.0, unit: J/kg}
      target_heading_deg: {value: 90.0, unit: deg}
