schema: taoryx.vehicle-compose-request/v1alpha1
id: hummingbird-hover-yaw-sensor-episode-pseudo6dof-semantic-v1
vehicle: hummingbird
fidelity: pseudo_6dof
initialization:
  id: airborne_hover
  inputs:
    north_m: {value: 0.0, unit: m}
    east_m: {value: 0.0, unit: m}
    altitude_m: {value: 2.0, unit: m}
    heading_deg: {value: 0.0, unit: deg}
mission:
  id: multirotor_pad_box_yaw_recovery_land_v1
observation:
  profile_id: declared_sensor
  declared_sensor:
    profile_id: declared_sensor
    channel_ids:
      - execution.time
      - position.north
      - position.east
      - position.altitude
      - attitude.euler
      - body_rate
      - resources.battery.fraction_remaining
    cadence_s: 0.04
    latency_s: 0.02
segments:
  - id: rotor_spool_takeoff
    inputs:
      target_altitude_m: {value: 2.0, unit: m}
      climb_rate_m_s: {value: 0.5, unit: m/s}
  - id: hover_dwell
    inputs:
      target_ned_m: {value: [0.0, 0.0, -2.0], unit: m}
      dwell_s: {value: 1.0, unit: s}
      target_heading_deg: {value: 0.0, unit: deg}
  - id: waypoint_translation
    instance_id: forward-translation
    inputs:
      target_ned_m: {value: [4.0, 0.0, -2.0], unit: m}
      maximum_speed_m_s: {value: 2.0, unit: m/s}
      dwell_s: {value: 1.0, unit: s}
  - id: yaw_scan
    inputs:
      target_heading_deg: {value: 90.0, unit: deg}
      yaw_rate_limit_deg_s: {value: 45.0, unit: deg/s}
  - id: waypoint_translation
    instance_id: lateral-return
    inputs:
      target_ned_m: {value: [0.0, 0.0, -2.0], unit: m}
      maximum_speed_m_s: {value: 2.0, unit: m/s}
      dwell_s: {value: 1.0, unit: s}
  - id: hover_dwell
    inputs:
      target_ned_m: {value: [0.0, 0.0, -2.0], unit: m}
      dwell_s: {value: 1.0, unit: s}
      target_heading_deg: {value: 90.0, unit: deg}
  - id: touchdown_settle_disarm
    inputs:
      pad_ned_m: {value: [0.0, 0.0, 0.0], unit: m}
      maximum_sink_rate_m_s: {value: 0.5, unit: m/s}
      settle_s: {value: 1.0, unit: s}
