    initial_line: "*initial geodetic alt=0.0 long=14.4425 lat=35.8766 vel=10.0 gama=0.0 psi=90.0 time=0.0 mass=100.0"
    file_line: "*file cbcr.dat time alt vel gamgd alpha bankgd thrust"
    segments:
