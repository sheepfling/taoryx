schema_version: 1
source_bundle: ../../simple_aero_v1
translation_style: synthetic_taos_problem_files
problems:
  - path: ballistic.prb
    problem_name: simple_aero-ballistic
    title: Simple Aero translation ballistic
    source_bundle: ../../simple_aero_v1/ballistic.yaml
    comments:
      - "Synthetic TAOS translation of INBOX/simple_aero-snippet-v1/simple_aero/ballistic.yaml"
      - "Simple Aero family: ballistic"
      - "Start controls: launch_point, aimpoint, initial_altitude_m, initial_speed_mps"
      - "Stop controls: coast_time_s, optimization termination"
    atmosphere: standard
    earth: wgs-84 omega=0
    trajectory_line: "*trajectory 1 vehicle start on 1"
    initial_line: "*initial geodetic alt=0.0 long=14.4425 lat=35.8766 vel=10.0 gama=0.0 psi=90.0 time=0.0 mass=350.0"
    file_line: "*file ballistic.dat time alt vel gamgd alpha thrust"
    segments:
      - number: 1
        title: ballistic
        phase: boost
        body:
          - "*integ dtprnt=0.1 dt=0.1"
          - "*aero ca=0.0 cn=0.0"
          - "*prop thrust=609406.359 mdot=226.796"
          - "*when time=60.0 stop"
