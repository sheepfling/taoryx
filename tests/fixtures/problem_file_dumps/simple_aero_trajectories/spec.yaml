  - path: propnav.prb
    problem_name: simple_aero-propnav
    title: Simple Aero-like propnav intercept
    source_bundle: ../../taos_e2e_v23/cases/positive/p027_proportional_navigation/input/p027_proportional_navigation.prb
    comments:
      - "Synthetic TAOS trajectory translation of the proportional-navigation e2e case"
      - "Working set: shared launch/target, boost, coast-to-apogee, maneuver, terminal pronav"
    simple_aero_metadata:
      family: ProportionalNavigation
      terminal_handoff_range_km: 20
      notes:
        - "interceptor/target pair"
    atmosphere: none
    earth: spherical gm=0 omega=0
    trajectories:
      - trajectory_line: "*trajectory 1 interceptor start on 1"
        initial_line: *shared_launch_ecfc
        file_line: "*file interceptor.dat time xecfc yecfc relrng[2] relvel[2] yawi pitchi"
        segments:
          - number: 1
            title: boost
            phase: boost
            body:
              - "*integ dtprnt=0.25 dt=0.025 dtguid=3"
              - "*inertial ecfc"
              - "*prop thrust=(interceptor-thrust) mdot=(zero-mdot)"
              - "*when z<0 stop"
              - "*when tseg=5 goto 2"
          - number: 2
            title: coast_to_apogee
            phase: coast
            body:
              - "*integ dtprnt=0.25 dt=0.025"
              - "*inertial ecfc"
              - "*when z<0 stop"
              - "*when tseg=40 goto 3"
          - number: 3
            title: maneuver
            phase: maneuver
            body:
              - "*integ dtprnt=0.25 dt=0.025 dtguid=3"
              - "*inertial ecfc"
              - "*prop thrust=(interceptor-thrust) mdot=(zero-mdot)"
              - "*fly yawi=0.0 pitchi=0.0"
              - "*when z<0 stop"
              - "*when tseg=60 goto 4"
          - number: 4
            title: terminal_pronav
            phase: final_pronav
            body:
              - "*integ dtprnt=0.25 dt=0.025 dtguid=3"
              - "*inertial ecfc"
              - "*prop thrust=(interceptor-thrust) mdot=(zero-mdot)"
              - "# 20 km to go handoff"
              - "*fly propnav=2"
              - "*when relrng[2]<20000 stop"
              - "*when time=20 stop"
              - "*when z<0 stop"
      - trajectory_line: "*trajectory 2 target start on 1"
        initial_line: *shared_target_ecfc
        file_line: "*file target.dat time xecfc yecfc"
        segments:
          - number: 1
            title: coast
            phase: coast
            body:
              - "*integ dtprnt=0.25 dt=0.025"
              - "*when z<0 stop"
              - "*when time=20 stop"
