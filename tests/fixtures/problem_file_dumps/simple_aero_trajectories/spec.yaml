schema_version: 1
source_bundle: ../../simple_aero_v1
translation_style: synthetic_taos_trajectories
shared_launch_geodetic: &shared_launch_geodetic "*initial geodetic alt=0.0 long=14.4425 lat=35.8766 vel=10.0 gama=0.0 psi=90.0 time=0.0 wt=1000.0"
shared_launch_ecfc: &shared_launch_ecfc "*initial ecfc x=20925646.3255 y=0 z=0 xdt=0 ydt=0 zdt=0 time=0 mass=5"
shared_target_ecfc: &shared_target_ecfc "*initial ecfc x=20925646.3255 y=1000 z=0 xdt=0 ydt=10 zdt=0 time=0 mass=1"
shared_boost_body: &shared_boost_body
  - "*integ dtprnt=0.1 dt=0.01"
  - "*prop thrust=(stage1-thrust) mdot=(stage1-mdot)"
  - "*when tseg=5 goto 2"
shared_coast_body: &shared_coast_body
  - "*integ dtprnt=0.5 dt=0.05"
  - "*aero ca=(coast-ca) cn=(coast-cn)"
  - "*when alt<0 stop"
  - "*when tseg=40 goto 3"
shared_pronav_body: &shared_pronav_body
  - "*integ dtprnt=0.5 dt=0.05"
  - "*fly propnav=2"
  - "*when relrng[2]<20000 stop"
  - "*when alt<0 stop"
problems:
  - path: ballistic.prb
    problem_name: simple_aero-ballistic
    title: Simple Aero-like ballistic trajectory
    source_bundle: ../../simple_aero_v1/ballistic.yaml
    comments:
      - "Synthetic TAOS trajectory translation of INBOX/simple_aero-snippet-v1/simple_aero/ballistic.yaml"
      - "Working set: boost, coast-to-apogee, maneuver, terminal propnav"
    simple_aero_metadata:
      family: Ballistic
    atmosphere: standard
    earth: wgs-84 omega=0
    trajectories:
      - trajectory_line: "*trajectory 1 vehicle start on 1"
        initial_line: *shared_launch_geodetic
        file_line: "*file ballistic.dat time alt vel gamgd alpha bankgd thrust"
        segments:
          - number: 1
            title: boost
            phase: boost
            body: *shared_boost_body
          - number: 2
            title: coast_to_apogee
            phase: coast
            body: *shared_coast_body
          - number: 3
            title: maneuver
            phase: maneuver
            body:
              - "*integ dtprnt=0.1 dt=0.1"
              - "*aero ca=(maneuver-ca) cn=(maneuver-cn)"
              - "*fly bankgd=0.0"
              - "*when alt<0 stop"
              - "*when tseg=60 goto 4"
          - number: 4
            title: terminal_pronav
            phase: final_pronav
            body: *shared_pronav_body
  - path: cbcr_left.prb
    problem_name: simple_aero-cbcr-left
    title: Simple Aero-like CBCR left turn
    source_bundle: ../../simple_aero_v1/cbcr.yaml
    comments:
      - "Synthetic TAOS trajectory translation of INBOX/simple_aero-snippet-v1/simple_aero/cbcr.yaml"
      - "Working set: boost, coast-to-apogee, maneuver, terminal propnav"
    simple_aero_metadata:
      family: CBCR
      direction: left
      maneuver_altitude_start_km: 40
      maneuver_duration_s: 35
      min_time_to_go_s: 60
    atmosphere: standard
    earth: wgs-84 omega=0
    trajectories:
      - trajectory_line: "*trajectory 1 vehicle start on 1"
        initial_line: *shared_launch_geodetic
        file_line: "*file cbcr-left.dat time alt vel gamgd alpha bankgd thrust"
        segments:
          - number: 1
            title: boost
            phase: boost
            body: *shared_boost_body
          - number: 2
            title: coast_to_apogee
            phase: coast
            body: *shared_coast_body
          - number: 3
            title: maneuver
            phase: maneuver
            body:
              - "*integ dtprnt=0.1 dt=0.1"
              - "*aero ca=0.0 cn=0.0"
              - "*fly bankgd=15.0"
              - "*when alt<0 stop"
              - "*when tseg=35 goto 4"
          - number: 4
