  - path: propnav.prb
    problem_name: spectre-propnav
    title: Spectre-like propnav intercept
    source_bundle: ../../taos_e2e_v23/cases/positive/p027_proportional_navigation/input/p027_proportional_navigation.prb
    comments:
      - "Synthetic TAOS trajectory translation of the proportional-navigation e2e case"
      - "Working set: a two-trajectory interceptor/target pair"
    atmosphere: none
    earth: spherical gm=0 omega=0
    trajectories:
      - trajectory_line: "*trajectory 1 interceptor start on 1"
        initial_line: "*initial ecfc x=20925646.3255 y=0 z=0 xdt=0 ydt=0 zdt=0 time=0 mass=5"
        file_line: "*file interceptor.dat time xecfc yecfc relrng[2] relvel[2] yawi pitchi"
        segments:
          - number: 1
            title: chase
            phase: final_pronav
            body:
              - "*integ dtprnt=0.25 dt=0.025 dtguid=3"
              - "*inertial ecfc"
              - "*prop thrust=(interceptor-thrust) mdot=(zero-mdot)"
              - "*fly propnav=2"
              - "*when time=20 stop"
      - trajectory_line: "*trajectory 2 target start on 1"
        initial_line: "*initial ecfc x=20925646.3255 y=1000 z=0 xdt=0 ydt=10 zdt=0 time=0 mass=1"
        file_line: "*file target.dat time xecfc yecfc"
        segments:
          - number: 1
            title: coast
            phase: coast
            body:
              - "*integ dtprnt=0.25 dt=0.025"
              - "*when time=20 stop"
