schema_version: 1
source_bundle: ../../spectre_simple_aero_v1
translation_style: synthetic_taos_trajectories
problems:
  - path: ballistic.prb
    problem_name: spectre-ballistic
    title: Spectre-like ballistic trajectory
    source_bundle: ../../spectre_simple_aero_v1/ballistic.yaml
    comments:
      - "Synthetic TAOS trajectory translation of INBOX/spectre-snippet-v1/simple_aero/ballistic.yaml"
      - "Working set: boost followed by passive coast"
    atmosphere: standard
    earth: wgs-84 omega=0
    trajectories:
      - trajectory_line: "*trajectory 1 vehicle start on 1"
        initial_line: "*initial geodetic alt=0.0 long=14.4425 lat=35.8766 vel=10.0 gama=0.0 psi=90.0 time=0.0 wt=1000.0"
        file_line: "*file ballistic.dat time alt vel gamgd alpha bankgd thrust"
        segments:
          - number: 1
            title: boost
            phase: boost
            body:
              - "*integ dtprnt=0.1 dt=0.01"
              - "*prop thrust=(stage1-thrust) mdot=(stage1-mdot)"
              - "*when tseg=5 goto 2"
          - number: 2
            title: coast
            phase: coast
            body:
              - "*integ dtprnt=0.5 dt=0.05"
              - "*aero ca=(coast-ca) cn=(coast-cn)"
              - "*when alt<0 stop"
