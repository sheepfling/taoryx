schema_version: 1
case_id: simple_aero-t4-high-thrust-v1
family: simple_aero
fidelity: point_mass_3dof
variant: light
loadout: high_thrust
mission: short_range
segment_plan: boost_coast
controller: none
overrides:
  vehicle.id: {value: t4-high-thrust-booster}
  mission.initial_altitude: {value: 10000.0, unit: m}
  mission.initial_speed: {value: 60.0, unit: m/s}
  mission.burnout_speed: {value: 300.0, unit: m/s}
  mission.apogee_altitude: {value: 20000.0, unit: m}
  mission.pitch_over_angle: {value: 80.0, unit: deg}
  mission.boost_duration: {value: 5.0, unit: s}
  mission.coast_duration: {value: 10.0, unit: s}
  mission.bank_duration: {value: 5.0, unit: s}
  mission.terminal_duration: {value: 5.0, unit: s}
extensions:
  cutoff_mode: commanded
  launch:
    name: high-thrust-launch
  aim_point:
    name: short-range-aim-point
  overlay:
    control: command.bank
    minimum: -10.0
    maximum: 10.0
  sweeps:
    - id: high-thrust
      overrides: {}
    - id: reduced-thrust
      overrides:
        vehicle.booster.thrust: {value: 100000.0, unit: N}
