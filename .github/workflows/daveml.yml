name: DaveML Release Gate

on:
  push:
    branches: [main, alpha-3-reachability-envelope]
  pull_request:
    paths:
      - "src/taoryx/trajectory/**"
      - "src/taoryx/runtime/cli.py"
      - "tools/*daveml*.py"
      - "tests/unit/test_daveml*.py"
      - "families/**"
      - "verification/**"
      - "docs/plan/daveml-roundtrip.md"
      - ".github/workflows/daveml.yml"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DaveML dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run fresh-process DaveML release gate
        run: python tools/dev.py daveml-release
      - name: Run DaveML regression tests
        run: python -m pytest tests/unit/test_daveml*.py --basetemp build/daveml-ci-pytest -q
      - name: Publish DaveML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daveml-release-evidence
          path: verification/daveml_*.json
