schema: taoryx.vehicle-execution-parity/v1alpha1
version: 1
description: Exact committed-boundary batch/episode parity witnesses. Absence does
  not imply equivalence merely because both execution operations are runnable.
bindings:
- family_id: a320_openap_3dof
  mission: powered_fixed_wing_racetrack_v1
  fidelity: point_mass_3dof
  batch_factory_id: reduced_fixed_wing_openap.v1
  episode_factory_id: reduced_fixed_wing_a320_episode.v1
  adapter_id: taoryx.reduced_fixed_wing.a320_action_trace_batch_episode_parity.v1
