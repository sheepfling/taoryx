schema: taoryx.vehicle-compose-request/v1alpha1
id: b747-racetrack-capability-semantic-v1
vehicle: b747
fidelity: pseudo_6dof
initialization:
  id: airborne_trim
  inputs:
    altitude_m: {value: 100.0, unit: m}
    speed_m_s: {value: 153.0, unit: m/s}
    heading_deg: {value: 90.0, unit: deg}
    mass_kg: {value: 288756.9, unit: kg}
mission:
  id: powered_fixed_wing_racetrack_v1
segments:
  - id: trim_hold
    inputs:
      duration_s: {value: 60.0, unit: s}
  - id: climb_level_gate
    inputs:
      target_altitude_m: {value: 250.0, unit: m}
      climb_rate_m_s: {value: 1.5, unit: m/s}
      gate_center_ned_m: {value: [0.0, 30000.0, -250.0], unit: m}
      corridor_m: {value: 500.0, unit: m}
  - id: fly_by_turn
    instance_id: left-turn
    inputs:
      turn_direction: {value: left}
      turn_radius_m: {value: 8081.255404639615, unit: m}
      bank_limit_deg: {value: 18.0, unit: deg}
      gate_center_ned_m: {value: [16162.51080927923, 30000.0, -250.0], unit: m}
  - id: descent_level_gate
    inputs:
      target_altitude_m: {value: 100.0, unit: m}
      descent_rate_m_s: {value: 1.2, unit: m/s}
      gate_center_ned_m: {value: [16162.51080927923, 0.0, -100.0], unit: m}
  - id: fly_by_turn
    instance_id: right-turn
    inputs:
      turn_direction: {value: right}
      turn_radius_m: {value: 8081.255404639615, unit: m}
      bank_limit_deg: {value: 18.0, unit: deg}
      gate_center_ned_m: {value: [0.0, 0.0, -100.0], unit: m}
  - id: terminal_state_gate
    inputs:
      target_ned_m: {value: [0.0, 0.0, -100.0], unit: m}
      target_altitude_m: {value: 100.0, unit: m}
      target_speed_m_s: {value: 153.0, unit: m/s}
      target_heading_deg: {value: 90.0, unit: deg}
