decision_basis:
  - The source release condition has finite, closed equations but is not a zero-wrench equilibrium.
  - The source problem prescribes a release/glide state and control schedule; it does not declare a static trim solve.
  - The observed sideslip and nonzero moments make an automatic equilibrium claim inappropriate without a separately adjudicated release-state target.
claim_boundary:
  supported: source-prescribed release/glide initialization with equation closure
  unsupported: independently solved X-15 force/moment trim
  unsupported: source historical flight compatibility
next_evidence:
  - adjudicate the intended release alpha, beta, and angular-rate targets from the source data
  - solve only after those targets are declared
  - compare the solved candidate against the source release trajectory, not against zero wrench by assumption
