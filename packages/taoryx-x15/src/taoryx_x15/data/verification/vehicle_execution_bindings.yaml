  operation: batch
  status: runnable
  execution_mode: source_surface_authority_screen
  factory_id: x15_source_surface_authority_screen.v1
  batch_action_trace: emits_committed_interval_trace
  description: Execute the frozen X-15 source-table three-surface, three-axis moment-authority
