schema: taoryx.vehicle-execution-bindings/v1alpha1
version: 1
description: Explicit source-owned execution bindings for compiled vehicle compositions.
  An entry is a public capability declaration, not a generic family fallback. Omitted
  vehicle/fidelity/mission combinations are unavailable until their own native binding
  exists.
bindings:
