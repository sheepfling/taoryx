  description: Step the source-local X-15 direct-wrench bridge through its declared
    bounded total-wrench command.
  claim_boundary: Local direct-wrench bridge episode only; it exposes requested-versus-achieved
    injected wrench, not physical effector allocation or an X-15 flight mission.
- family_id: x15
  mission: x15_local_direct_wrench_lqi_screen_v1
  fidelity: rigid_body_6dof_direct_wrench
  operation: batch
