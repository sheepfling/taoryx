  status: runnable
  execution_mode: local_direct_wrench_screen
  factory_id: x15_local_direct_wrench_screen.v1
  batch_action_trace: emits_committed_interval_trace
  description: Execute the source-local X-15 direct-wrench LQR recovery screen through
    the public composition path.
  claim_boundary: Local direct-wrench recovery screen only; it is neither an X-15
    flight mission nor physical effector allocation.
