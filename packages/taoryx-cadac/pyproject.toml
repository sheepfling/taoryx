[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-cadac"
version = "0.1.0a0"
description = "Source-bound CADAC vehicle catalog and table-conversion plug-in for Taoryx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.8",
  "taoryx>=0.1.0a0,<0.2",
]

[project.entry-points."taoryx.plugins"]
"taoryx.cadac" = "taoryx_cadac.plugin:PLUGIN"

[project.scripts]
taoryx-cadac = "taoryx.families.cadac.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
