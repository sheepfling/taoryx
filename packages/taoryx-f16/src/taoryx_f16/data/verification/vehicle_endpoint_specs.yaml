schema: taoryx.vehicle-endpoint-specs/v1alpha1
version: 1
description: Focused vertical contracts that join a selected vehicle composition to
  its runtime factory, executable witness, capability advertisement, normalized output
  surface, controller campaign, and planning ledger record.
endpoints:
- id: f16-source-node-surface-lqr-schedule-transition
  family_id: f16_s119
  model_id: f16_s119
  mission_id: f16_local_physical_surface_lqr_schedule_transition_screen_v1
  fidelity: rigid_body_6dof_surface_allocated
  execution_mode: closed_loop_controller
  operations:
  - operation: batch
    factory_id: f16_local_physical_surface_lqr_schedule_transition_screen.v1
    witness_id: f16-local-surface-lqr-schedule-transition-screen-batch
  controller_campaign_id: f16-source-surface-schedule-lqr-v1
  required_tuning_operations:
  - state_derivative
  - trim
  - linearize
  required_core_output_ids:
  - velocity.body.x
  - angular_rate.body.x
  - angular_rate.body.y
  - angular_rate.body.z
  required_telemetry_output_ids:
  - mass.total
  - control.wrench.requested.moment.y
  - control.wrench.achieved.moment.y
  - control.wrench.residual.moment.y
  - diagnostics.allocation_residual_norm
  - diagnostics.saturation_count
  - actuator.elevator.actual
  - control.throttle.actual
  robustness_screens:
  - id: f16-schedule-matched-pitch-wrench-offset
    kind: constant_offset
    artifact_filename: robustness_report.json
    execution_readiness: available
    cases:
    - id: nominal
      parameters:
        pitch_wrench_bias_fraction: 0.0
      description: Retain the unmodified source-node schedule transition as the nominal
        reference.
    - id: positive-pitch-offset
      parameters:
        pitch_wrench_bias_fraction: 0.05
      description: Apply a constant positive pitch-wrench bias equal to five percent
        of the declared pitch wrench scale.
    - id: negative-pitch-offset
      parameters:
        pitch_wrench_bias_fraction: -0.05
      description: Apply a constant negative pitch-wrench bias equal to five percent
        of the declared pitch wrench scale.
    metrics:
    - id: maximum_final_normalized_error
      maximum: 0.25
      unit: normalized_error
      description: Worst case terminal normalized error using the existing schedule-transition
        recovery threshold.
    - id: saturation_fraction
      maximum: 0.0
      unit: fraction
      description: Fraction of committed samples with bounded-effector or allocation
        saturation.
    claim_boundary: Executed matched pitch-wrench offset screen for the bounded source-node
      LQR schedule. It replays the nominal and plus/minus five-percent cases through
      the declared source full-inertia external-dynamics seam and reports whether
      this non-integrating controller satisfies the stated local recovery gate under
      each constant offset.
  maturity_record_id: reference_f16_s119
  claim_boundary: Bounded local F-16 source-node LQR schedule-transition evidence
    only; it does not establish navigation, wind or mass robustness, a continuous
    schedule, a full envelope, or flight qualification.
- id: f16-source-node-surface-lqr-schedule-interior
  family_id: f16_s119
  model_id: f16_s119
  mission_id: f16_local_physical_surface_lqr_schedule_interior_screen_v1
  fidelity: rigid_body_6dof_surface_allocated
  execution_mode: closed_loop_controller
  operations:
  - operation: batch
    factory_id: f16_local_physical_surface_lqr_schedule_interior_screen.v1
    witness_id: f16-local-surface-lqr-schedule-interior-screen-batch
  controller_campaign_id: f16-source-surface-schedule-lqr-v1
  required_tuning_operations:
  - state_derivative
  - trim
  - linearize
  required_core_output_ids:
  - velocity.body.x
  - velocity.body.y
  - velocity.body.z
  - angular_rate.body.x
  - angular_rate.body.y
  - angular_rate.body.z
  required_telemetry_output_ids:
  - mass.total
  - control.wrench.requested.force.x
  - control.wrench.requested.moment.y
  - control.wrench.achieved.moment.y
  - control.wrench.residual.moment.y
  - diagnostics.allocation_residual_norm
  - diagnostics.saturation_count
  - actuator.elevator.actual
  - control.throttle.actual
  robustness_requirement:
    disposition: not_applicable
    reason: The held-node source schedule has no declared wind, external-wrench-bias,
      or mass-variation derivative input. It applies four exact LQR candidates through
      bounded allocation during independent local recoveries, not a persistent-disturbance
      or route-level robustness screen.
  robustness_screens: []
  maturity_record_id: reference_f16_s119
  claim_boundary: Four source-retrimmed F-16 LQR candidates are independently selected
    and applied to eight bounded held-node surface/throttle recoveries. This does
    not establish gain interpolation, node-transition control, navigation, wind or
    mass robustness, a full envelope, or qualification.
- id: f16-source-trim-surface-velocity-lqi
  family_id: f16_s119
  model_id: f16_s119
  mission_id: f16_local_physical_surface_lqi_screen_v1
  fidelity: rigid_body_6dof_surface_allocated
  execution_mode: closed_loop_controller
  operations:
  - operation: batch
    factory_id: f16_local_physical_surface_lqi_screen.v1
    witness_id: f16-local-surface-lqi-screen-batch
  controller_campaign_id: f16-source-surface-local-lqi-v1
  required_tuning_operations:
  - state_derivative
  - trim
  - linearize
  required_core_output_ids:
  - velocity.body.x
  - velocity.body.y
  - velocity.body.z
  - angular_rate.body.x
  - angular_rate.body.y
  - angular_rate.body.z
  required_telemetry_output_ids:
  - mass.total
  - control.wrench.requested.force.x
  - control.wrench.requested.moment.y
  - control.wrench.achieved.moment.y
  - control.wrench.residual.moment.y
  - diagnostics.allocation_residual_norm
  - diagnostics.saturation_count
  - actuator.elevator.actual
  - control.throttle.actual
  robustness_requirement:
    disposition: not_applicable
    reason: The fixed source-trim physical LQI screen has no declared wind, external-wrench-bias,
      or mass-variation derivative input. Its five-second nominal recovery exercises
      exact wrench allocation and integrators but is not a persistent-disturbance
      robustness result.
  robustness_screens: []
  maturity_record_id: reference_f16_s119
  claim_boundary: Fixed-altitude F-16 source-trim velocity LQI recovery through the
    declared bounded surface/throttle allocator. It does not establish a gain schedule,
    navigation, wind or mass robustness, a full envelope, or qualification.
