[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-f16"
version = "0.1.0a0"
description = "Source-grounded F-16 S.119 vehicle plug-in for Taoryx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "taoryx>=0.1.0a0,<0.2",
  "taoryx-daveml>=0.1.0a0,<0.2",
]

[project.entry-points."taoryx.plugins"]
"taoryx.f16" = "taoryx_f16.plugin:PLUGIN"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
taoryx_f16 = ["data/**/*", "data/**/**/*", "data/**/**/**/*", "data/**/**/**/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
