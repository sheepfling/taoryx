schema: taoryx.horizontal-fidelity-registry/v1alpha1
version: 1
description: The horizontal integration manifest for the current Alpha 3 family catalog.
  Profile IDs are resolved against verification/pseudo6dof_profiles.yaml; this file
  owns the physical-family overlay, adapter seam, and four-tier declaration.
families:
- family_id: hl20_mod_k
  physical_family: lifting_body
  strategy_id: lifting_body_glide.v1
  mission_overlay: glide_energy_management
  adapter_id: taoryx.lifting_body.daveml.v1
  automatic_lowering: true
  source_manifest: families/reference_hl20_mod_k/family.yaml
  source_family_id: reference_hl20_mod_k
  tiers:
    point_mass_3dof:
      profile_id: hl20_mod_k.point_mass_3dof.v1
      promotion_status: development
      blockers:
      - glide_energy_management_mission
    pseudo_6dof:
      profile_id: hl20.attitude_response_p6dof.v1
      promotion_status: development
      blockers:
      - bank_reversal_alpha_limit_energy_coupling
    rigid_body_6dof_direct_wrench:
      profile_id: hl20.direct_wrench_6dof.v1
      promotion_status: development
      required_operations:
      - state_derivative
      - trim_fragment
      blockers:
      - source_trim_acceptance
    rigid_body_6dof_surface_allocated:
      profile_id: hl20.surface_allocated_6dof.v1
      promotion_status: development
      required_operations:
      - state_derivative
      - trim_fragment
      - effectiveness
      - allocate
      blockers:
      - full_state_trim
      - closed_loop_glide_qualification
