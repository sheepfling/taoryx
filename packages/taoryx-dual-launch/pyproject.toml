[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-dual-launch"
version = "0.1.0a0"
description = "Dual-launch glider Mission Composition workflow for Taoryx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["taoryx>=0.1.0a0,<0.2"]

[project.entry-points."taoryx.plugins"]
"taoryx.dual-launch" = "taoryx_dual_launch.plugin:PLUGIN"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
taoryx_dual_launch = ["data/**/*", "data/**/**/*", "data/**/**/**/*", "data/**/**/**/**/*"]
