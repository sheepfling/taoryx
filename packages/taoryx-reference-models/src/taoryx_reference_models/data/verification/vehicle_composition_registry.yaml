        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: altitude_m, canonical_unit: m, required: true, description: Release altitude.}, {id: mach, canonical_unit: dimensionless, required: true, description: Release Mach.}, {id: heading_deg, canonical_unit: deg, required: true, description: Release heading.}, {id: mass_kg, canonical_unit: kg, required: false, description: Initial mass.}]
    segment_contracts:
      - id: local_wrench_recovery_screen
        status: runnable
        description: Bounded local six-axis direct-wrench LQR recovery at the pinned source-load operating point; it is not a navigation segment.
