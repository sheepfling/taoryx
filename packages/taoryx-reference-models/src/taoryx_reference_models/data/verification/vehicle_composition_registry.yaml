        parameters: [{id: target_altitude_m, canonical_unit: m, required: true, description: Hover target altitude.}, {id: climb_rate_m_s, canonical_unit: m/s, required: true, description: Vertical rate limit.}]
        required_control_intents: [altitude]
      - id: hover_dwell
        status: runnable
        description: Position, velocity, and yaw constrained hover dwell.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_ned_m, canonical_unit: m, required: true, description: Hover target position.}, {id: dwell_s, canonical_unit: s, required: true, description: Required settled dwell.}, {id: target_heading_deg, canonical_unit: deg, required: false, description: Optional yaw target.}]
        required_control_intents: [position, altitude, yaw]
      - id: waypoint_translation
        status: development
        description: Forward, lateral, or rearward position transfer with a capture dwell.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_ned_m, canonical_unit: m, required: true, description: Waypoint position.}, {id: maximum_speed_m_s, canonical_unit: m/s, required: true, description: Translational speed limit.}, {id: dwell_s, canonical_unit: s, required: true, description: Capture dwell.}]
        required_control_intents: [position, altitude, yaw]
      - id: yaw_scan
        status: development
        description: Independent yaw maneuver while holding a declared hover region.
        compatible_fidelities: [pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_heading_deg, canonical_unit: deg, required: true, description: Target yaw.}, {id: yaw_rate_limit_deg_s, canonical_unit: deg/s, required: true, description: Yaw rate limit.}]
        required_control_intents: [yaw]
      - id: touchdown_settle_disarm
        status: development
        description: Controlled descent, contact, settled hold, and motor shutdown.
        compatible_fidelities: [pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: pad_ned_m, canonical_unit: m, required: true, description: Landing pad position.}, {id: maximum_sink_rate_m_s, canonical_unit: m/s, required: true, description: Touchdown vertical speed limit.}, {id: settle_s, canonical_unit: s, required: true, description: Required post-contact hold.}]
        required_control_intents: [position, altitude, yaw]
        permitted_transition_events: [contact, motor_shutdown]
    mission_templates:
      - id: hummingbird_local_individual_rotor_lqi_screen_v1
        status: runnable
        description: Source-hover four-rotor LQI and allocation screen; not a translation, landing, or envelope-qualified mission.
        mission_capability_adapter_id: taoryx.hummingbird.local_individual_rotor_lqi_screen.capability.v1
        mission_capability_fidelities: [rigid_body_6dof_surface_allocated]
