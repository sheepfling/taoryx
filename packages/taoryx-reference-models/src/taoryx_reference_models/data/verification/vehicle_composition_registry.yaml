        mission_capability_adapter_id: taoryx.hl20_source_surface_attitude_rate_lqi_screen.capability.v1
        mission_capability_fidelities: [rigid_body_6dof_surface_allocated]
        semantic_translator_id: taoryx.hl20_source_surface_attitude_rate_lqi_screen.capability.v1
        semantic_translator_fidelities: [rigid_body_6dof_surface_allocated]
        initialization_contracts: [source_mach1_pitch_trim_anchor]
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        segment_sequence: [source_surface_attitude_rate_lqi_recovery_screen]
      - id: hl20_local_direct_wrench_screen_v1
        status: runnable
        description: Local source-load direct-wrench recovery screen at a bounded subsonic source condition; it is not the high-energy glide mission.
        mission_capability_adapter_id: taoryx.hl20_local_direct_wrench_screen.capability.v1
        mission_capability_fidelities: [rigid_body_6dof_direct_wrench]
        semantic_translator_id: taoryx.hl20_local_direct_wrench_screen.capability.v1
        semantic_translator_fidelities: [rigid_body_6dof_direct_wrench]
        initialization_contracts: [source_subsonic_local_point]
        compatible_fidelities: [rigid_body_6dof_direct_wrench]
        segment_sequence: [local_wrench_recovery_screen]
      - id: hl20_local_direct_wrench_lqi_screen_v1
        status: runnable
        description: Local subsonic source-load direct-wrench body-speed LQI recovery screen with source-derived candidate gain, bounded wrench projection, and integral-error telemetry.
        mission_capability_adapter_id: taoryx.hl20_local_direct_wrench_lqi_screen.capability.v1
        mission_capability_fidelities: [rigid_body_6dof_direct_wrench]
        semantic_translator_id: taoryx.hl20_local_direct_wrench_lqi_screen.capability.v1
        semantic_translator_fidelities: [rigid_body_6dof_direct_wrench]
        initialization_contracts: [source_subsonic_local_point]
