      - id: individual_rotor_horizontal_translation_lqi_screen
        status: runnable
        description: Bounded source-local horizontal forward, yaw, lateral, rearward, and return LQI screen through quad-X rotor allocation; it excludes altitude and landing.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        required_control_intents: [position, yaw, wrench]
      - id: individual_rotor_vertical_translation_lqi_screen
        status: runnable
        description: Bounded source-local climb, hover, descent, and return LQI screen through collective body-z force, attitude moments, and quad-X rotor allocation; it excludes wind, contact, and landing.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        required_control_intents: [altitude, wrench]
      - id: local_wrench_recovery_screen
        status: runnable
        description: Pinned source-hover six-axis direct-wrench recovery comparator; it bypasses rotor allocation.
        compatible_fidelities: [rigid_body_6dof_direct_wrench]
        required_control_intents: [wrench]
      - id: rotor_spool_takeoff
