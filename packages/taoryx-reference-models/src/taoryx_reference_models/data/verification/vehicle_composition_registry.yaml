        required_control_intents: [wrench]
      - id: local_physical_surface_lqi_screen
        status: runnable
        description: Five-second fixed-altitude source-trim body-velocity LQI recovery through bounded allocated elevator, aileron, rudder, and throttle coordinates.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        required_control_intents: [wrench]
      - id: local_physical_surface_lqr_schedule_interior_screen
        status: runnable
        description: Four-node source-retrimmed F-16 physical LQR schedule-interior campaign with two retained body-w recovery cases at each held node.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        required_control_intents: [wrench]
      - id: local_physical_surface_lqi_schedule_interior_screen
        status: runnable
