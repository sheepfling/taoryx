        status: runnable
        description: Four retained time-marching F-16 physical LQR altitude-coordinate transitions with explicit source endpoint derivative/effectiveness blending and bounded surface/throttle allocation.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        required_control_intents: [wrench]
      - id: trim_hold
        status: development
        description: Stabilize at a declared source-domain operating point.
