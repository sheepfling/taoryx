  - family_id: x15
    initialization_contracts:
      - id: air_launch_release
        status: development
        description: Carrier release state with explicit separation, mass, energy, and flight-condition inputs.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: altitude_m, canonical_unit: m, required: true, description: Release altitude.}, {id: speed_m_s, canonical_unit: m/s, required: true, description: Release speed.}, {id: heading_deg, canonical_unit: deg, required: true, description: Release heading.}, {id: mass_kg, canonical_unit: kg, required: false, description: Release mass.}]
      - id: source_release_glide_local_point
        status: runnable
        description: Pinned X-15 source-load local release/glide operating point used only by the direct-wrench recovery screen.
        compatible_fidelities: [rigid_body_6dof_direct_wrench]
      - id: source_release_glide_surface_authority_anchor
        status: runnable
        description: Frozen X-15 source release/glide fixture used only by the three-surface source-table authority allocation screen.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
      - id: staged_booster_launch
        status: runnable
        description: Local-frame, X-15-scaled booster stack state pinned to the retained rocket-to-Hawaii source staging values; it is not the synthetic California-to-Hawaii vehicle.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters:
          - {id: initial_mass_kg, canonical_unit: kg, required: true, description: Source-pinned stacked launch mass.}
          - {id: initial_speed_m_s, canonical_unit: m/s, required: true, description: Magnitude of the retained source ECIC launch velocity.}
          - {id: initial_altitude_m, canonical_unit: m, required: true, description: Local reduced-model launch altitude.}
          - {id: launch_azimuth_deg, canonical_unit: deg, required: true, description: Declared local-frame reduced-model launch azimuth.}
          - {id: launch_elevation_deg, canonical_unit: deg, required: true, description: Declared local-frame reduced-model launch elevation.}
          - {id: glide_bank_deg, canonical_unit: deg, required: true, description: Declared open-loop glide-bank witness command.}
    segment_contracts:
      - id: separation
        status: development
        description: Carrier separation and clearance event.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: clearance_time_s, canonical_unit: s, required: true, description: Required separation clearance duration.}]
        required_control_intents: [attitude_rate]
        permitted_transition_events: [release]
      - id: local_wrench_recovery_screen
        status: runnable
        description: Bounded local six-axis direct-wrench LQR recovery at the pinned source-load operating point; it is not a navigation segment.
        compatible_fidelities: [rigid_body_6dof_direct_wrench]
        required_control_intents: [wrench]
      - id: local_wrench_lqi_recovery_screen
        status: runnable
        description: Bounded local six-axis direct-wrench body-speed LQI recovery at the pinned source-load operating point; it is not a physical-effector or navigation segment.
        compatible_fidelities: [rigid_body_6dof_direct_wrench]
        required_control_intents: [wrench]
      - id: source_surface_three_axis_authority_allocation_screen
        status: runnable
        description: Frozen X-15 source-table three-axis moment allocation through the symmetric stabilator, differential stabilator, and rudder; it does not propagate a flight state.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        required_control_intents: [wrench]
      - id: source_surface_attitude_rate_lqi_recovery_screen
        status: runnable
        description: Frozen-translation X-15 local attitude-error/body-rate LQI recovery through bounded symmetric stabilator, differential stabilator, and rudder allocation; it is not a full vehicle trim or flight segment.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        required_control_intents: [attitude_rate, wrench]
      - id: powered_climb
        status: development
        description: Bounded rocket-powered acceleration and climb.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_altitude_m, canonical_unit: m, required: true, description: Climb target altitude.}, {id: cutoff_condition, canonical_unit: null, required: true, description: Explicit engine cutoff or burnout condition.}]
        required_control_intents: [throttle, flight_path, bank]
      - id: coast_apogee
        status: development
        description: Ballistic coast through apogee with a declared energy corridor.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_energy, canonical_unit: J/kg, required: true, description: Energy corridor target.}]
        required_control_intents: [bank]
      - id: atmospheric_handoff
        status: development
        description: Re-entry/descent energy management to a named airborne handoff corridor.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_altitude_m, canonical_unit: m, required: true, description: Handoff altitude.}, {id: target_speed_m_s, canonical_unit: m/s, required: true, description: Handoff speed.}, {id: target_heading_deg, canonical_unit: deg, required: true, description: Handoff heading.}]
        required_control_intents: [bank, flight_path]
      - id: booster_powered
        status: runnable
        description: Source-pinned open-loop attached-booster burn ending at the retained cutoff time.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: cutoff_time_s, canonical_unit: s, required: true, description: Booster cutoff time from the retained source mission.}]
        permitted_transition_events: [booster_cutoff]
      - id: booster_coast_release
        status: runnable
        description: Source-pinned coast interval followed by passive spent-booster deployment at the retained release time.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: release_time_s, canonical_unit: s, required: true, description: Booster release time from the retained source mission.}]
        permitted_transition_events: [booster_release]
      - id: unpowered_glide_handoff
        status: runnable
        description: Open-loop reduced glide with independent high-energy and atmospheric-handoff corridor evidence.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: horizon_s, canonical_unit: s, required: true, description: Fixed simulation horizon long enough to include the retained impact witness.}]
        permitted_transition_events: [atmospheric_handoff]
      - id: impact_witness
        status: runnable
        description: Passive terminal impact witness after the open-loop atmospheric handoff; it is not a guided target intercept.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: terminal_kind, canonical_unit: null, required: true, description: Required terminal witness kind.}]
        permitted_transition_events: [ground_contact]
    mission_templates:
      - id: x15_source_surface_authority_screen_v1
        status: runnable
        description: Nonlinear X-15 source-table three-surface, three-axis moment-authority allocation screen at the frozen release/glide fixture; it is neither full vehicle trim nor a flight mission.
        mission_capability_adapter_id: taoryx.x15_source_surface_authority_screen.capability.v1
        mission_capability_fidelities: [rigid_body_6dof_surface_allocated]
        semantic_translator_id: taoryx.x15_source_surface_authority_screen.capability.v1
        semantic_translator_fidelities: [rigid_body_6dof_surface_allocated]
        initialization_contracts: [source_release_glide_surface_authority_anchor]
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        segment_sequence: [source_surface_three_axis_authority_allocation_screen]
      - id: x15_source_surface_attitude_rate_lqi_screen_v1
        status: runnable
        description: Nonlinear X-15 source-table local attitude-error/body-rate LQI recovery at the frozen release/glide fixture, with requested body moments allocated to all three named source surfaces; it is not full-state trim or a high-energy mission.
        mission_capability_adapter_id: taoryx.x15_source_surface_attitude_rate_lqi_screen.capability.v1
        mission_capability_fidelities: [rigid_body_6dof_surface_allocated]
        semantic_translator_id: taoryx.x15_source_surface_attitude_rate_lqi_screen.capability.v1
        semantic_translator_fidelities: [rigid_body_6dof_surface_allocated]
        initialization_contracts: [source_release_glide_surface_authority_anchor]
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        segment_sequence: [source_surface_attitude_rate_lqi_recovery_screen]
      - id: x15_local_direct_wrench_screen_v1
        status: runnable
        description: Local source-load direct-wrench recovery screen with source-derived linearization and requested-versus-achieved wrench evidence.
        mission_capability_adapter_id: taoryx.x15_local_direct_wrench_screen.capability.v1
        mission_capability_fidelities: [rigid_body_6dof_direct_wrench]
        semantic_translator_id: taoryx.x15_local_direct_wrench_screen.capability.v1
        semantic_translator_fidelities: [rigid_body_6dof_direct_wrench]
        initialization_contracts: [source_release_glide_local_point]
        compatible_fidelities: [rigid_body_6dof_direct_wrench]
        segment_sequence: [local_wrench_recovery_screen]
      - id: x15_local_direct_wrench_lqi_screen_v1
        status: runnable
        description: Local source-load direct-wrench body-speed LQI recovery screen with source-derived candidate gain, bounded wrench projection, and integral-error telemetry.
        mission_capability_adapter_id: taoryx.x15_local_direct_wrench_lqi_screen.capability.v1
        mission_capability_fidelities: [rigid_body_6dof_direct_wrench]
        semantic_translator_id: taoryx.x15_local_direct_wrench_lqi_screen.capability.v1
        semantic_translator_fidelities: [rigid_body_6dof_direct_wrench]
        initialization_contracts: [source_release_glide_local_point]
        compatible_fidelities: [rigid_body_6dof_direct_wrench]
        segment_sequence: [local_wrench_lqi_recovery_screen]
      - id: rocket_aircraft_high_energy_v1
        status: development
        description: Release, separation, burn, cutoff, coast/apogee, atmospheric energy management, and terminal handoff.
        initialization_contracts: [air_launch_release]
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        segment_sequence: [separation, powered_climb, coast_apogee, atmospheric_handoff]
      - id: x15_staged_booster_reachability_v1
        status: runnable
        description: Source-pinned booster burn and release followed by an X-15-scaled local reduced glide, open-loop atmospheric handoff witness, and passive impact witness.
        mission_capability_adapter_id: taoryx.x15_staged_reachability.capability.v1
        mission_capability_fidelities: [point_mass_3dof, pseudo_6dof]
        semantic_translator_id: taoryx.x15_staged_reachability.capability.v1
        semantic_translator_fidelities: [point_mass_3dof, pseudo_6dof]
        initialization_contracts: [staged_booster_launch]
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        segment_sequence: [booster_powered, booster_coast_release, unpowered_glide_handoff, impact_witness]
        qualification_missions: [x15-scaled-staged-reachability-v1]

  - family_id: hummingbird
    variant_parameters:
      - id: grounded_operating_mass_kg
        canonical_unit: kg
        target_initialization_id: grounded_idle
        target_parameter_id: mass_kg
        status: runnable
        compatible_fidelities: [pseudo_6dof]
        runtime_adapter_id: taoryx.multirotor.aggregate_thrust_pseudo6dof.v1
        runtime_input_path: HummingbirdPseudo6DOFModel.mass_kg
        hard_lower: 0.000001
        hard_upper: 5.1112
        value_space_profile: positive_half_line
        transform: log
        requires_requalification: true
        coupling_group: aggregate_thrust_hover_mass
        derived_status_channels: [resources.mass.total]
        status_derivation_relation: equal_to_target
        resource_derivation: not_represented
        derivation_claim_boundary: >-
          The aggregate-thrust pseudo-6DOF runtime consumes mass and exposes total mass status.
          It does not derive battery energy, rotor inertia, payload distribution, or individual-rotor resources.
        derivation: Aggregate-thrust pseudo-6DOF model mass and total-mass status update only.
        invalidations: [requalification:mass_kg]
        provenance: >-
          Pseudo-6DOF aggregate-thrust fixture: positive model mass and a 50.13 N
          maximum collective-thrust capacity, converted to the greatest mass with
          positive stationary-hover reserve under standard gravity.
        description: >-
          Grounded mass forwarded to the aggregate-thrust pseudo-6DOF batch and
          episode plants. It is a hard-valid surrogate parameter, not a qualified
          payload, inertia, rotor-allocation, or battery-endurance envelope.
    initialization_contracts:
      - id: source_individual_rotor_hover_local_point
