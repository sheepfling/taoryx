        compatible_fidelities: [rigid_body_6dof_direct_wrench]
      - id: source_mach1_pitch_trim_anchor
        status: runnable
        description: Pinned Mach-1, alpha-6.457652069-degree DAVE-ML scalar pitch-coefficient trim anchor used only by the frozen source-surface pitch-authority screen; it is not a full-state equilibrium.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
      - id: source_booster_launch
        status: development
        description: Exact synthetic-booster launch state accepted by the retained source-aerodynamic HL-20 release witness.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: initial_speed_m_s, canonical_unit: m/s, required: true, description: Pinned source-witness initial speed.}, {id: initial_mass_kg, canonical_unit: kg, required: true, description: Pinned HL-20 plus synthetic-booster mass.}, {id: launch_azimuth_deg, canonical_unit: deg, required: true, description: Pinned launch azimuth.}, {id: launch_elevation_deg, canonical_unit: deg, required: true, description: Pinned launch elevation.}]
