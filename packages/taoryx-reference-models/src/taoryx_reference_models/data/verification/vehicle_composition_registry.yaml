        required_control_intents: [wrench]
      - id: local_wrench_lqi_recovery_screen
        status: runnable
        description: Bounded local six-axis direct-wrench body-speed LQI recovery at the pinned source-load operating point; it is not a physical-effector or navigation segment.
        compatible_fidelities: [rigid_body_6dof_direct_wrench]
        required_control_intents: [wrench]
      - id: source_surface_pitch_authority_allocation_screen
        status: runnable
        description: Frozen Mach-1 DAVE-ML source-fixture pitch-authority request allocated through all seven bounded named source surfaces with declared local lag; it does not propagate state or execute feedback control.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        required_control_intents: [attitude_rate]
      - id: source_surface_attitude_rate_lqi_recovery_screen
        status: runnable
        description: Frozen-translation Mach-1 source-fragment local three-axis attitude/rate LQI recovery through bounded seven-surface DAVE-ML allocation.
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        required_control_intents: [attitude_rate, wrench]
      - id: source_booster_release
        status: development
        description: Pinned synthetic-booster release time for the source-aerodynamic replay witness.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: release_time_s, canonical_unit: s, required: true, description: Fixed source-witness booster release time.}]
        permitted_transition_events: [booster-release]
      - id: source_scheduled_bank
        status: development
        description: One retained source bank-schedule interval; this is replay configuration, not a caller guidance command.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: bank_command_deg, canonical_unit: deg, required: true, description: Fixed signed source schedule bank value.}, {id: duration_s, canonical_unit: s, required: true, description: Fixed source schedule interval duration.}]
      - id: source_ground_contact
        status: development
        description: Fixed source-witness propagation horizon with independent ground-contact terminal event.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof]
        parameters: [{id: horizon_s, canonical_unit: s, required: true, description: Fixed source-witness propagation horizon.}]
        permitted_transition_events: [ground_contact]
      - id: trim_capture
        status: development
        description: Capture a source-domain glide condition after release.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: duration_s, canonical_unit: s, required: true, description: Capture duration.}]
        required_control_intents: [alpha, bank]
      - id: glide_bank_reversal
        status: development
        description: Crossrange generation through a bounded signed bank command.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: bank_command_deg, canonical_unit: deg, required: true, description: Signed bank command; positive and negative values denote opposite turn senses.}, {id: target_crossrange_m, canonical_unit: m, required: true, description: Crossrange target.}]
        required_control_intents: [bank, alpha]
      - id: energy_handoff
        status: planned
        description: Terminal glide energy, crossrange, heading, and altitude corridor.
        compatible_fidelities: [point_mass_3dof, pseudo_6dof, rigid_body_6dof_direct_wrench, rigid_body_6dof_surface_allocated]
        parameters: [{id: target_altitude_m, canonical_unit: m, required: true, description: Handoff altitude.}, {id: target_energy, canonical_unit: J/kg, required: true, description: Specific-energy target.}, {id: target_heading_deg, canonical_unit: deg, required: true, description: Handoff heading.}]
        required_control_intents: [bank, alpha]
    mission_templates:
      - id: hl20_source_surface_pitch_authority_screen_v1
        status: runnable
        description: Nonlinear DAVE-ML seven-surface pitch-authority allocation screen at the verified scalar pitch-coefficient trim anchor; it is neither a full 6-DOF trim nor a glide guidance mission.
        mission_capability_adapter_id: taoryx.hl20_source_surface_pitch_authority_screen.capability.v1
        mission_capability_fidelities: [rigid_body_6dof_surface_allocated]
        semantic_translator_id: taoryx.hl20_source_surface_pitch_authority_screen.capability.v1
        semantic_translator_fidelities: [rigid_body_6dof_surface_allocated]
        initialization_contracts: [source_mach1_pitch_trim_anchor]
        compatible_fidelities: [rigid_body_6dof_surface_allocated]
        segment_sequence: [source_surface_pitch_authority_allocation_screen]
