          translator_id: taoryx.hummingbird.hover_yaw_contact.pseudo6dof.v1
          supported_transition_kinds: [success, timeout]
          supported_state_transfers: [previous_terminal_truth_state]
          timeout_constraint:
            source_nodes: any nonterminal declared mission instance
            target: declared final touchdown instance only
            result: safe touchdown recovery; skipped required objectives remain failures
          unsupported_transition_kinds: [abort, resource_limit, envelope_limit]
          claim_boundary: This is the one declared Hummingbird timeout recovery extension. It does not make a timeout a successful mission or imply general branching for the multirotor family.

  - family_id: hl20_mod_k
    initialization_contracts:
      - id: source_subsonic_local_point
        status: runnable
