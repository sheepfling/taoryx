    model_kind: source_derived_reduced_model
    control_realization: response_law
    status: nominal_case_pass
    evidence_grade: mixed
    response:
      roll: {time_constant_s: 1.2, damping_ratio: 0.78, maximum_rate_rad_s: 0.35, maximum_acceleration_rad_s2: 0.5}
      pitch: {time_constant_s: 1.5, damping_ratio: 0.78, maximum_rate_rad_s: 0.25, maximum_acceleration_rad_s2: 0.35}
      yaw: {time_constant_s: 1.8, damping_ratio: 0.8, maximum_rate_rad_s: 0.2, maximum_acceleration_rad_s2: 0.25}
