    unsupported_claims: [source_exact_airbus_dynamics, physical_surface_allocation]
  - id: f16_s119.attitude_response_p6dof.v1
    family_id: f16_s119
    parent_3dof_profile_id: f16_s119.point_mass_3dof.v1
    model_kind: source_derived_reduced_model
    control_realization: response_law
    status: nominal_case_pass
    evidence_grade: source_derived
    response:
      roll: {time_constant_s: 0.45, damping_ratio: 0.7, maximum_rate_rad_s: 1.4, maximum_acceleration_rad_s2: 5.0}
      pitch: {time_constant_s: 0.7, damping_ratio: 0.75, maximum_rate_rad_s: 0.7, maximum_acceleration_rad_s2: 2.5}
      yaw: {time_constant_s: 0.9, damping_ratio: 0.8, maximum_rate_rad_s: 0.45, maximum_acceleration_rad_s2: 1.2}
    resource_channels: [fuel, mass]
    required_channels: [bank, pitch, heading, alpha, beta, load_factor]
    unsupported_claims: [physical_surface_allocation_outside_declared_plant, supersonic_fidelity]
  - id: x15.attitude_response_p6dof.v1
    family_id: x15
    parent_3dof_profile_id: x15.point_mass_3dof.v1
    model_kind: source_derived_reduced_model
    control_realization: response_law
    status: nominal_case_pass
    evidence_grade: mixed
    response:
      # The reachability bridge historically used one 0.35 s first-order
      # response with a 3600 deg/s ceiling.  Preserve that checkpoint while
      # making the response law explicit; the richer scheduled values belong
      # to the native X-15 refinement, not this reduced envelope screen.
      roll: {time_constant_s: 0.35, damping_ratio: 0.7, maximum_rate_rad_s: 62.8318530718, maximum_acceleration_rad_s2: 100.0}
      pitch: {time_constant_s: 0.35, damping_ratio: 0.75, maximum_rate_rad_s: 62.8318530718, maximum_acceleration_rad_s2: 100.0}
      yaw: {time_constant_s: 0.35, damping_ratio: 0.8, maximum_rate_rad_s: 62.8318530718, maximum_acceleration_rad_s2: 100.0}
    # The phase schedule is an engineering response bridge, not a source
    # exact X-15 flight-control law.  Keeping it in the profile makes the
    # powered/coast/glide regime boundary explicit and replayable.
    phase_response:
      boost:
        roll: {time_constant_s: 0.25, damping_ratio: 0.7, maximum_rate_rad_s: 3.0, maximum_acceleration_rad_s2: 10.0}
        pitch: {time_constant_s: 0.30, damping_ratio: 0.75, maximum_rate_rad_s: 2.5, maximum_acceleration_rad_s2: 8.0}
        yaw: {time_constant_s: 0.35, damping_ratio: 0.8, maximum_rate_rad_s: 1.5, maximum_acceleration_rad_s2: 5.0}
      coast:
        roll: {time_constant_s: 0.45, damping_ratio: 0.7, maximum_rate_rad_s: 1.5, maximum_acceleration_rad_s2: 4.0}
        pitch: {time_constant_s: 0.55, damping_ratio: 0.75, maximum_rate_rad_s: 1.2, maximum_acceleration_rad_s2: 3.0}
        yaw: {time_constant_s: 0.65, damping_ratio: 0.8, maximum_rate_rad_s: 0.8, maximum_acceleration_rad_s2: 2.0}
      glide:
        roll: {time_constant_s: 0.75, damping_ratio: 0.7, maximum_rate_rad_s: 0.6, maximum_acceleration_rad_s2: 1.5}
        pitch: {time_constant_s: 0.90, damping_ratio: 0.75, maximum_rate_rad_s: 0.45, maximum_acceleration_rad_s2: 1.0}
        yaw: {time_constant_s: 1.10, damping_ratio: 0.8, maximum_rate_rad_s: 0.30, maximum_acceleration_rad_s2: 0.75}
    resource_channels: [propellant, mass]
    required_channels: [bank, pitch, heading, speed, altitude, dynamic_pressure]
    unsupported_claims: [regime_unvalidated_authority, phase_schedule_source_exactness, physical_surface_allocation]
  - id: hummingbird.attitude_response_p6dof.v1
    family_id: hummingbird
    parent_3dof_profile_id: hummingbird.point_mass_3dof.v1
    model_kind: thrust_vector_surrogate
    control_realization: response_law
    status: nominal_case_pass
    evidence_grade: derived
    response:
      roll: {time_constant_s: 0.18, damping_ratio: 0.8, maximum_rate_rad_s: 3.0, maximum_acceleration_rad_s2: 15.0}
      pitch: {time_constant_s: 0.18, damping_ratio: 0.8, maximum_rate_rad_s: 3.0, maximum_acceleration_rad_s2: 15.0}
      yaw: {time_constant_s: 0.25, damping_ratio: 0.8, maximum_rate_rad_s: 2.0, maximum_acceleration_rad_s2: 8.0}
    resource_channels: [battery, thrust]
    required_channels: [roll, pitch, yaw, position, velocity, thrust]
    unsupported_claims: [motor_level_allocation, blade_aerodynamics, rotor_inflow]
  - id: hl20.attitude_response_p6dof.v1
    family_id: hl20_mod_k
    parent_3dof_profile_id: hl20_mod_k.point_mass_3dof.v1
    model_kind: source_derived_reduced_model
    control_realization: response_law
    status: nominal_case_pass
    evidence_grade: source_derived
    response:
      roll: {time_constant_s: 1.0, damping_ratio: 0.75, maximum_rate_rad_s: 0.7, maximum_acceleration_rad_s2: 1.8}
      pitch: {time_constant_s: 1.1, damping_ratio: 0.75, maximum_rate_rad_s: 0.45, maximum_acceleration_rad_s2: 1.2}
      yaw: {time_constant_s: 1.4, damping_ratio: 0.8, maximum_rate_rad_s: 0.25, maximum_acceleration_rad_s2: 0.6}
    resource_channels: [mass]
    required_channels: [bank, pitch, heading, alpha, energy, crossrange]
    unsupported_claims: [thermal_model, physical_surface_allocation_without_source_data]
  - id: nesc_rocket.attitude_response_p6dof.v1
    family_id: reference_nesc_two_stage_rocket
    parent_3dof_profile_id: nesc_rocket.performance_3dof.v1
    model_kind: thrust_vector_surrogate
    control_realization: response_law
    status: nominal_case_pass
    evidence_grade: mixed
    response:
      roll: {time_constant_s: 0.8, damping_ratio: 0.7, maximum_rate_rad_s: 0.8, maximum_acceleration_rad_s2: 2.0}
      pitch: {time_constant_s: 0.9, damping_ratio: 0.75, maximum_rate_rad_s: 0.55, maximum_acceleration_rad_s2: 1.4}
      yaw: {time_constant_s: 1.0, damping_ratio: 0.75, maximum_rate_rad_s: 0.45, maximum_acceleration_rad_s2: 1.0}
    # The retained DAVE-ML history supplies phase labels but no independent
    # attitude channel. These are bounded response assumptions attached to
    # those labels, not source-exact gimbal dynamics.
    phase_response:
      stage1_burn:
        roll: {time_constant_s: 0.55, damping_ratio: 0.7, maximum_rate_rad_s: 1.2, maximum_acceleration_rad_s2: 3.0}
        pitch: {time_constant_s: 0.65, damping_ratio: 0.75, maximum_rate_rad_s: 0.9, maximum_acceleration_rad_s2: 2.5}
        yaw: {time_constant_s: 0.75, damping_ratio: 0.75, maximum_rate_rad_s: 0.7, maximum_acceleration_rad_s2: 2.0}
      stage2_burn:
        roll: {time_constant_s: 0.70, damping_ratio: 0.7, maximum_rate_rad_s: 0.95, maximum_acceleration_rad_s2: 2.4}
        pitch: {time_constant_s: 0.80, damping_ratio: 0.75, maximum_rate_rad_s: 0.7, maximum_acceleration_rad_s2: 1.9}
        yaw: {time_constant_s: 0.90, damping_ratio: 0.75, maximum_rate_rad_s: 0.55, maximum_acceleration_rad_s2: 1.5}
      stack_coast:
        roll: {time_constant_s: 0.95, damping_ratio: 0.7, maximum_rate_rad_s: 0.65, maximum_acceleration_rad_s2: 1.6}
        pitch: {time_constant_s: 1.05, damping_ratio: 0.75, maximum_rate_rad_s: 0.5, maximum_acceleration_rad_s2: 1.2}
        yaw: {time_constant_s: 1.20, damping_ratio: 0.75, maximum_rate_rad_s: 0.38, maximum_acceleration_rad_s2: 0.9}
      orbit_coast:
        roll: {time_constant_s: 1.10, damping_ratio: 0.7, maximum_rate_rad_s: 0.5, maximum_acceleration_rad_s2: 1.2}
        pitch: {time_constant_s: 1.20, damping_ratio: 0.75, maximum_rate_rad_s: 0.4, maximum_acceleration_rad_s2: 0.9}
        yaw: {time_constant_s: 1.35, damping_ratio: 0.75, maximum_rate_rad_s: 0.3, maximum_acceleration_rad_s2: 0.7}
    resource_channels: [propellant, mass]
    required_channels: [bank, pitch, yaw, body_rates, stage, deployment_state]
    unsupported_claims: [source_exact_gimbal_effectivity, plume_interaction]
  - id: tumbling_body.rigid_body_reuse_p6dof.v1
    family_id: tumbling_body
    parent_3dof_profile_id: tumbling_body.average_area_3dof.v1
    model_kind: rigid_body_reuse
    control_realization: uncontrolled
    # This is a passing pseudo-tier realization because it reuses the native
    # rigid-body equations.  It remains ineligible for controller lowering:
    # passive rotation has no control law to synthesize.
    status: nominal_case_pass
    evidence_grade: derived
    resource_channels: [mass]
    required_channels: [quaternion, body_rates, projected_area, aerodynamic_moment, angular_momentum]
    unsupported_claims: [prescribed_tumble_as_physical_proof]
    area_policy: average_projected_area
    area_source: geometry-specific orientation average or steady-stage cross-section

