[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-reference-models"
version = "0.1.0a0"
description = "Source-backed and analytical reference vehicle models for Taoryx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "taoryx>=0.1.0a0,<0.2",
  "taoryx-daveml>=0.1.0a0,<0.2",
  "taoryx-simple-aero>=0.1.0a0,<0.2",
]

[project.entry-points."taoryx.plugins"]
"taoryx.reference-models" = "taoryx_reference_models.plugin:PLUGIN"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
taoryx_reference_models = ["data/**/*", "data/**/**/*", "data/**/**/**/*", "data/**/**/**/**/*"]
