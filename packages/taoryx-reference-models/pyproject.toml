[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-reference-models"
version = "0.1.0a0"
description = "Compatibility aggregate Mission Composition provider for Taoryx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "taoryx>=0.1.0a0,<0.2",
  "taoryx-a320>=0.1.0a0,<0.2",
  "taoryx-f16>=0.1.0a0,<0.2",
  "taoryx-hummingbird>=0.1.0a0,<0.2",
  "taoryx-nesc>=0.1.0a0,<0.2",
  "taoryx-dual-launch>=0.1.0a0,<0.2",
  "taoryx-simple-aero>=0.1.0a0,<0.2",
  "taoryx-x15>=0.1.0a0,<0.2",
  "taoryx-hl20>=0.1.0a0,<0.2",
  "taoryx-source-table-fixed-wing>=0.1.0a0,<0.2",
]

[project.entry-points."taoryx.plugins"]
"taoryx.reference-models" = "taoryx_reference_models.plugin:PLUGIN"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
taoryx_reference_models = ["data/**/*", "data/**/**/*", "data/**/**/**/*", "data/**/**/**/**/*"]
