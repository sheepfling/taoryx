[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-trajectory-contracts"
version = "0.1.0a0"
description = "Versioned composition, batch, streaming-control, and ECEF contracts for trajectory providers"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "taoryx contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["pydantic>=2.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taoryx_trajectory_contracts = ["py.typed"]
