[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-nesc"
version = "0.1.0a0"
description = "NASA/NESC two-stage source-replay vehicle plug-in for Taoryx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "taoryx>=0.1.0a0,<0.2",
  "taoryx-daveml>=0.1.0a0,<0.2",
]

[project.entry-points."taoryx.plugins"]
"taoryx.nesc" = "taoryx_nesc.plugin:PLUGIN"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
taoryx_nesc = ["data/**/*", "data/**/**/*", "data/**/**/**/*", "data/**/**/**/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
