schema: taoryx.vehicle-compose-request/v1alpha1
id: nesc-staged-source-replay-3dof-v1
vehicle: reference_nesc_two_stage_rocket
fidelity: point_mass_3dof
initialization:
  id: pad_launch
  inputs:
    latitude_deg: {value: 0.0, unit: deg}
    longitude_deg: {value: 0.0, unit: deg}
    initial_mass_kg: {value: 314000.0, unit: kg}
    initial_heading_deg: {value: 90.0, unit: deg}
mission:
  id: staged_rocket_launch_target_state_v1
segments:
  - id: ignition_ascent
    instance_id: stage1-ascent
    inputs:
      pitch_program: {value: 0.0, unit: deg}
  - id: stage_separation
    instance_id: source-staging
    inputs:
      separation_delay_s: {value: 97.6, unit: s}
  - id: ignition_ascent
    instance_id: stage2-ascent
    inputs:
      pitch_program: {value: 0.0, unit: deg}
  - id: coast_terminal_state
    instance_id: orbit-coast-terminal
    inputs:
      terminal_kind: {value: orbit}
