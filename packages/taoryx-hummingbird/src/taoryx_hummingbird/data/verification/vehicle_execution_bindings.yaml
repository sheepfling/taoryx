schema: taoryx.vehicle-execution-bindings/v1alpha1
version: 1
description: Explicit source-owned execution bindings for compiled vehicle compositions.
  An entry is a public capability declaration, not a generic family fallback. Omitted
  vehicle/fidelity/mission combinations are unavailable until their own native binding
  exists.
bindings:
- family_id: hummingbird
  mission: hummingbird_local_individual_rotor_lqi_screen_v1
  fidelity: rigid_body_6dof_surface_allocated
  operation: batch
  status: runnable
  execution_mode: closed_loop_controller
  factory_id: hummingbird_local_individual_rotor_lqi_screen.v1
  batch_action_trace: emits_committed_interval_trace
  description: Execute the source-hover one-second Hummingbird LQI screen through
    bounded four-rotor allocation and motor lag.
  claim_boundary: Local source-hover attitude/rate LQI and physical rotor-allocation
    screen only; it is not position, wind, battery, landing, gain-schedule, or qualification
    evidence.
