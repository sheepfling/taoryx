[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-debug-models"
version = "0.1.0a0"
description = "Development-only Mission Composition models for Taoryx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["taoryx>=0.1.0a0,<0.2"]

[project.entry-points."taoryx.plugins"]
"taoryx.debug-models" = "taoryx_debug_models.plugin:PLUGIN"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
taoryx_debug_models = ["data/**/*", "data/**/**/*", "data/**/**/**/*", "data/**/**/**/**/*"]
