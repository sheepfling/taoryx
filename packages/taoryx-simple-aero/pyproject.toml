[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-simple-aero"
version = "0.1.0a0"
description = "Simple Aero analytical models and providers for Taoryx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["taoryx>=0.1.0a0,<0.2"]

[project.entry-points."taoryx.plugins"]
"taoryx.simple-aero" = "taoryx_simple_aero.plugin:PLUGIN"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
taoryx_simple_aero = ["data/**/*", "data/**/**/*", "data/**/**/**/*", "data/**/**/**/**/*"]
