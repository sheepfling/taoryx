[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-daveml"
version = "0.1.0a0"
description = "DAVE-ML import, semantic, evaluation, and replay support for Taoryx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["taoryx>=0.1.0a0,<0.2"]

[project.entry-points."taoryx.plugins"]
"taoryx.daveml" = "taoryx_daveml.plugin:PLUGIN"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
