[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taoryx-passive-bodies"
version = "0.1.0a0"
description = "Reusable passive released-body model plug-in for Taoryx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "taoryx>=0.1.0a0,<0.2",
]

[project.entry-points."taoryx.plugins"]
"taoryx.passive-bodies" = "taoryx_passive_bodies.plugin:PLUGIN"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
taoryx_passive_bodies = ["data/**/*", "data/**/**/*", "data/**/**/**/*", "data/**/**/**/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
